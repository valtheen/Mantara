// ---------- JENIS SEKOLAH menurut origin ----------
// tiap origin punya jalur sekolah default; bisa beda nama tiap generate
const SCHOOL_TRACKS={
  mageborn:{type:"sihir",ico:"🔮",statFocus:"mana",
    names:[["Sanggar Tunas Arcane","Padepokan Mantra","Konservatorium Arcanum"],
           ["Surau Rune","Balai Sihir Muda","Kuil Aether"],
           ["Sekolah Aether Dasar","Lyceum Arcane","Akademi Bintang"]]},
  noble:{type:"bangsawan",ico:"👑",statFocus:"charm",
    names:[["Taman Kanak Ningrat","Sekolah Etiket","Pondok Tata Krama"],
           ["Balai Bangsawan","Kolese Istana","Sanggar Diplomasi"],
           ["Akademi Kerajaan","Lyceum Aurelia","Kolese Tinggi Aetheria"]]},
  merchant_kid:{type:"dagang",ico:"⚖️",statFocus:"mind",
    names:[["Sekolah Hitung Dasar","Surau Niaga","Balai Timbang"],
           ["Kolese Dagang","Sekolah Saudagar","Balai Bursa Muda"],
           ["Akademi Niaga Tinggi","Guild Saudagar Agung","Lyceum Perdagangan"]]},
  // peasant & orphan: jalur umum (rakyat) — sekolah desa lalu pilih spesialisasi
  _default:{type:"umum",ico:"📖",statFocus:"mind",
    names:[["Sekolah Desa","Surau Rakyat","Balai Belajar"],
           ["Sekolah Menengah Kota","Kolese Rakyat","Balai Ilmu"],
           ["Akademi Umum","Lyceum Kota","Kolese Tinggi"]]},
};

// jenjang: usia masuk & lulus (ambil tengah dari rentang yg user sebut)
const SCHOOL_LEVELS=[
  {tier:0,name:"Dasar",enterAge:5,gradAge:9},     // 4/5/6 -> 8/9/10
  {tier:1,name:"Menengah",enterAge:9,gradAge:12}, // 8/9/10 -> 11/12/13
  {tier:2,name:"Tinggi",enterAge:12,gradAge:16},  // 11/12/13 -> 15/16/17
];

function trackFor(origin){return SCHOOL_TRACKS[origin]||SCHOOL_TRACKS._default;}

// ---------- inisialisasi data sekolah saat karakter dibuat ----------
function initSchool(){
  const track=trackFor(C.origin);
  // randomize nama tiap jenjang
  C.school={
    track:track.type, ico:track.ico, statFocus:track.statFocus,
    levelNames:SCHOOL_LEVELS.map((lv,i)=>rand(track.names[i])),
    currentTier:-1,     // -1 = belum sekolah
    enrolled:false,
    failsThisYear:0,    // attempt kuis tahun ini (max 2)
    totalFails:0,       // gagal beruntun (3 = dropout)
    graduated:[],       // tier yg sudah lulus
    droppedOut:false,
    yearsInTier:0,
  };
}

// ---------- cek apakah waktunya masuk sekolah (dipanggil tiap tahun) ----------
function checkSchoolEnrollment(){
  if(!C.school||C.school.droppedOut)return;
  const s=C.school;
  // sudah di jenjang? skip
  if(s.enrolled)return;
  // cari jenjang yg cocok umur & belum lulus
  for(const lv of SCHOOL_LEVELS){
    if(s.graduated.includes(lv.tier))continue;
    if(C.age>=lv.enterAge && C.age<lv.gradAge+2){
      // tawarkan masuk (otomatis untuk jenjang dasar; pilihan untuk tinggi)
      s.currentTier=lv.tier;s.enrolled=true;s.yearsInTier=0;s.failsThisYear=0;
      log(C.age,`📚 Kau masuk ${s.levelNames[lv.tier]} (Jenjang ${lv.name}).`,"e-good");
      return;
    }
  }
}

// ---------- KUIS KENAIKAN (dipanggil tiap tahun saat bersekolah) ----------
// soal acak sesuai statFocus; jawab benar = lulus tahun; salah = gagal attempt
const QUIZ_BANK={
  mana:[
    {q:"Elemen apa yang melawan Api dalam sihir dasar?",opts:["Air","Tanah","Logam"],a:0},
    {q:"Sumber kekuatan penyihir disebut?",opts:["Stamina","Mana","Iman"],a:1},
    {q:"Mantra perisai termasuk sihir...",opts:["Serangan","Pertahanan","Penyembuhan"],a:1},
    {q:"Kristal apa yang memperkuat mana?",opts:["Batu bara","Kristal Aether","Garam"],a:1},
  ],
  mind:[
    {q:"3 ditambah 4 dikali 2 = ?",opts:["14","11","10"],a:1},
    {q:"Jika beli 5 keping/buah, 6 buah harganya?",opts:["30","25","36"],a:0},
    {q:"Lawan kata 'untung' adalah?",opts:["Laba","Rugi","Modal"],a:1},
    {q:"Pasar paling ramai biasanya pada?",opts:["Tengah malam","Pagi hari","Subuh buta"],a:1},
  ],
  charm:[
    {q:"Saat bertemu Raja, kita harus?",opts:["Menunduk hormat","Menepuk pundak","Berteriak"],a:0},
    {q:"Etika makan bangsawan: sendok dipegang?",opts:["Tangan kiri saja","Sesuai aturan meja","Tidak pakai sendok"],a:1},
    {q:"Cara terbaik memenangkan hati orang?",opts:["Memaksa","Mendengarkan","Mengabaikan"],a:1},
    {q:"Pakaian ke pesta istana sebaiknya?",opts:["Lusuh","Rapi & anggun","Zirah perang"],a:1},
  ],
};

function startQuiz(){
  const s=C.school;
  const bank=QUIZ_BANK[s.statFocus]||QUIZ_BANK.mind;
  const soal=rand(bank);
  // bonus: stat tinggi kadang kasih "petunjuk" (auto-pass chance kecil)
  const lvName=s.levelNames[s.currentTier];
  openChoice({ico:"📝",cancel:false,
    prompt:`<b>Kuis Kenaikan — ${lvName}</b><br><span style="font-size:12px">${soal.q}</span><br><span style="font-size:10.5px;color:var(--ink-soft);filter:brightness(1.6)">Attempt ${s.failsThisYear+1}/2 · ${s.statFocus==="mana"?"Mana":s.statFocus==="charm"?"Pesona":"Akal"}mu bantu sedikit</span>`,
    choices:soal.opts.map((opt,i)=>({label:opt,run:()=>{
      gradeQuiz(i===soal.a);return null;
    }}))});
}
function gradeQuiz(correct){
  const s=C.school;const lv=SCHOOL_LEVELS[s.currentTier];
  // stat tinggi bisa "selamatkan" jawaban salah dgn peluang kecil
  const statVal=C.stats[s.statFocus]||0;
  const saved=!correct && chance(statVal/300); // maks ~33% di stat 100
  if(correct||saved){
    closeModal();
    playAnim("win",{text:"LULUS!"});
    s.failsThisYear=0;s.totalFails=0;
    applyStats({[s.statFocus]:+ri(3,6),happy:+4});
    setTimeout(()=>{
      // lulus jenjang kalau sudah cukup umur
      if(C.age>=lv.gradAge){
        s.graduated.push(s.currentTier);s.enrolled=false;
        log(C.age,`🎓 Kau LULUS ${s.levelNames[s.currentTier]} (Jenjang ${lv.name})! ${saved?'(terselamatkan ilmu)':''}`,"e-epic");
        // gelar jika lulus jenjang tinggi
        if(s.currentTier===2){C.flags["diploma_"+s.track]=1;C.reputation+=10;
          log(C.age,`Ijazah ${s.track} kini menjadi syarat karir tingkat tinggi.`,"e-good");}
      }else{
        log(C.age,`Kau naik kelas di ${s.levelNames[s.currentTier]}. ${saved?'(nyaris gagal, tapi ilmumu menyelamatkan)':'Bagus!'}`,"e-good");
      }
      updateTitle();renderAll();
    },800);
  }else{
    closeModal();
    s.failsThisYear++;
    if(s.failsThisYear>=2){
      // gagal tahun ini -> ulang setahun
      s.totalFails++;s.failsThisYear=0;
      playAnim("lose",{text:"TIDAK NAIK"});
      if(s.totalFails>=3){
        s.droppedOut=true;s.enrolled=false;
        log(C.age,`💔 Kau gagal 3 kali & DROPOUT dari ${s.levelNames[s.currentTier]}. Pilih jalan hidup lain.`,"e-bad");
        applyStats({happy:-10});
      }else{
        log(C.age,`Kau gagal kuis tahun ini & harus mengulang. (gagal ${s.totalFails}/3)`,"e-bad");
        applyStats({happy:-5});
      }
      setTimeout(()=>{updateTitle();renderAll();},800);
    }else{
      // masih ada attempt ke-2
      log(C.age,`Jawaban salah! Sisa 1 attempt.`,"e-bad");
      setTimeout(()=>startQuiz(),600);
    }
  }
}

// ---------- proses sekolah tiap tahun ----------
function processSchool(){
  if(!C.school||C.school.droppedOut)return;
  checkSchoolEnrollment();
  const s=C.school;
  if(s.enrolled){
    s.yearsInTier++;
    // picu kuis (ditampilkan setelah event tahunan via antrian)
    C._quizPending=true;
  }
}

// snapshot stat sebelum aksi, untuk hitung delta yg ditampilkan di result popup
let _statSnapshot=null;
function snapStats(){
  if(typeof C==="undefined"||!C||!C.stats){_statSnapshot=null;return;}
  _statSnapshot={...C.stats,coin:C.coin,reputation:C.reputation};
}
function statDeltas(){
  if(!_statSnapshot)return [];
  const out=[];
  for(const k of STAT_ORDER){
    const d=Math.round(C.stats[k])-Math.round(_statSnapshot[k]);
    if(d!==0)out.push({label:STAT_META[k].name,d});
  }
  const dc=C.coin-_statSnapshot.coin; if(dc!==0)out.push({label:"Koin",d:dc,coin:true});
  const dr=C.reputation-_statSnapshot.reputation; if(dr!==0)out.push({label:"Reputasi",d:dr});
  return out;
}

// ---------- RESULT POPUP: untuk aksi tanpa pilihan ----------
// tampilkan hasil + ringkasan dampak yg rapi. opts:{ico,title,body,cls,anim,animText}
function showResult(opts){
  const deltas=statDeltas();
  const deltaHTML=deltas.length?`<div class="res-deltas">`+
    deltas.map(x=>{
      const pos=x.d>0;
      return `<span class="res-delta ${pos?'up':'down'}">${x.coin?'💰':''}${x.label} ${pos?'+':''}${x.d}</span>`;
    }).join("")+`</div>`:'';
  pendingChoice={data:{_isResult:true}};
  setModalIco(document.getElementById("mico"),opts.ico||"✨");
  document.getElementById("mprompt").innerHTML=
    `${opts.title?`<div class="res-title ${opts.cls||''}">${opts.title}</div>`:''}
     <div class="res-body">${opts.body||''}</div>${deltaHTML}`;
  document.getElementById("mchoices").innerHTML=
    `<button class="mchoice mc-ok" onclick="closeModal()">Lanjut ▸</button>`;
  document.getElementById("modal").classList.add("show");
  document.getElementById("btnAge").disabled=true;
  // catatan: animasi overlay sengaja TIDAK diputar di sini supaya tidak menimpa
  // teks result popup. Animasi standalone (turnamen/gambling) tetap diputar di tempatnya.
}

// ---------- pemicu aging event (dipanggil tiap advanceYear) ----------
function rollAgingEvent(){
  if(!C||!C.alive)return false;
  if(!C._agingDone)C._agingDone={};
  const pool=AGING_EVENTS.filter(e=>{
    if(C.age<e.min||C.age>e.max)return false;
    if(e.once&&C._agingDone[e.id])return false;
    if(e.cond&&!e.cond(C))return false;
    return true;
  });
  if(!pool.length)return false;
  const ev=rand(pool);
  if(ev.once)C._agingDone[ev.id]=1;
  const data=ev.build();
  // bungkus choices supaya hasil tampil via result-style (log + render)
  const wrapped={ico:data.ico,prompt:data.prompt,cancel:false,
    choices:data.choices.map(ch=>({label:ch.label,sub:ch.sub,cls:ch.cls,run:()=>{
      const res=ch.run();
      if(res&&res.t){log(C.age,res.t,res.cls);
        // tampilkan ringkasan setelah pilih (pakai finishAct-style)
        setTimeout(()=>{if(typeof finishAct==="function"){/* finishAct already snapshots via openChoice */}},0);
      }
      return res;
    }}))};
  // snapshot utk delta, lalu buka
  if(typeof snapStats==="function")snapStats();
  openChoice(wrapped);
  return true;
}

// ============================================================
//  PATCH — Integrasi Aging Events
// ============================================================

// ---------- bungkus advanceYear: SELALU coba aging event tiap tambah umur ----------
// urutan: proses tahunan & event lama jalan dulu (via _aging_prevAdvance),
// LALU kalau tak ada modal terbuka, picu aging event.
const _aging_prevAdvance=advanceYear;
advanceYear=function(){
  // reset penanda lulus tahun ini
  C._justGraduated=false;
  _aging_prevAdvance.call(this);
  // setelah semua proses, kalau hidup & layar bebas, picu aging event
  if(C&&C.alive){
    if(!pendingChoice){
      rollAgingEvent();
    }else{
      // ada modal (event/kuis/sewa) — antrekan aging event setelah modal ditutup
      C._agingQueued=true;
    }
  }
};

// ---------- saat modal ditutup, jalankan aging event yg terantre ----------
const _aging_prevClose=closeModal;
closeModal=function(){
  _aging_prevClose();
  if(C&&C.alive&&C._agingQueued&&!pendingChoice){
    C._agingQueued=false;
    setTimeout(()=>{if(C.alive&&!pendingChoice)rollAgingEvent();},200);
  }
};

// ---------- tandai _justGraduated saat lulus jenjang (untuk grad_gift) ----------
// gradeQuiz menambah ke s.graduated; kita pantau lewat wrapper
if(typeof gradeQuiz==="function"){
  const _aging_prevGrade=gradeQuiz;
  gradeQuiz=function(correct){
    const before=C.school?C.school.graduated.length:0;
    _aging_prevGrade(correct);
    // cek apakah jumlah lulus bertambah (lulus jenjang)
    setTimeout(()=>{
      if(C.school&&C.school.graduated.length>before){C._justGraduated=true;
        // picu grad_gift segera kalau layar bebas
        if(!pendingChoice){const ev=AGING_EVENTS.find(e=>e.id==="grad_gift");
          if(ev&&ev.cond(C)){const data=ev.build();
            if(typeof snapStats==="function")snapStats();
            openChoice({ico:data.ico,prompt:data.prompt,cancel:false,choices:data.choices});}}}
    },900);
  };
}

// lengkapi profil saat relasi dibuat (lazy: hanya kalau belum ada)
function ensureProfile(r){
  if(r._profile)return r._profile;
  const sibCount=ri(0,4);
  const sibs=[];for(let i=0;i<sibCount;i++)sibs.push(randName(chance(0.5)).split(" ")[0]);
  r._profile={
    age:C.age+ri(-3,5),
    job:r.role==="keluarga"?"—":rand(NPC_JOBS),
    origin:rand(NPC_ORIGINS),
    wealth:rand(WEALTH_TIERS),
    married:chance(0.4),
    children:chance(0.3)?ri(1,3):0,
    siblings:sibs,
    parents:[randName(false).split(" ")[0],randName(true).split(" ")[0]],
    ambition:rand(["jadi kaya raya","menemukan cinta sejati","membalas dendam","menjadi ksatria","menguasai sihir","hidup tenang","membuka usaha","menjelajah dunia"]),
    secret:rand(["pernah jadi pencuri","keturunan bangsawan tersembunyi","takut pada sihir","berhutang besar","mencintai diam-diam seseorang","menyimpan harta karun"]),
  };
  // tingkat keterbukaan info: 0=belum kenal dalam, naik tiap ngobrol
  if(r._known===undefined)r._known=0;
  return r._profile;
}

  lines.push(`Ikatan: ${Math.round(r.role==="pengikut"?r.loyalty:r.bond)} · kenal ${C.age-r.met} thn`);
  if(known>=1){lines.push(`Umur: ~${p.age} · Pekerjaan: ${p.job}`);lines.push(`Asal: ${p.origin}`);}
  else lines.push(`<i style="color:var(--ink-soft)">Ngobrol lebih sering untuk tahu pekerjaan & asal...</i>`);
  if(known>=2){lines.push(`Kekayaan: ${p.wealth}`);lines.push(`Keluarga: ortu ${p.parents.join(" & ")}${p.siblings.length?`, saudara ${p.siblings.join(", ")}`:", anak tunggal"}`);}
  if(known>=3){lines.push(`Status nikah: ${p.married?`menikah${p.children?`, ${p.children} anak`:""}`:"lajang"}`);}
  if(known>=4){lines.push(`Ambisi: ${p.ambition}`);}
  if(known>=6){lines.push(`<span style="color:var(--arcane-glow)">Rahasia: ${p.secret}</span>`);}
  openChoice({ico:r.ico,prompt:`<div style="text-align:left;font-size:12.5px;line-height:1.7">${lines.join("<br>")}</div>`,
    choices:[
      {label:"💬 Ajak ngobrol",run:()=>{closeModal();setTimeout(()=>openConversation(relId),140);return null;}},
    ]});
}

// helper beli barang wardrobe/gear/item lewat store (dibeli = dimiliki + langsung dipakai)
function storeBuyWardrobe(slot,key,price,name){
  if(C.coin<price){toast("Koin tak cukup.");return;}
  ensureWardrobe();C.coin-=price;
  if(!C.wardrobeOwned[slot].includes(key))C.wardrobeOwned[slot].push(key);
  C.wardrobe[slot]=key;applyWardrobePerks();
  finishAct(`Kau membeli & memakai ${name}. Tersimpan di Wardrobe (Aset).`,"e-good");
}
function storeBuyGear(cat,key,price,name){
  if(C.coin<price){toast("Koin tak cukup.");return;}
  C.coin-=price;C.gear[cat]=key;
  finishAct(`Kau membeli ${name}.`,"e-good");
}
function storeService(cost,effect,msg,cls){
  if(C.coin<cost){toast("Koin tak cukup.");return;}
  if(!spendAction())return;
  C.coin-=cost;applyStats(effect);finishAct(msg,cls||"e-good");
}

// ---------- toko mana yang ada di kota saat ini ----------
function storesInCity(){
  return STORES.filter(s=>s.city.includes("all")||s.city.includes(C.cityId));
}

// ---------- buka katalog toko ----------
function openStore(storeId){
  const s=STORES.find(x=>x.id===storeId);if(!s)return;
  const items=s.build();
  snapStats&&snapStats();
  const stockNote=(s.cat==="Bimbel"||s.cat==="Perguruan")?"":`<br><span style="font-size:10px;color:var(--gold);filter:brightness(1.1)">📦 Stok berganti tiap tahun & beda tiap kota</span>`;
  openChoice({ico:s.ico,prompt:`<b>${s.name}</b> — ${s.cat}<br><span style="font-size:11px;color:var(--ink-soft);filter:brightness(1.6)">${s.desc} · Koinmu: ${C.coin}</span>${stockNote}`,
    choices:items.map(it=>{
      const locked=C.age<(it.minAge||0);
      const afford=it.price===0||C.coin>=it.price;
      return {label:it.label,sub:locked?`🔒 min ${it.minAge} th`:it.sub,disabled:locked||!afford,
        run:()=>{closeModal();setTimeout(()=>{recordActivity&&recordActivity(`${s.name}: ${it.label}`,()=>{snapStats&&snapStats();it.run();});it.run();},120);return null;}};
    })});
}

// ---------- render distrik toko (dipanggil di renderPeta) ----------
function storeDistrictHTML(){
  const stores=storesInCity();
  if(!stores.length)return "";
  let html=`<div class="sechead">🏪 Distrik Toko ${currentCity().name}</div>
    <p style="font-size:10.5px;color:var(--ink-soft);filter:brightness(1.6);margin:0 4px 10px;">Tiap toko punya barang & jasa khas. Klik untuk lihat katalog.</p>
    <div class="tiles">`;
  stores.forEach(s=>{
    html+=`<div class="tile store-tile" onclick="openStore('${s.id}')">
      <span class="ti">${s.ico}</span><span class="tn">${s.name}</span>
      <span class="td">${s.cat}</span></div>`;
  });
  html+=`</div>`;
  return html;
}

// tiap tipe punya latar; encounter mempertemukan 2 latar berbeda dgn dinamika unik
const ENCOUNTER_TYPES=[
  {bg:"penyihir",ico:"🧙",jobs:["Penyihir","Murid Akademi","Peramal"]},
  {bg:"bangsawan",ico:"👑",jobs:["Bangsawan","Pewaris","Adipati"]},
  {bg:"saudagar",ico:"💰",jobs:["Saudagar","Pedagang","Rentenir"]},
  {bg:"gladiator",ico:"🤺",jobs:["Gladiator","Petarung","Juara Arena"]},
  {bg:"kriminal",ico:"🗡️",jobs:["Pencuri","Penyelundup","Bandit"]},
  {bg:"diplomat",ico:"🕊️",jobs:["Diplomat","Utusan","Duta"]},
  {bg:"petualang",ico:"🗺️",jobs:["Petualang","Pemburu Harta","Penjelajah"]},
  {bg:"raja",ico:"👑",jobs:["Bangsawan Tinggi","Penasihat Raja"]},
];

// latar belakang pemain (dari origin/karir)
function myBackground(){
  if(C.career){
    const map={mage:"penyihir",mageteacher:"penyihir",knight:"bangsawan",merchant:"saudagar",
      gladiator:"gladiator",thief:"kriminal",diplomat:"diplomat",adventurer:"petualang",
      monarch:"raja",politician:"bangsawan"};
    if(map[C.career])return map[C.career];
  }
  const omap={mageborn:"penyihir",noble:"bangsawan",merchant_kid:"saudagar",orphan:"kriminal",peasant:"petualang"};
  return omap[C.origin]||"petualang";
}

// dinamika antar latar: pasangan latar -> teks pembuka & efek
function encounterDynamic(myBg,theirBg){
  const key=[myBg,theirBg].sort().join("+");
  const dyn={
    "bangsawan+penyihir":"Bangsawan & penyihir — perpaduan kuasa & misteri.",
    "bangsawan+saudagar":"Bangsawan & saudagar saling membutuhkan: gengsi & emas.",
    "gladiator+kriminal":"Gladiator & kriminal — dunia keras saling mengenali.",
    "diplomat+raja":"Diplomat menghadap petinggi kerajaan.",
    "penyihir+saudagar":"Penyihir & saudagar menawar jasa sihir.",
    "petualang+saudagar":"Petualang menjual hasil jelajah ke saudagar.",
  };
  return dyn[key]||`Pertemuan ${myBg} dengan ${theirBg} memicu percakapan menarik.`;
}

// buka encounter (dipanggil dari aktivitas sosial / kedai / jalan-jalan)
function openEncounter(){
  const myBg=myBackground();
  // pilih latar lawan yg BERBEDA
  let pool=ENCOUNTER_TYPES.filter(t=>t.bg!==myBg);
  const them=rand(pool);
  const female=chance(0.5);
  const nm=randName(female);
  const job=rand(them.jobs);
  const dyn=encounterDynamic(myBg,them.bg);
  snapStats&&snapStats();
  openChoice({ico:them.ico,prompt:`Kau bertemu <b>${nm}</b>, seorang ${job}.<br><span style="font-size:11px;color:var(--ink-soft);filter:brightness(1.6)">${dyn}</span>`,
    cancel:true,
    choices:[
      {label:"🤝 Berkenalan",sub:"jadikan relasi",run:()=>{
        const r=addRel("teman",{name:nm,female,bond:ri(35,55)});
        // simpan latar utk profil
        if(typeof ensureProfile==="function"){const p=ensureProfile(r);p.job=job;p.background=them.bg;}
        applyStats({charm:+1,happy:+3});
        return{t:`Kau berkenalan dengan ${nm} sang ${job}.`,cls:"e-good"};}},
      {label:"💼 Tawar kerja sama",sub:"untung bila cocok",run:()=>{
        if(C.stats.charm>45||chance(0.5)){const g=ri(30,90);C.coin+=g;C.reputation+=3;
          return{t:`Kerja sama dengan ${nm} membuahkan +${g} keping.`,cls:"e-good"};}
        return{t:`${nm} menolak tawaranmu dengan sopan.`,cls:""};}},
      {label:"⚔️ Tantang/uji",sub:`adu ${them.bg==='gladiator'||them.bg==='kriminal'?'kekuatan':'kecerdasan'}`,run:()=>{
        const useStat=them.bg==='gladiator'||them.bg==='kriminal'?C.stats.might:C.stats.mind;
        if(useStat>50||chance(0.5)){C.reputation+=5;applyStats({happy:+4});
          return{t:`Kau unggul dalam adu melawan ${nm}! Reputasi naik.`,cls:"e-good"};}
        applyStats({happy:-3});return{t:`${nm} mengalahkanmu. Kau belajar dari kekalahan.`,cls:"e-bad"};}},
    ]});
}

    {label:"💍 Lamar (tunangan)",cls:"love",run:r=>{

      if(C.age<16)return "Kau terlalu muda untuk bertunangan.";

      if(C.age<18)return "Kau harus berusia 18 tahun untuk menikah.";
      if(!r._engaged)return "Bertunangan dulu sebelum menikah.";
      if(r.bond>=70){C.married=true;r._spouse=true;applyStats({happy:+20});C.coin=Math.max(0,C.coin-ri(20,60));
        return `Kau menikah dengan ${r.name}! Pesta megah digelar. 💒`;}
      return `${r.name} belum siap menikah.`;}},
    {label:"👶 Bina keluarga (punya anak)",run:r=>{
      if(!C.married||!r._spouse)return "Hanya pasangan menikah yang bisa membina keluarga.";
      if(C.age<18)return "Kau harus dewasa (18+) untuk membina keluarga.";
      if(C.age>55)return "Usiamu sudah tak memungkinkan untuk punya anak.";
      const heirs=C.relations.filter(x=>x.isChild).length;
      if(heirs>=5)return "Kau sudah punya banyak keturunan.";
      // panggil prosedur lahir (non-eksplisit)
      setTimeout(()=>bornChild(r),100);
      return `Kalian memutuskan menambah anggota keluarga...`;}},
    {label:"💔 Berpisah",run:r=>{C.married=false;r._spouse=false;r._engaged=false;r.role="teman";r.bond=clamp(r.bond-ri(15,30));applyStats({happy:-12});return `Kau berpisah dengan ${r.name}. Hatimu pedih.`;}},
  ];
})();

// ---------- kelahiran anak (non-eksplisit) ----------
function bornChild(parentRel){
  const female=chance(0.5);
  const surname=C.name.split(" ").slice(1).join(" ")||"";
  const first=randName(female).split(" ")[0];
  const childName=(first+" "+surname).trim();
  // anak warisi sebagian stat ortu (rata-rata + variasi)
  const inheritStat=k=>clamp(Math.round((C.stats[k]*0.4)+ri(5,20)));
  const ch=addRel("keluarga",{name:childName,female,bond:ri(70,90),isChild:true});
  ch._isHeir=true;
  ch._inherited={
    might:inheritStat("might"),mana:inheritStat("mana"),mind:inheritStat("mind"),charm:inheritStat("charm"),
  };
  ch._birthYear=C.age;
  applyStats({happy:+15,health:-3});
  C.coin=Math.max(0,C.coin-ri(10,30));
  if(typeof snapStats==="function")snapStats();
  if(typeof showResult==="function"){
    showResult({ico:"👶",title:"Kelahiran!",cls:"e-epic",
      body:`Selamat! ${childName} lahir ke dunia sebagai buah hatimu & ${parentRel.name}. Suatu hari ia bisa mewarisi namamu, hartamu, dan gelarmu.`});
  }
  if(typeof renderAll==="function")renderAll();
}

// ---------- PEWARISAN saat mati ----------
// dipanggil dari die(); cari ahli waris (anak hidup), wariskan stat/harta/gelar/aset.
function computeInheritance(){
  const heirs=C.relations.filter(r=>r.isChild&&r._isHeir!==false);
  return heirs;
}

// bangun karakter ahli waris baru dari anak terpilih
function buildHeirCharacter(heir){
  // pastikan tidak ada popup/modal nyangkut dari hidup sebelumnya
  if(typeof pendingChoice!=="undefined")pendingChoice=null;
  const modalEl=document.getElementById("modal");
  if(modalEl&&modalEl.classList)modalEl.classList.remove("show");
  // mulai karakter baru tapi warisi sebagian
  const inh=heir._inherited||{might:20,mana:20,mind:20,charm:20};
  // gunakan origin pemain (garis keturunan)
  chosenOrigin=C.origin;
  const oldName=C.name;
  const oldTitle=C.title;
  const inheritCoin=Math.round(C.coin*0.6);          // 60% harta diwariskan
  const inheritProps=C.properties.slice();           // properti diwariskan
  const inheritBiz=C.businesses.slice();             // bisnis diwariskan
  const inheritRep=Math.round(C.reputation*0.3);
  // buat karakter baru
  beginLife();
  draft.cityId=C.cityId||"aetheria";
  draft.name=heir.name;
  draft.female=heir.female;
  confirmCustomize();
  // terapkan warisan
  C.name=heir.name;
  C.female=heir.female;
  C.stats.might=clamp(C.stats.might+Math.round(inh.might*0.5));
  C.stats.mana=clamp(C.stats.mana+Math.round(inh.mana*0.5));
  C.stats.mind=clamp(C.stats.mind+Math.round(inh.mind*0.5));
  C.stats.charm=clamp(C.stats.charm+Math.round(inh.charm*0.5));
  C.coin=inheritCoin;
  C.familyWealth=inheritCoin;
  C.properties=inheritProps;
  C.businesses=inheritBiz;
  C.reputation=inheritRep;
  C._lineage=(heir._lineage||1)+1;  // generasi ke-berapa
  C._ancestorName=oldName;
  C._ancestorTitle=oldTitle;
  C._visited=[C.cityId];
  log(C.age,`🩸 Kau adalah ${heir.name}, pewaris ${oldName}. Warisan: ${inheritCoin} keping, ${inheritProps.length} properti, ${inheritBiz.length} bisnis.`,"e-epic");
  updateTitle();
  // tampilkan UI bermain lagi
  document.getElementById("overScreen").classList.add("hidden");
  document.querySelectorAll(".view").forEach(v=>v.classList.remove("hidden"));
  document.getElementById("agewrap").classList.remove("hidden");
  document.getElementById("tabbar").classList.remove("hidden");
  switchTab("Hidup");
  if(typeof setupMonthlyButton==="function")setupMonthlyButton();
  renderAll&&renderAll();
}

// ============================================================
//  PATCH — Kematian & Pewarisan (UI game over + pilihan ahli waris)
// ============================================================

die=function(reason){
  C.alive=false;updateTitle();log(C.age,reason,"e-death");
  setTimeout(()=>{
    document.querySelectorAll(".view").forEach(v=>v.classList.add("hidden"));
    document.getElementById("agewrap").classList.add("hidden");
    document.getElementById("tabbar").classList.add("hidden");
    document.getElementById("overScreen").classList.remove("hidden");

    const heirs=computeInheritance();
    const totalAset=C.properties.length+C.businesses.length;
    let legacy,inheritBlock="";

    if(heirs.length){
      const inheritCoin=Math.round(C.coin*0.6);
      legacy=`${heirs.length} keturunan melanjutkan garis darahmu. 🩸`;
      inheritBlock=`<div class="inherit-box">
        <div class="inherit-title">⚜ Garis Keturunan Berlanjut</div>
        <div class="inherit-desc">Ahli warismu dapat melanjutkan kisah ini — mewarisi <b>${inheritCoin} keping</b>, <b>${C.properties.length} properti</b>, <b>${C.businesses.length} bisnis</b>, sebagian statistik, & reputasi.</div>
        <div class="inherit-heirs">${heirs.map((h,i)=>`<button class="heir-btn" onclick="chooseHeir(${i})">${h.female?'👧':'👦'} ${h.name}<span class="heir-sub">lanjut sebagai dia</span></button>`).join("")}</div>
      </div>`;
      window._deadHeirs=heirs;
    }else{
      // TIDAK ADA AHLI WARIS — harta hilang
      legacy=totalAset>0
        ? `Tanpa ahli waris, seluruh hartamu — ${C.properties.length} properti & ${C.businesses.length} bisnis — terbengkalai & lenyap ditelan zaman. ⚱️`
        : `Kau berlalu nyaris tanpa jejak.`;
      inheritBlock=`<div class="inherit-box noheir">
        <div class="inherit-title">⚱ Tak Ada Ahli Waris</div>
        <div class="inherit-desc">Semua harta & gelar yang kau kumpulkan hilang bersama kepergianmu. Mulai takdir baru dari awal.</div>
      </div>`;
      window._deadHeirs=null;
    }

    document.getElementById("epitaph").innerHTML=
      `<b>${C.name}</b><br>${C.title} · wafat usia ${C.age}${C._lineage?` · generasi ke-${C._lineage}`:''}<br>
       📍 ${typeof currentCity==="function"?currentCity().name:(C.cityId||"Aetheria")}<br><br>
       Harta: ${C.coin} keping · Reputasi: ${C.reputation}<br>
       Relasi: ${C.relations.length} · Properti: ${C.properties.length} · Bisnis: ${C.businesses.length}<br>
       <i>${legacy}</i>${inheritBlock}`;
  },1400);
};

// pilih ahli waris -> lanjut main sebagai dia
function chooseHeir(idx){
  const heirs=window._deadHeirs;
  if(!heirs||!heirs[idx])return;
  const chosen=heirs[idx];
  window._deadHeirs=null;        // bersihkan agar tidak bocor ke hidup berikutnya
  buildHeirCharacter(chosen);
}

function playTravelAnim(fromId,toId,onArrive){
  const layer=document.getElementById("animLayer");
  if(!layer){onArrive&&onArrive();return;}
  const pa=CITY_POS[fromId],pb=CITY_POS[toId];
  if(!pa||!pb){onArrive&&onArrive();return;}
  const from=cityOf(fromId),to=cityOf(toId);
  const goingLeft=pb.x<pa.x;
  const dur=1.3;
  layer.innerHTML=`
    <div class="travel-box">
      <div class="travel-cap">Perjalanan ke ${to.name}…</div>
      <svg viewBox="0 0 320 240" class="travel-map" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="tgrad_from" cx="40%" cy="35%"><stop offset="0%" stop-color="${CITY_THEME[fromId].c1}"/><stop offset="100%" stop-color="${CITY_THEME[fromId].c2}"/></radialGradient>
          <radialGradient id="tgrad_to" cx="40%" cy="35%"><stop offset="0%" stop-color="${CITY_THEME[toId].c1}"/><stop offset="100%" stop-color="${CITY_THEME[toId].c2}"/></radialGradient>
          <radialGradient id="tmapbg" cx="50%" cy="45%"><stop offset="0%" stop-color="#2a2030"/><stop offset="100%" stop-color="#171019"/></radialGradient>
        </defs>
        <rect x="0" y="0" width="320" height="240" rx="14" fill="url(#tmapbg)"/>
        <line x1="${pa.x}" y1="${pa.y}" x2="${pb.x}" y2="${pb.y}" stroke="#3a2e1e" stroke-width="2" stroke-dasharray="4 3"/>
        <line x1="${pa.x}" y1="${pa.y}" x2="${pb.x}" y2="${pb.y}" stroke="${CITY_THEME[toId].glow}" stroke-width="2" stroke-dasharray="4 3" opacity="0.8">
          <animate attributeName="stroke-dashoffset" values="14;0" dur="0.8s" repeatCount="indefinite"/>
        </line>
        <circle cx="${pa.x}" cy="${pa.y}" r="12" fill="url(#tgrad_from)" stroke="#2a2018" stroke-width="1.4"/>
        <text x="${pa.x}" y="${pa.y+5}" text-anchor="middle" font-size="13">${from._emoji||from.ico}</text>
        <text x="${pa.x}" y="${pa.y+24}" text-anchor="middle" font-size="8.5" fill="#c9b896">${from.name}</text>
        <circle cx="${pb.x}" cy="${pb.y}" r="13" fill="url(#tgrad_to)" stroke="${CITY_THEME[toId].glow}" stroke-width="2"/>
        <text x="${pb.x}" y="${pb.y+5}" text-anchor="middle" font-size="14">${to._emoji||to.ico}</text>
        <text x="${pb.x}" y="${pb.y+25}" text-anchor="middle" font-size="9" fill="${CITY_THEME[toId].glow}" font-weight="700">${to.name}</text>
        <g>
          <text text-anchor="middle" font-size="18" transform="scale(${goingLeft?-1:1},1)">
            <animateMotion path="M${goingLeft?-pa.x:pa.x},${pa.y-4} L${goingLeft?-pb.x:pb.x},${pb.y-4}" dur="${dur}s" fill="freeze"/>
            🚶
          </text>
          <circle r="2" fill="#8a7a5a" opacity="0.5">
            <animateMotion path="M${pa.x},${pa.y+2} L${pb.x},${pb.y+2}" dur="${dur}s" fill="freeze"/>
            <animate attributeName="opacity" values="0.5;0.1;0.5" dur="0.4s" repeatCount="indefinite"/>
          </circle>
        </g>
      </svg>
    </div>`;
  layer.classList.add("show");
  clearTimeout(layer._tm);
  layer._tm=setTimeout(()=>{
    layer.classList.remove("show");layer.innerHTML="";
    onArrive&&onArrive();
  },dur*1000+250);
}

// perkaya profil: tambah estimasi kekayaan koin, nama pasangan & anak NPC
function enrichProfile(r){
  const p=ensureProfile(r);
  if(p._enriched)return p;
  // estimasi kekayaan dalam koin (dari tier)
  const wealthCoin={"miskin":[5,40],"pas-pasan":[40,150],"berkecukupan":[150,500],"kaya":[500,2000],"sangat kaya":[2000,8000]};
  const wr=wealthCoin[p.wealth]||[10,100];
  p.wealthCoin=ri(wr[0],wr[1]);
  // nama pasangan & anak (kalau ada)
  if(p.married&&!p.spouseName)p.spouseName=randName(!r.female).split(" ")[0];
  if(p.children>0&&!p.childNames){p.childNames=[];for(let i=0;i<p.children;i++)p.childNames.push(randName(chance(0.5)).split(" ")[0]);}
  // status sosial
  p.social=p.wealth==="sangat kaya"||p.wealth==="kaya"?"kelas atas":p.wealth==="berkecukupan"?"kelas menengah":"rakyat biasa";
  p._enriched=true;
  return p;
}

// ---------- OVERVIEW LENGKAP (kartu diklik membuka ini) ----------
function openOverview(relId){
  const r=C.relations.find(x=>x.id===relId);if(!r)return;
  const p=enrichProfile(r);
  const known=r._known||0;
  const meter=r.role==="pengikut"?r.loyalty:r.bond;

  // bangun baris info berlapis sesuai known
  const rows=[];
  const lock=`<span style="color:var(--ink-soft);filter:brightness(1.5)">🔒 ngobrol lebih dalam untuk tahu</span>`;

  rows.push([`Status`,`${r.role}${r.isChild?" (anak)":""} · ${r.female?"Perempuan":"Lelaki"} · sifat ${r.trait}`]);
  rows.push([`Ikatan`,`${Math.round(meter)}/100 · kenal ${C.age-r.met} tahun`]);
  // lv1: umur, pekerjaan, asal
  rows.push([`Umur`, known>=1?`~${p.age} tahun`:lock]);
  rows.push([`Pekerjaan`, known>=1?p.job:lock]);
  rows.push([`Asal`, known>=1?p.origin:lock]);
  // lv2: kekayaan & status sosial
  rows.push([`Kekayaan`, known>=2?`${p.wealth} (~${p.wealthCoin} keping)`:lock]);
  rows.push([`Status sosial`, known>=2?p.social:lock]);
  // lv2: keluarga inti — papa & ibu
  rows.push([`Ayah`, known>=2?p.parents[0]:lock]);
  rows.push([`Ibu`, known>=2?p.parents[1]:lock]);
  // lv3: pasangan & anak
  rows.push([`Pasangan`, known>=3?(p.married?(p.spouseName||"—"):"belum menikah"):lock]);
  rows.push([`Anak`, known>=3?(p.children>0?`${p.children} (${(p.childNames||[]).join(", ")})`:"belum punya"):lock]);
  // lv2: saudara
  rows.push([`Saudara`, known>=2?(p.siblings.length?p.siblings.join(", "):"anak tunggal"):lock]);
  // lv4: ambisi
  rows.push([`Ambisi`, known>=4?p.ambition:lock]);
  // lv6: rahasia
  rows.push([`Rahasia`, known>=6?`<span style="color:var(--arcane-glow)">${p.secret}</span>`:`<span style="color:var(--ink-soft)">🔒 hanya terbuka bila sangat dekat</span>`]);

  const tableHTML=`<div class="ov-table">${rows.map(([k,v])=>
    `<div class="ov-row"><span class="ov-k">${k}</span><span class="ov-v">${v}</span></div>`).join("")}</div>`;
  const progress=`<div class="ov-progress">Keterbukaan: ${Math.min(known,6)}/6 lapis · ngobrol lebih sering untuk membuka lebih banyak</div>`;

  snapStats&&snapStats();
  openChoice({ico:r.ico,
    prompt:`<div class="ov-name">${r.name}</div>${tableHTML}${progress}`,
    choices:[
      {label:"💬 Ngobrol (pilih topik)",sub:"buka info lebih dalam",cls:"love",run:()=>{closeModal();setTimeout(()=>openConversation(relId),140);return null;}},
      ...(r.role==="keluarga"||r.role==="pasangan"?[{label:"🎁 Beri hadiah",sub:"naikkan ikatan",run:()=>{closeModal();setTimeout(()=>giftToSpecific(relId),140);return null;}}]:[]),
    ]});
}

// submenu untuk aksi keluarga/umum
function openRelActionMenu(relId,actIdx){
  const r=C.relations.find(x=>x.id===relId);if(!r)return;
  const acts=REL_ACTIONS[r.role]||[];
  const act=acts[actIdx];if(!act)return;
  const label=act.label;

  // BERBURU BARENG -> sub-opsi gaya berburu
  if(label.includes("Berburu")){
    if(C.age<12){toast("Kamu terlalu muda untuk berburu.");return;}
    snapStats&&snapStats();
    openChoice({ico:"🏹",prompt:`Berburu bersama <b>${r.name}</b> — pilih cara:`,
      choices:[
        {label:"🦌 Buruan kecil",sub:"aman, hasil sedikit",run:()=>{r.bond=clamp(r.bond+ri(4,8));const g=ri(8,20);C.coin+=g;applyStats({happy:+3});return{t:`Kau & ${r.name} berburu rusa kecil. +${g} keping, ikatan menguat.`,cls:"e-good"};}},
        {label:"🐗 Buruan besar",sub:"berisiko, hasil besar",run:()=>{if(C.stats.might>40||chance(0.5)){r.bond=clamp(r.bond+ri(8,14));const g=ri(25,60);C.coin+=g;if(typeof addItem==="function")addItem("hide");applyStats({might:+2});return{t:`Buruan babi hutan sukses! +${g} keping & kulit. ${r.name} terkesan.`,cls:"e-epic"};}applyStats({health:-ri(8,18)});return{t:`Buruan besar gagal — kalian terluka & pulang dengan tangan kosong.`,cls:"e-bad"};}},
        {label:"🗣️ Sekadar menemani",sub:"ikatan + tanpa risiko",run:()=>{r.bond=clamp(r.bond+ri(6,10));applyStats({happy:+4});return{t:`Kau menemani ${r.name} berburu sambil mengobrol. Ikatan erat.`,cls:"e-good"};}},
      ]});
    return;
  }

  // MINTA WARISAN -> sub-opsi cara meminta
  if(label.includes("warisan")||label.includes("Warisan")){
    snapStats&&snapStats();
    const p=enrichProfile(r);
    openChoice({ico:"💰",prompt:`Minta warisan dari <b>${r.name}</b><br><span style="font-size:11px;color:var(--ink-soft);filter:brightness(1.6)">${(r._known||0)>=2?`Estimasi kekayaannya: ${p.wealth} (~${p.wealthCoin} keping)`:"Kau belum tahu pasti kekayaannya — ngobrol dulu."}</span>`,
      choices:[
        {label:"🙏 Memohon baik-baik",sub:"sedikit, ikatan aman",run:()=>{const g=ri(20,60);C.coin+=g;r.bond=clamp(r.bond-ri(2,5));return{t:`${r.name} memberimu ${g} keping dengan ikhlas.`,cls:"e-good"};}},
        {label:"😢 Merengek memaksa",sub:"lebih banyak, ikatan turun",run:()=>{const base=(r._known||0)>=2?p.wealthCoin:120;const g=Math.round(base*0.2)+ri(20,50);C.coin+=g;r.bond=clamp(r.bond-ri(8,16));return{t:`Setelah kau merengek, ${r.name} memberi ${g} keping — tapi kecewa padamu.`,cls:""};}},
        {label:"📜 Bicara soal warisan masa depan",sub:"tandai sbg pewaris",run:()=>{r._willInherit=true;r.bond=clamp(r.bond+ri(2,5));return{t:`${r.name} berjanji mewariskan hartanya padamu kelak. (kau ditandai pewaris)`,cls:"e-good"};}},
      ]});
    return;
  }

  // MENGOBROL -> langsung ke conversation pilih topik (sudah submenu)
  if(label.includes("Mengobrol")||label.includes("Ngobrol")){
    openConversation(relId);return;
  }

  // BERI HADIAH -> pilih item (sudah submenu via giftToSpecific)
  if(label.includes("hadiah")||label.includes("Hadiah")){
    giftToSpecific(relId);return;
  }

  // default: jalankan aksi asli (fallback)
  _origDoRelAction(relId,actIdx);
}

// Solusi: kosongkan isi SVG peta saat keluar tab Peta, isi ulang saat masuk.
let _mapActive=false;
function freezeMap(){
  const wrap=document.getElementById("viewPeta");
  if(!wrap)return;
  // simpan & kosongkan elemen peta agar animasi berhenti total
  _mapActive=false;
}
const _opt_prevSwitchTab=switchTab;
switchTab=function(name){
  _opt_prevSwitchTab(name);
  _mapActive=(name==="Peta");
  // OPTIMASI iPhone/Safari: saat keluar tab Peta, kosongkan SVG agar animasi
  // SVG (bintang/salju/ombak) benar-benar berhenti & tak memakan baterai.
  if(name!=="Peta"){
    const wrap=document.querySelector(".map-wrap");
    if(wrap)wrap.innerHTML="";   // hapus SVG beranimasi

// ---------- 2) ANIMASI: panel masuk halus saat ganti tab ----------
function animatePanelIn(name){
  if(_reducedMotion())return;
  const el=document.getElementById("view"+name);
  if(!el)return;
  el.style.animation="none";
  // force reflow lalu animasikan
  void el.offsetWidth;
  el.style.animation="panelIn .28s ease-out";
}

function installAutoSave(){
  if(typeof advanceYear==="function"){

      if(C&&C.alive)saveGame(true);};
  }
  // simpan juga saat mati (agar layar over bisa di-restore -> tahu sudah mati)
  if(typeof die==="function"){
    const _sv_prevDie=die;
    die=function(){_sv_prevDie.apply(this,arguments);saveGame(true);};
  }
  // simpan saat menutup/menyembunyikan app (mobile background)

      if(document.hidden&&C&&C.alive)saveGame(true);});

}

// ---------- tombol Simpan manual di tab Hidup ----------
function installSaveButton(){
  if(typeof renderHidup!=="function")return;
  const _sv_prevRenderHidup=renderHidup;
  renderHidup=function(){
    _sv_prevRenderHidup.apply(this,arguments);
    const host=document.getElementById("viewHidup");

    if(storageAvailable()){
      host.innerHTML+=`<div class="save-row">

function confirmDeleteSave(){

    openChoice({ico:"🗑️",prompt:"Hapus simpanan permanen? Progress yang tersimpan akan hilang.",

// ============================================================
//  TAKDIR — BALANCING UMUR (perbaikan mortalitas)
// ============================================================
// Masalah lama: 78% mati sebelum 20 thn (median 9). Penyebab: efek lingkungan
// kota menggerus health balita yang tak berdaya + tak ada regenerasi.

// ----- 1) EFEK LINGKUNGAN: anak-anak sangat dilindungi -----
(function softenEnv(){
  if(typeof envDamping!=="function")return;
  const _bal_prevEnvDamping=envDamping;
  envDamping=function(){
    let d=_bal_prevEnvDamping.apply(this,arguments);
    if(typeof C!=="undefined"&&C){
      if(C.age<13)d=d*0.15;       // balita/anak: efek negatif ~85% lebih ringan
      else if(C.age<18)d=d*0.45;  // remaja: ~55% lebih ringan
    }
    return d;
  };
})();

// ----- 2) SATU override processYearly: regenerasi + lantai + kematian tua -----
(function installBalance(){
  if(typeof processYearly!=="function")return;
  const _bal_prevProcessYearly=processYearly;
  processYearly=function(){
    _bal_prevProcessYearly.apply(this,arguments);
    if(!C||!C.alive)return;

    // (a) REGENERASI HEALTH ALAMI — tubuh muda & sehat pulih perlahan
    if(C.age<55 && C.stats.health<100){
      const base=C.age<13?ri(3,6) : C.age<30?ri(2,4) : ri(1,3);
      applyStats({health:+base});
    }

    // (b) PENUAAN BERTAHAP setelah paruh baya
    if(C.age>=55 && C.age<70){if(chance(0.5))applyStats({health:-ri(1,3)});}
    else if(C.age>=70 && C.age<85){applyStats({health:-ri(2,4)});}
    else if(C.age>=85){applyStats({health:-ri(3,6)});}

    // (c) LANTAI PERLINDUNGAN anak/remaja — cegah mati konyol karena RNG
    if(C.age<13 && C.stats.health<35)C.stats.health=35;
    else if(C.age<18 && C.stats.health<15)C.stats.health=15;

    // (d) KEMATIAN USIA TUA realistis & bertahap (mulai relevan ~65+)
    if(C.age>=65){
      let p=(C.age-65)*0.012;          // 65→0% naik ke ~30% di usia 90
      if(C.age>=85)p+=0.05;
      if(C.stats.health<25)p+=0.10;    // sakit mempercepat
      if(chance(Math.min(p,0.6))){die("Usia tua menjemputmu dengan tenang.");return;}
    }

    // (e) KEMISKINAN BERTAHUN: tanpa uang, hidup makin berat
    if(C.age>=16){
      if(C.coin<=5){
        C._brokeYears=(C._brokeYears||0)+1;
        if(C._brokeYears===2)log(C.age,"Hidup serba kekurangan. Kebahagiaan terkikis.","e-bad");
        if(C._brokeYears>=2)applyStats({happy:-ri(2,5)});
        if(C._brokeYears>=3)applyStats({health:-ri(2,4)});
        if(C._brokeYears>=4&&chance(0.35)){
          C.reputation=Math.max(0,C.reputation-5);
          log(C.age,"Kemiskinan merusak namamu di mata orang.","e-bad");
        }
      }else if(C.coin>=25){
        C._brokeYears=0;
      }
    }
  };
})();

// sub-lokasi sekolah ditambahkan ke tiap kota (muncul di peta)
(function injectSchoolSublocs(){
  if(typeof CITIES==="undefined")return;
  const SUB={
    aetheria:{id:"ae_school", ico:"🎓"},
    saltmoor:{id:"sa_school", ico:"🎓"},
    frostspire:{id:"fr_school",ico:"🎓"},
    thornvale:{id:"th_school",ico:"🎓"},
  };
  CITIES.forEach(c=>{
    const sc=CITY_SCHOOLS[c.id]; const sub=SUB[c.id];
    if(!sc||!sub)return;
    // jangan duplikat
    if(c.sublocs.some(s=>s.id===sub.id))return;
    c.sublocs.push({id:sub.id, ico:sub.ico, name:sc.name, desc:sc.spec+" — masuk untuk belajar.", _school:true});
  });
})();

// ---------- helper ----------
function citySchool(cityId){return CITY_SCHOOLS[cityId||C.cityId];}
function myMajor(){return C.schoolMajor||null;}
function majorData(cityId, majorId){
  const sc=citySchool(cityId); if(!sc)return null;
  return sc.majors.find(m=>m.id===majorId)||null;
}
// jenjang Tinggi (tier 2) = syarat minimal pilih jurusan, belajar ekstra, ikut ujian
const SCHOOL_MAJOR_TIER=2;
function highSchoolUnlocked(){
  const s=C&&C.school;
  return !!(s && !s.droppedOut && s.currentTier>=SCHOOL_MAJOR_TIER);
}
// pesan kenapa belum bisa (berdasarkan kondisi sekolah saat ini)
function schoolLockReason(){
  const s=C&&C.school;
  if(!s||s.currentTier<0){
    const hi=(typeof SCHOOL_LEVELS!=="undefined")?SCHOOL_LEVELS[SCHOOL_MAJOR_TIER]:null;
    return `Kau belum bersekolah. Jurusan & ujian baru terbuka saat masuk jenjang Tinggi (umur ~${hi?hi.enterAge:12}).`;
  }
  if(s.droppedOut)return "Kau putus sekolah. Jurusan tak tersedia.";
  if(s.currentTier<SCHOOL_MAJOR_TIER){
    const lv=(typeof SCHOOL_LEVELS!=="undefined")?SCHOOL_LEVELS[s.currentTier]:null;
    const hi=(typeof SCHOOL_LEVELS!=="undefined")?SCHOOL_LEVELS[SCHOOL_MAJOR_TIER]:null;
    return `Kau masih di jenjang ${lv?lv.name:"awal"}. Pilih jurusan & ujian terbuka di jenjang Tinggi (umur ~${hi?hi.enterAge:12}).`;
  }
  return null;
}

// ---------- PANEL SEKOLAH (dibuka dari sub-lokasi) ----------
function openSchool(){
  const sc=citySchool(); if(!sc){toast("Tak ada sekolah di kota ini.");return;}
  const s=C.school;
  const tier=s?s.currentTier:-1;
  const inSchool=s&&s.enrolled&&!s.droppedOut;
  const major=myMajor();
  const majorObj=major?majorData(C.cityId,major.id):null;

  // header + status (HTML utk prompt)
  const lvl=(typeof SCHOOL_LEVELS!=="undefined"&&tier>=0)?SCHOOL_LEVELS[tier]:null;
  const statusLine=s?`📚 ${tier<0?"Belum bersekolah":(lvl?`Jenjang ${lvl.name}`:"—")}${s.graduated&&s.graduated.length?` · lulus ${s.graduated.length} jenjang`:""}`:"";
  let info=`<div class="sch-name">${sc.ico} ${sc.name}</div>
    <div class="sch-spec">${sc.spec}</div>
    <div class="sch-blurb">${sc.blurb}</div>
    <div class="sch-status">${statusLine}</div>`;
  if(major){
    const names=majorObj&&majorObj.careers?majorObj.careers.map(careerName).join(", "):"";
    info+=`<div class="sch-major">🎯 Jurusan: <b>${major.ico} ${major.name}</b><br><span class="sch-careers">🔓 ${names}</span></div>`;
  }else if(highSchoolUnlocked()){
    info+=`<div class="sch-major" style="text-align:center;color:var(--ink-soft);filter:brightness(1.5)">Pilih jurusan di bawah untuk fokus belajar.</div>`;
  }

  // pilihan
  const choices=[];
  const locked=!highSchoolUnlocked();
  const reason=schoolLockReason();

  if(locked){
    // belum jenjang Tinggi: tampilkan alasan, tak ada aksi belajar/jurusan
    info+=`<div class="sch-locked">🔒 ${reason}</div>`;
    choices.push({label:"💼 Program Karir",sub:"lihat prospek lulusan",run:()=>{closeModal();setTimeout(()=>viewSchoolCareers(),140);return null;}});
    choices.push({label:"Keluar",run:()=>null});
  }else if(!major){
    // udah jenjang Tinggi tapi belum pilih jurusan
    sc.majors.forEach(m=>{
      const names=(m.careers||[]).map(careerName).join(", ");
      choices.push({label:`${m.ico} Ambil Jurusan: ${m.name}`,sub:`${m.desc} · 🔓 ${names}`,run:()=>{chooseMajor(m.id);return null;}});
    });
    choices.push({label:"💼 Program Karir",sub:"lihat prospek lulusan",run:()=>{closeModal();setTimeout(()=>viewSchoolCareers(),140);return null;}});
    choices.push({label:"Keluar",run:()=>null});
  }else{
    // udah jenjang Tinggi & udah pilih jurusan: bisa belajar & ujian
    choices.push({label:"📖 Belajar Ekstra",sub:`+${statLabel(major.stat)} · 1 aksi`,run:()=>{
      if(typeof spendAction==="function"&&!spendAction()){closeModal();toast("Aksi habis tahun ini.");return null;}
      const r=studyExtraRun();closeModal();if(r&&typeof log==="function")log(C.age,r.t,r.cls);if(r)toast(r.t);if(typeof renderHidup==="function")renderHidup();return null;}});
    choices.push({label:"📝 Ikut Ujian",sub:`uji ${statLabel(major.stat)} · 1 aksi`,run:()=>{
      if(typeof spendAction==="function"&&!spendAction()){closeModal();toast("Aksi habis tahun ini.");return null;}
      const r=takeExamRun();closeModal();if(r&&typeof log==="function")log(C.age,r.t,r.cls);if(r)toast(r.t);if(typeof renderHidup==="function")renderHidup();return null;}});
    choices.push({label:"💼 Program Karir",sub:"lihat prospek lulusan",run:()=>{closeModal();setTimeout(()=>viewSchoolCareers(),140);return null;}});
    choices.push({label:"Keluar",run:()=>null});
  }

  if(typeof openChoice==="function"){openChoice({ico:sc.ico,prompt:info,choices});}
  else if(typeof showModal==="function"){showModal({ico:sc.ico,prompt:sc.name+" — "+sc.spec,choices});}
}

function careerName(cid){const cr=(typeof CAREERS!=="undefined")?CAREERS.find(x=>x.id===cid):null;return cr?cr.name:cid;}

// ---------- AKSI: pilih jurusan ----------
function chooseMajor(majorId){
  if(!highSchoolUnlocked()){
    if(typeof toast==="function")toast("Belum bisa pilih jurusan — masuk jenjang Tinggi dulu.");
    return;
  }
  const sc=citySchool(); if(!sc)return;
  const m=sc.majors.find(x=>x.id===majorId); if(!m)return;
  C.schoolMajor={id:m.id, name:m.name, ico:m.ico, stat:m.stat, careers:m.careers, city:C.cityId};
  if(typeof log==="function")log(C.age,`Kau mengambil jurusan ${m.name} di ${sc.name}.`,"e-good");
  if(typeof toast==="function")toast(`Jurusan: ${m.name}`);
  if(typeof closeModal==="function")closeModal();
  if(typeof renderHidup==="function")renderHidup();
}

// ---------- AKSI: belajar ekstra ----------
function studyExtraRun(){
  const major=myMajor();
  const stat=major?major.stat:"mind";
  if(typeof applyStats==="function"){const d={};d[stat]=ri(2,5);applyStats(d);}
  return {t:`Kau belajar tekun. ${statLabel(stat)} meningkat.`,cls:"e-good"};
}
function studyExtra(){
  if(typeof spendAction==="function"&&!spendAction()){toast("Aksi habis tahun ini.");return;}
  const r=studyExtraRun();
  if(r&&typeof log==="function")log(C.age,r.t,r.cls);
  if(r&&typeof toast==="function")toast(r.t);
  if(typeof renderHidup==="function")renderHidup();
}

// ---------- AKSI: ikut ujian ----------
function takeExamRun(){
  const major=myMajor();
  const stat=major?major.stat:"mind";
  const sv=(C.stats&&C.stats[stat])||30;
  const pass=Math.random()*100 < (40+sv*0.5);
  if(pass){
    if(typeof applyStats==="function"){const d={};d[stat]=ri(3,7);d.happy=4;applyStats(d);}
    return {t:`Kau lulus ujian dengan baik! ${statLabel(stat)} & kepercayaan diri naik.`,cls:"e-good"};
  }else{
    if(typeof applyStats==="function")applyStats({happy:-5});
    return {t:`Ujian terasa berat. Kau perlu lebih giat belajar.`,cls:"e-bad"};
  }
}
function takeExam(){
  if(typeof spendAction==="function"&&!spendAction()){toast("Aksi habis tahun ini.");return;}
  const r=takeExamRun();
  if(r&&typeof log==="function")log(C.age,r.t,r.cls);
  if(r&&typeof toast==="function")toast(r.t);
  if(typeof renderHidup==="function")renderHidup();
}

// ---------- LIHAT PROGRAM KARIR ----------

  let lines=[`💼 Prospek karir dari ${sc.name}:`,""];
  sc.majors.forEach(m=>{
    const names=(m.careers||[]).map(cid=>{const cr=(typeof CAREERS!=="undefined")?CAREERS.find(x=>x.id===cid):null;return cr?cr.name:cid;});

}

// ---------- helper label stat ----------

  return ({mana:"Mana",mind:"Akal",might:"Kekuatan",charm:"Pesona",health:"Nyawa",happy:"Bahagia"})[s]||s;
}

// ---------- LINK lulus jurusan -> bonus syarat karir ----------
// jika pemain punya jurusan yg cocok, anggap "berpendidikan" utk karir terkait
function majorBoostsCareer(careerId){
  const m=myMajor();
  return !!(m&&m.careers&&m.careers.includes(careerId));
}

// ---------- INTEGRASI: klik sub-lokasi sekolah buka panel ----------
(function hookSubloc(){
  if(typeof gotoSubloc!=="function")return;
  const _prevGoto=gotoSubloc;
  gotoSubloc=function(id){
    const city=(typeof currentCity==="function")?currentCity():null;
    const sub=city&&city.sublocs?city.sublocs.find(x=>x.id===id):null;

// ---------- LINK: jurusan cocok -> longgarkan syarat karir terkait ----------
// jika pemain lulusan jurusan yg membuka karir X, beri keringanan req X.
(function linkMajorToCareer(){
  if(typeof applyCareer!=="function")return;
  const _prevApply=applyCareer;
  applyCareer=function(id){
    // jika jurusan membuka karir ini & req normal gagal hanya karena stat, beri kelonggaran
    const car=(typeof CAREERS!=="undefined")?CAREERS.find(x=>x.id===id):null;
    if(car&&majorBoostsCareer(id)&&typeof C!=="undefined"&&C){
      const okNormal=car.req(C);
      if(!okNormal){
        // cek apakah cuma gagal di umur (umur tetap wajib) atau di stat/coin
        const ageOK = C.age>=(typeof MIN_WORK_AGE!=="undefined"?MIN_WORK_AGE:15);
        if(ageOK){
          // lulusan jurusan terkait -> diterima meski stat/coin kurang sedikit
          C.career=id;C.careerLevel=0;C.careerYears=0;
          if(typeof log==="function")log(C.age,`Berkat pendidikan ${myMajor().name}, kau diterima sebagai ${car.ranks?car.ranks[0]:car.name}.`,"e-good");
          if(typeof toast==="function")toast(`Karir: ${car.name} (jalur pendidikan)`);
          if(typeof updateTitle==="function")updateTitle();
          if(typeof renderAktivitas==="function")renderAktivitas();
          if(typeof renderHidup==="function")renderHidup();
          return;
        }
      }
    }
    return _prevApply.apply(this,arguments);
  };
})();

// ============================================================
//  2) SOUND EFFECT — Web Audio API (tanpa file eksternal)
// ============================================================
// nada-nada pendek di-generate; ringan, tak butuh aset, cocok utk web/iOS.
let _audioCtx=null;
let _soundOn=true;
let _audioUnlocked=false;   // baru true setelah gestur user pertama

function _ac(){
  // JANGAN buat AudioContext sebelum user berinteraksi (kebijakan Safari/iOS).
  if(!_audioUnlocked)return null;
  if(_audioCtx)return _audioCtx;
  try{
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC)return null;
    _audioCtx=new AC();
  }catch(e){_audioCtx=null;}
  return _audioCtx;
}

// mainkan satu nada
function _tone(freq,dur,type,vol,delay){
  if(!_soundOn)return;
  const ac=_ac();if(!ac)return;
  try{
    const t0=ac.currentTime+(delay||0);
    const osc=ac.createOscillator();
    const gain=ac.createGain();
    osc.type=type||"sine";
    osc.frequency.setValueAtTime(freq,t0);
    gain.gain.setValueAtTime(0.0001,t0);
    gain.gain.exponentialRampToValueAtTime(vol||0.12,t0+0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001,t0+(dur||0.12));
    osc.connect(gain);gain.connect(ac.destination);
    osc.start(t0);osc.stop(t0+(dur||0.12)+0.02);
  }catch(e){}
}

// ----- hook SFX ke aksi game (non-invasif) -----
(function installSFX(){
  // klik pilihan
  if(typeof resolveChoice==="function"){
    const _sfx_prevResolve=resolveChoice;
    resolveChoice=function(i){playSFX("tap");return _sfx_prevResolve.apply(this,arguments);};
  }
  // hasil aktivitas (finishAct) -> bunyi sesuai cls
  if(typeof finishAct==="function"){
    const _sfx_prevFinish=finishAct;
    finishAct=function(msg,cls){
      if(cls==="e-bad")playSFX("lose");
      else if(cls==="e-epic")playSFX("win");
      else playSFX("confirm");
      return _sfx_prevFinish.apply(this,arguments);
    };
  }
  // ganti tahun
  if(typeof advanceYear==="function"){
    const _sfx_prevYear=advanceYear;
    advanceYear=function(){playSFX("year");return _sfx_prevYear.apply(this,arguments);};
  }
  // koin bertambah (lewat updateTitle yg sudah memantau coin)
  if(typeof flashCoin==="function"){
    const _sfx_prevFlash=flashCoin;
    flashCoin=function(){playSFX("coin");return _sfx_prevFlash.apply(this,arguments);};
  }
  // kematian
  if(typeof die==="function"){
    const _sfx_prevDie=die;
    die=function(){playSFX("death");return _sfx_prevDie.apply(this,arguments);};
  }
  // promosi karir / lulus -> level up (via log penanda) — hook ringan di applyCareer
  if(typeof applyCareer==="function"){
    const _sfx_prevCareer=applyCareer;
    applyCareer=function(){playSFX("levelup");return _sfx_prevCareer.apply(this,arguments);};
  }
})();

// ---------- ENTITLEMENT (kepemilikan, tersimpan) ----------
const ENTITLE_KEY="takdir_entitlements_v1";
let _entitlements=null;

function loadEntitlements(){
  if(_entitlements)return _entitlements;
  _entitlements={};
  try{
    const raw=window.localStorage.getItem(ENTITLE_KEY);
    if(raw)_entitlements=JSON.parse(raw)||{};
  }catch(e){_entitlements={};}
  return _entitlements;
}
function saveEntitlements(){
  try{window.localStorage.setItem(ENTITLE_KEY,JSON.stringify(_entitlements||{}));}catch(e){}
}
function owns(productId){
  const e=loadEntitlements();
  return !!e[productId];
}
function grantProduct(productId){
  loadEntitlements();
  _entitlements[productId]=true;
  // bundle: beri semua isinya
  const prod=IAP_PRODUCTS.find(p=>p.id===productId);
  if(prod&&prod.grants)prod.grants.forEach(g=>{_entitlements[g]=true;});
  saveEntitlements();
}

// ---------- JEMBATAN PEMBELIAN (web simulasi / native StoreKit) ----------
// Saat di-deploy native, definisikan window.TakdirIAP = {purchase, restore}
// yang memanggil StoreKit. Di web, fallback ke simulasi konfirmasi.
function purchaseProduct(productId){
  const prod=IAP_PRODUCTS.find(p=>p.id===productId);
  if(!prod)return;
  if(owns(productId)){toast&&toast("Kamu sudah memilikinya.");return;}

  // jembatan native (diisi oleh wrapper Xcode/Capacitor)
  if(window.TakdirIAP&&typeof window.TakdirIAP.purchase==="function"){
    window.TakdirIAP.purchase(productId);  // hasil ditangani via onPurchaseResult
    return;
  }

  // ===== MODE SIMULASI (web/preview) =====
  if(typeof openChoice==="function"){
    openChoice({ico:prod.ico,
      prompt:`<b>${prod.name}</b><br><span style="font-size:11.5px;color:var(--ink-soft);filter:brightness(1.6)">${prod.desc}</span><br><br><span style="color:var(--gold-bright);font-weight:700">${prod.price}</span><br><span style="font-size:10px;color:var(--ink-soft);filter:brightness(1.5)">(mode demo — pembelian asli aktif di App Store)</span>`,
      choices:[
        {label:"Beli (simulasi)",cls:"love",run:()=>{onPurchaseResult(productId,true);return{t:`✓ ${prod.name} terbuka!`,cls:"e-epic"};}},
        {label:"Batal",run:()=>({t:"Dibatalkan.",cls:""})},
      ]});
  }
}

// dipanggil setelah pembelian sukses (dari StoreKit native atau simulasi)
function onPurchaseResult(productId,success){
  if(!success)return;
  grantProduct(productId);
  const prod=IAP_PRODUCTS.find(p=>p.id===productId);
  // terapkan langsung kalau tema
  if(prod&&prod.type==="theme")applyPremiumTheme(productId);
  if(typeof renderPremiumStore==="function"&&currentTab==="Aset")renderAset&&renderAset();
}

// ============================================================
//  MANTARA — MULTI-SLOT SAVE
// ============================================================
// Tiap karakter disimpan di slot terpisah (takdir_slot_N). Pemain bisa
// punya beberapa kehidupan paralel (mis. karakter A di Aetheria & karakter
// B dari bayi di Saltmoor) tanpa saling menimpa.
//
// Free: SLOTS_FREE slot. IAP "takdir.saveslots": SLOTS_PREMIUM slot.

const SLOT_PREFIX="takdir_slot_";
const SLOT_INDEX_KEY="takdir_slot_index_v1";   // daftar metadata slot
const ACTIVE_SLOT_KEY="takdir_active_slot_v1";  // slot yg sedang dimainkan
const SLOTS_FREE=2;
const SLOTS_PREMIUM=5;

function maxSlots(){
  try{if(typeof owns==="function"&&(owns("takdir.saveslots")||owns("takdir.bundle.all")))return SLOTS_PREMIUM;}catch(e){}
  return SLOTS_FREE;
}

// ---------- INDEX SLOT (ringkasan tiap slot utk start screen) ----------
function readSlotIndex(){
  try{const raw=window.localStorage.getItem(SLOT_INDEX_KEY);return raw?JSON.parse(raw):{};}catch(e){return {};}
}
function writeSlotIndex(idx){
  try{window.localStorage.setItem(SLOT_INDEX_KEY,JSON.stringify(idx||{}));}catch(e){}
}
function activeSlot(){
  try{const v=window.localStorage.getItem(ACTIVE_SLOT_KEY);return v!==null?parseInt(v,10):null;}catch(e){return null;}
}
function setActiveSlot(n){
  try{if(n===null)window.localStorage.removeItem(ACTIVE_SLOT_KEY);else window.localStorage.setItem(ACTIVE_SLOT_KEY,String(n));}catch(e){}
}

// cari slot kosong pertama; -1 jika penuh
function firstFreeSlot(){
  const idx=readSlotIndex();
  for(let i=0;i<maxSlots();i++){if(!idx[i])return i;}
  return -1;
}
function slotCount(){return Object.keys(readSlotIndex()).length;}

// ---------- MIGRASI save lama (single-slot v1) -> slot 0 ----------
(function migrateOldSave(){
  try{
    if(!window.localStorage)return;
    const old=window.localStorage.getItem("takdir_save_v1");
    if(old&&!window.localStorage.getItem(SLOT_PREFIX+"0")){
      window.localStorage.setItem(SLOT_PREFIX+"0",old);
      const p=JSON.parse(old);
      const idx=readSlotIndex();idx[0]=p.meta||{name:"?",age:0};writeSlotIndex(idx);
      // jangan hapus yg lama dulu (kompat mundur), tapi tandai active
      if(activeSlot()===null)setActiveSlot(0);
    }
  }catch(e){}
})();

// ---------- SIMPAN ke slot aktif ----------
function saveGameMulti(silent){
  if(typeof storageAvailable==="function"&&!storageAvailable())return false;
  if(typeof C==="undefined"||!C)return false;
  let slot=activeSlot();
  if(slot===null){ // karakter ini belum punya slot -> ambil slot kosong
    slot=firstFreeSlot();
    if(slot===-1)return false; // penuh (UI mencegah ini)
    setActiveSlot(slot);
  }
  try{
    const payload={v:1,ts:Date.now(),char:C,
      meta:{name:C.name,age:C.age,title:C.title,alive:C.alive,coin:C.coin,
        origin:C.origin,cityId:C.cityId,lineage:C._lineage||1}};
    window.localStorage.setItem(SLOT_PREFIX+slot,JSON.stringify(payload));
    const idx=readSlotIndex();idx[slot]=payload.meta;writeSlotIndex(idx);
    if(!silent&&typeof toast==="function")toast("💾 Tersimpan (slot "+(slot+1)+")");
    return true;
  }catch(e){return false;}
}

// ---------- MUAT dari slot tertentu ----------
function loadSlot(slot){
  try{
    const raw=window.localStorage.getItem(SLOT_PREFIX+slot);
    if(!raw){toast&&toast("Slot kosong.");return false;}
    const p=JSON.parse(raw);
    C=p.char;
    if(!C._visited)C._visited=C.cityId?[C.cityId]:[];
    else if(C.cityId&&!C._visited.includes(C.cityId))C._visited.push(C.cityId);
    setActiveSlot(slot);
    // tampilkan layar bermain
    ["startScreen","customizeScreen","overScreen"].forEach(id=>{
      const el=document.getElementById(id);if(el)el.classList.add("hidden");});
    ["viewHidup"].forEach(id=>{const el=document.getElementById(id);if(el)el.classList.remove("hidden");});
    const tb=document.getElementById("tabbar");if(tb)tb.classList.remove("hidden");
    const aw=document.getElementById("agewrap");if(aw)aw.classList.remove("hidden");
    if(typeof updateTitle==="function")updateTitle();
    if(typeof switchTab==="function")switchTab("Hidup");
    else if(typeof renderAll==="function")renderAll();
    toast&&toast("Memuat "+(p.meta?p.meta.name:"permainan")+".");
    return true;
  }catch(e){toast&&toast("Gagal memuat slot.");return false;}
}

// ---------- HAPUS slot ----------
function deleteSlot(slot){
  try{
    window.localStorage.removeItem(SLOT_PREFIX+slot);
    const idx=readSlotIndex();delete idx[slot];writeSlotIndex(idx);
    if(activeSlot()===slot)setActiveSlot(null);
  }catch(e){}
}

// ---------- mulai karakter baru di slot kosong ----------
function startNewCharacter(){
  // cek slot penuh dulu — cegah progress hilang diam-diam
  if(typeof firstFreeSlot==="function"&&firstFreeSlot()===-1){
    const max=maxSlots();
    const choices=[{label:"📜 Lihat Daftar Slot",run:()=>{if(typeof renderSlotList==="function")renderSlotList();}}];
    if(typeof IAP_PRODUCTS!=="undefined"&&max<5)
      choices.push({label:"🔓 Buka 5 Slot Karakter",run:()=>{if(typeof purchaseProduct==="function")purchaseProduct("takdir.saveslots");}});
    choices.push({label:"Tutup",run:()=>{}});
    if(typeof showModal==="function"){
      showModal({ico:"🗂️",prompt:`Semua ${max} slot karakter sudah terisi. Hapus salah satu karakter dulu lewat daftar slot${max<5?", atau buka slot tambahan":""}.`,choices});
    }else if(typeof toast==="function"){toast("Slot karakter penuh. Hapus satu dulu.");}
    return; // jangan mulai karakter baru
  }
  // lepaskan slot aktif agar karakter baru dapat slot sendiri saat save pertama
  setActiveSlot(null);
  if(typeof beginLife==="function")beginLife();
}

// ============================================================
//  OVERRIDE save system lama -> multi-slot
// ============================================================
saveGame=function(silent){return saveGameMulti(silent);};
hasSave=function(){return slotCount()>0;};
deleteSave=function(){const s=activeSlot();if(s!==null)deleteSlot(s);};
loadGame=function(){ // "Lanjutkan" -> muat slot aktif, atau slot pertama terisi
  let s=activeSlot();
  if(s===null||!window.localStorage.getItem(SLOT_PREFIX+s)){
    const idx=readSlotIndex();const keys=Object.keys(idx);if(!keys.length)return false;s=parseInt(keys[0],10);}
  return loadSlot(s);
};

// ---------- START SCREEN: daftar semua slot + tombol kelola ----------
function renderSlotList(){
  const host=document.getElementById("slotList");
  if(!host)return;
  const idx=readSlotIndex();
  const max=maxSlots();
  const entries=Object.keys(idx).map(k=>parseInt(k,10)).sort((a,b)=>a-b);
  if(!entries.length){host.innerHTML="";return;}
  let html=`<div class="slot-head">Karakter Tersimpan (${entries.length}/${max})</div>`;
  for(const s of entries){
    const m=idx[s];
    const cityName=({aetheria:"Aetheria",thornvale:"Thornvale",saltmoor:"Saltmoor",frostspire:"Frostspire"})[m.cityId]||"";
    html+=`<div class="slot-card">
      <div class="slot-info" onclick="loadSlot(${s})">
        <div class="slot-name">${m.name||"?"} ${m.alive===false?'<span class="slot-dead">†</span>':''}</div>
        <div class="slot-meta">usia ${m.age||0}${cityName?' · '+cityName:''}${m.lineage>1?' · gen '+m.lineage:''}</div>
      </div>
      <button class="slot-del" onclick="confirmDeleteSlot(${s})">🗑️</button>
    </div>`;
  }
  // tombol slot baru jika masih ada ruang
  if(entries.length<max){
    html+=`<button class="slot-new" onclick="startNewCharacter()">+ Karakter Baru (slot ${entries.length+1})</button>`;
  }else{
    const canBuy=(typeof owns==="function"&&!owns("takdir.saveslots")&&!owns("takdir.bundle.all"));
    html+=`<div class="slot-full">Semua ${max} slot terpakai.${canBuy?' <span onclick="purchaseProduct(\'takdir.saveslots\')" style="color:var(--gold-bright);text-decoration:underline">Buka 5 slot</span>':''}</div>`;
  }
  host.innerHTML=html;
}
function confirmDeleteSlot(slot){
  const idx=readSlotIndex();const m=idx[slot];
  if(typeof openChoice==="function"){
    openChoice({ico:"🗑️",prompt:`Hapus karakter <b>${m?m.name:'?'}</b> (usia ${m?m.age:0})? Progres slot ini hilang permanen.`,
      choices:[
        {label:"🗑️ Ya, hapus permanen",cls:"danger",run:()=>{
          deleteSlot(slot);
          setTimeout(()=>{renderSlotList();if(typeof setupContinueButton==="function")setupContinueButton();
            if(typeof toast==="function")toast("Slot dihapus.");},60);
          return null;}},
      ]});
  }else{deleteSlot(slot);renderSlotList();}
}

// override setupContinueButton -> sekarang render daftar slot
setupContinueButton=function(){
  const btn=document.getElementById("continueBtn");
  if(btn){
    if(slotCount()>0){
      const idx=readSlotIndex();
      let s=activeSlot();if(s===null||!idx[s])s=parseInt(Object.keys(idx)[0],10);
      const m=idx[s];
      btn.classList.remove("hidden");
      btn.textContent=`▸ Lanjutkan: ${m?m.name:'?'} (usia ${m?m.age:0})`;
      btn.onclick=function(){loadSlot(s);};
    }else if(btn){btn.classList.add("hidden");}
  }
  renderSlotList();
};

// confirmNewGame: kini cukup mulai karakter baru (multi-slot, tak menimpa)
confirmNewGame=function(){
  if(slotCount()>=maxSlots()){
    toast&&toast("Semua slot penuh. Hapus satu karakter atau buka slot tambahan.");
    renderSlotList();return;
  }
  startNewCharacter();
};

if(typeof setupContinueButton==="function")setupContinueButton();

// ============================================================
//  MANTARA — SAFE WRAPPER untuk entry-point (anti-crash UI)
// ============================================================
// Membungkus fungsi entry-point (dipanggil dari onclick/setTimeout) agar
// error apa pun tidak membuat "Uncaught"/layar putih. Error dicatat ke
// buffer (takdirDebug()) & game lanjut dengan pesan ramah.
// Re-assign eksplisit (bukan via window[name]) agar andal di semua lingkungan.

function _guard(name,fn){
  if(typeof fn!=="function")return fn;
  const w=function(){
    try{return fn.apply(this,arguments);}
    catch(e){
      try{(window._takdirErrors=window._takdirErrors||[]).push({
        msg:"["+name+"] "+(e&&e.message||e),
        stack:e&&e.stack?String(e.stack).slice(0,400):"",});}catch(_){}
      try{if(typeof toast==="function")toast("Terjadi gangguan kecil — permainan tetap berjalan.");}catch(_){}
      return undefined;
    }
  };
  w.__guarded=true;
  return w;
}

// re-assign eksplisit tiap entry point (fungsi sudah terdefinisi di atas)
beginLife        = _guard("beginLife", beginLife);
confirmNewGame   = _guard("confirmNewGame", confirmNewGame);
confirmCustomize = _guard("confirmCustomize", confirmCustomize);
loadGame         = _guard("loadGame", loadGame);
selOrigin        = _guard("selOrigin", selOrigin);
resolveChoice    = _guard("resolveChoice", resolveChoice);
openChoice       = _guard("openChoice", openChoice);
renderCustomize  = _guard("renderCustomize", renderCustomize);
if(typeof initDraft==="function")        initDraft        = _guard("initDraft", initDraft);
if(typeof initOrigins==="function")      initOrigins      = _guard("initOrigins", initOrigins);
if(typeof setupContinueButton==="function") setupContinueButton = _guard("setupContinueButton", setupContinueButton);
// ============================================================
//  MANTARA — NAVIGASI 3-TAB (Hidup / Dunia / Diri)
// ============================================================
// Memadatkan 6 tab jadi 3 tab utama berikon besar, dengan sub-tab pill
// di dalam tab gabungan. Semua render lama tetap dipakai via switchTab asli.
//
//  Hidup  -> log umur (tetap)
//  Dunia  -> Peta + Aksi (sub-tab)
//  Diri   -> Relasi + Aset + Tas (sub-tab)

(function nav3(){
  // peta tab utama -> daftar sub-view (view asli yg sudah ada)
  const GROUPS={
    Hidup: {sub:[{view:"Hidup", label:"Hidup", ico:"📜"}]},
    Dunia: {sub:[
      {view:"Peta",      label:"Peta",  ico:"tab_peta",  emoji:"🗺️"},
      {view:"Aktivitas", label:"Aksi",  ico:"tab_aksi", emoji:"⚔️"},
      {view:"Toko",      label:"Toko",  ico:"🛒"},
    ]},
    Diri:  {sub:[
      {view:"Karir",     label:"Karir",  ico:"💼"},
      {view:"Relasi",    label:"Relasi", ico:"tab_relasi", emoji:"👥", dot:true},
      {view:"Aset",      label:"Aset",   ico:"🏰"},
      {view:"Inventory", label:"Tas",    ico:"🎒"},
    ]},
  };
  // view -> tab utama (kebalikan), utk highlight saat switchTab dipanggil langsung
  const VIEW2GROUP={};
  Object.entries(GROUPS).forEach(([g,o])=>o.sub.forEach(s=>VIEW2GROUP[s.view]=g));

  // sub-view aktif terakhir per grup (biar balik ke tab inget posisi)
  const lastSub={Dunia:"Peta", Diri:"Karir"};

  let _realSwitch=null;     // switchTab asli (pemnuh render)
  let _activeGroup="Hidup";

  // ---------- bangun ulang tabbar jadi 3 ----------
  function buildTabbar(){
    const bar=document.getElementById("tabbar");
    if(!bar)return;
    const mainTabs=[
      {group:"Hidup", label:"Hidup", ico:"📜"},
      {group:"Dunia", label:"Dunia", ico:"🗺️"},
      {group:"Diri",  label:"Diri",  ico:"👤"},
    ];
    bar.innerHTML=mainTabs.map(t=>
      `<button class="tab tab3 ${t.group===_activeGroup?'active':''}" data-group="${t.group}" onclick="navGroup('${t.group}')">
        <span class="tabi">${t.ico}</span><span class="tabt">${t.label}</span>
        ${t.group==="Diri"?'<span class="dot" id="dotRelasi"></span>':''}
      </button>`).join("");
    applyTabImages();
  }

  // ikon gambar kustom utk tab utama (kalau ada): Dunia pakai peta, Diri pakai orang
  function applyTabImages(){
    if(typeof MANTARA_ASSETS==="undefined")return;
    const map={Dunia:"tab_peta", Diri:"tab_relasi"};
    document.querySelectorAll(".tab3").forEach(t=>{
      const g=t.dataset.group, a=map[g];
      if(a&&MANTARA_ASSETS[a]){
        const ico=t.querySelector(".tabi");
        if(ico)ico.innerHTML=`<img src="${resolveAsset(MANTARA_ASSETS[a])}" style="width:30px;height:30px;object-fit:contain;filter:drop-shadow(0 0 4px rgba(240,192,64,.45))" alt="">`;
      }
    });
  }

  // ---------- render sub-tab pill di atas konten grup ----------
  function renderSubbar(group, activeView){
    const g=GROUPS[group];
    if(!g||g.sub.length<2)return ""; // Hidup tak perlu sub-tab
    return `<div class="subbar">${g.sub.map(s=>
      `<button class="subpill ${s.view===activeView?'active':''}" onclick="navSub('${group}','${s.view}')">
        <span class="subpill-ico">${subIco(s)}</span>${s.label}${s.dot?'<span class="dot" id="dotRelasi"></span>':''}
      </button>`).join("")}</div>`;
  }
  function subIco(s){
    if(s.ico&&typeof MANTARA_ASSETS!=="undefined"&&MANTARA_ASSETS[s.ico]){
      return `<img src="${resolveAsset(MANTARA_ASSETS[s.ico])}" style="width:16px;height:16px;object-fit:contain;vertical-align:-2px" alt="">`;
    }
    return s.emoji||s.ico||"";
  }

  // sisipkan/ubah sub-bar PERMANEN (#globalSubbar) di luar view -> tak terhapus render konten
  function updateGlobalSubbar(group, view){
    const host=document.getElementById("globalSubbar");
    if(!host)return;
    const html=renderSubbar(group, view);
    if(html){
      host.innerHTML=html;
      host.classList.remove("hidden");
    }else{
      host.innerHTML="";
      host.classList.add("hidden");   // Hidup: tak ada sub-bar
    }
  }

  // ---------- klik tab utama ----------
  window.navGroup=function(group){
    _activeGroup=group;
    // highlight tab utama
    document.querySelectorAll(".tab3").forEach(t=>t.classList.toggle("active",t.dataset.group===group));
    // tentukan view yg ditampilkan
    let view;
    if(group==="Hidup")view="Hidup";
    else view=lastSub[group]||GROUPS[group].sub[0].view;
    gotoView(group, view);
  };

  // ---------- klik sub-tab ----------
  window.navSub=function(group, view){
    lastSub[group]=view;
    gotoView(group, view);
  };

  // ---------- pindah ke view (delegasi ke switchTab asli) ----------
  function gotoView(group, view){
    if(_realSwitch)_realSwitch(view);     // jalankan render asli + tampil/sembunyi
    // setelah render, sisipkan subbar
    updateGlobalSubbar(group, view);
    // pastikan tab utama tetap ke-highlight (switchTab asli mungkin ubah .tab lama, tp tab3 kita pakai data-group)
    document.querySelectorAll(".tab3").forEach(t=>t.classList.toggle("active",t.dataset.group===group));
  }

  // ---------- pasang: bungkus switchTab supaya:
  //   (a) tetap bisa dipanggil kode lama (mis. openChoice menutup & switchTab)
  //   (b) highlight tab utama yg sesuai
  function install(){
    if(typeof switchTab!=="function")return;
    _realSwitch=switchTab;
    switchTab=function(name){
      const r=_realSwitch.apply(this,arguments);
      const group=VIEW2GROUP[name]||"Hidup";
      _activeGroup=group;
      if(group!=="Hidup")lastSub[group]=name;
      try{updateGlobalSubbar(group,name);}catch(e){}
      document.querySelectorAll(".tab3").forEach(t=>t.classList.toggle("active",t.dataset.group===group));
      return r;
    };
    buildTabbar();
  }

  // sembunyikan sub-bar saat kembali ke layar non-game
  function hideSubbar(){const h=document.getElementById("globalSubbar");if(h){h.innerHTML="";h.classList.add("hidden");}}
  if(typeof showStart==="function"){const _ps=showStart;showStart=function(){hideSubbar();return _ps.apply(this,arguments);};}
  if(typeof beginLife==="function"){const _pb=beginLife;beginLife=function(){hideSubbar();return _pb.apply(this,arguments);};}

  // jalankan saat siap & tiap mulai hidup (tabbar di-show)
  function boot(){try{install();}catch(e){}}
  if(document.readyState!=="loading")setTimeout(boot,0);
  else document.addEventListener("DOMContentLoaded",boot);

  // re-build tabbar tiap confirmCustomize (saat game mulai, tabbar baru muncul)
  if(typeof confirmCustomize==="function"){
    const _prevCC=confirmCustomize;
    confirmCustomize=function(){const r=_prevCC.apply(this,arguments);try{buildTabbar();navGroup("Hidup");}catch(e){}return r;};
  }
  if(typeof loadSlot==="function"){
    const _prevLS=loadSlot;
    loadSlot=function(){const r=_prevLS.apply(this,arguments);try{buildTabbar();navGroup("Hidup");}catch(e){}return r;};
  }
})();

function gainFactionRep(n){
  if(!alive() || !C._faction) return;
  var before=factionRank(C._faction.rep);
  C._faction.rep=Math.min(100, C._faction.rep+n);
  var after=factionRank(C._faction.rep);
  EXP.emit("faction", n);
  if(after>before){
    C._faction.rank=after;
    var f=FACTIONS[C._faction.id];
    var reward=100+after*150;
    C.coin+=reward;
    if(typeof updateTitle==="function") updateTitle();
    LOG("⬆ Kau naik pangkat "+f.name+" menjadi "+FACTION_RANKS[after]+"! (+"+reward+" keping)","e-epic");
    T("⬆ Pangkat baru: "+FACTION_RANKS[after]);

    if(typeof playSFX==="function") try{ playSFX("win"); }catch(e){}

}
function factionYearly(){

function spawnRival(){
  if(!alive() || C._rival) return;
  var female=ch(0.5);
  var FM=(typeof FIRST_F!=="undefined"&&typeof FIRST_M!=="undefined")?(female?FIRST_F:FIRST_M):["Kael","Vex","Mora","Sable"];
  var SN=(typeof SURNAME!=="undefined")?SURNAME:["Duskbane","Vexley"];
  var name=pick(FM)+" "+pick(SN);
  var base=Math.max(20, Math.round((stat("might")+stat("mana")+stat("mind"))/3));
  C._rival={
    name:name, female:female, level:1,
    might: cl(base+ri(-5,10)), mana: cl(base+ri(-8,8)),
    mind: cl(base+ri(-8,8)), charm: cl(base+ri(-8,8)),
    hostility: ri(45,70), beaten:0, spawnAge:C.age
  };
  LOG("😤 Seorang rival muncul dalam hidupmu: <b>"+esc(name)+"</b>. Takdir kalian kini bertaut.","e-arcane");
  T("😤 Rival baru: "+name);

function rivalPower(rv){ return rv.might + rv.mana*0.8 + rv.mind*0.5 + rv.charm*0.4; }
function myPower(){ return stat("might") + stat("mana")*0.8 + stat("mind")*0.5 + stat("charm")*0.4 + luck()*3; }
function growRival(){
  var rv=C._rival; if(!rv) return;
  var g=ri(0,3);
  rv.might=cl(rv.might+g); rv.mana=cl(rv.mana+ri(0,2));
  rv.mind=cl(rv.mind+ri(0,2)); rv.charm=cl(rv.charm+ri(0,2));
  if(ch(0.25)) rv.level++;
}
function duelRival(fromHub){
  if(!alive() || !C._rival){ T("Kau tak punya rival saat ini."); return; }
  if(fromHub){ if(typeof spendAction==="function" && !spendAction()){ T("Aksi tahun ini habis."); return; } expClose(); }
  var rv=C._rival;
  if(typeof playAnim==="function") try{ playAnim("clash",{dur:1100}); }catch(e){}
  var mp=myPower()*(0.85+Math.random()*0.3);
  var rp=rivalPower(rv)*(0.85+Math.random()*0.3);
  setTimeout(function(){
    if(mp>=rp){
      var rep=ri(15,30)+rv.level*3;
      C.reputation=(C.reputation||0)+rep;
      var lg=ri(8,16)+rv.level*3;
      awardLegacy(lg,"mengalahkan rival "+rv.name);
      addStat({might:2,happy:6});
      rv.beaten++; C._rivalsBeat=(C._rivalsBeat||0)+1;
      Dyn.get().rivals=(Dyn.get().rivals||0)+1; Dyn.save();
      EXP.emit("duel_win",1);
      if(typeof playAnim==="function") try{ playAnim("win",{text:"MENANG!"}); }catch(e){}
      if(C._rivalsBeat>=3) unlockAch("penakluk");
      if(rv.beaten>=2 || ch(0.5)){
        showResultSafe("⚔️","Rival Ditumbangkan!","e-epic",
          "Kau mengalahkan <b>"+esc(rv.name)+"</b> untuk selamanya. Namamu ditakuti. <br>(+"+rep+" reputasi, +"+lg+" Warisan Jiwa)");
        C._rival=null;
        setTimeout(function(){ if(alive()&&C.age>=15&&ch(0.6)) spawnRival(); }, 400);
      }else{
        rv.hostility=cl(rv.hostility+10);
        showResultSafe("⚔️","Kau Menang!","e-good",
          "Kau memukul mundur <b>"+esc(rv.name)+"</b>, tapi ia bersumpah balas dendam — kian kuat. <br>(+"+rep+" reputasi, +"+lg+" Warisan Jiwa)");
      }
    }else{
      var lc=ri(20,60), hd=ri(6,14);
      C.coin=Math.max(0,(C.coin||0)-lc);
      addStat({health:-hd,happy:-8});
      rv.hostility=cl(rv.hostility+8);
      if(typeof playAnim==="function") try{ playAnim("lose",{text:"KALAH"}); }catch(e){}
      showResultSafe("🩸","Kau Kalah","e-bad",
        "<b>"+esc(rv.name)+"</b> mengungguli kau. Kau kehilangan "+lc+" keping & terluka. Bangkitlah lebih kuat.");
    }
    REFRESH(); renderExp(); updateFab();
    if(hasC() && C.stats && C.stats.health<=0 && typeof die==="function") die("Kau gugur di tangan rivalmu, "+rv.name+".");
  }, fromHub?600:1150);
}
