function awardLegacy(n,reason){
  n=Math.max(1, Math.round(n*legacyMult()));
  var d=Dyn.get(); d.legacy+=n; d.earned+=n; Dyn.save();
  if(reason) T("✦ +"+n+" Warisan Jiwa ("+reason+")");
  updateFab(); renderExp();
  return n;
}
function computeDeathLegacy(){
  if(!hasC()) return 0;
  var nw = (typeof netWorth==="function") ? netWorth() : (C.coin||0);
  var props=(C.properties?C.properties.length:0), biz=(C.businesses?C.businesses.length:0);
  var g = C.age*1.1 + Math.sqrt(Math.max(0,nw))*0.7 + (C.reputation||0)*0.5
        + (C._lineage||1)*12 + (props+biz)*7 + (C._rivalsBeat||0)*20
        + (C._faction?(C._faction.rank+1)*10:0) + (C._destinyCount||0)*3;
  return Math.max(10, Math.round(g*legacyMult()));
}
function ascendCost(){ return 800*(asc()+1); }
function canAscend(){ return Dyn.get().earned >= ascendCost(); }

  d.ascension++; d.crystals+=15; d.legacy+=200; Dyn.save();

  showResultSafe("🌌","REINKARNASI AGUNG","e-epic",
    "Trah-mu menembus tabir kehidupan. Ascension tingkat <b>"+d.ascension+"</b>!<br>Semua keturunan kini +"+d.ascension+" seluruh stat awal, +25% Warisan Jiwa, & keberuntungan takdir. (+200 Warisan, +15 Kristal)");

}

  {id:"takdir",  type:"destiny",  target:1, ico:"🔮", text:"Hadapi 1 Kartu Takdir",         coin:0,   crystal:2, lg:4}
];
function seededPick(arr,n,seed){
  var a=arr.slice(), out=[], s=seed;
  function rng(){ s=(s*9301+49297)%233280; return s/233280; }
  while(out.length<n && a.length){ var i=Math.floor(rng()*a.length); out.push(a.splice(i,1)[0]); }
  return out;
}
function ensureQuests(){
  var today=todayStr();
  if(Daily.questDate!==today || !Daily.quests || !Daily.quests.length){
    var seed=parseInt(today.replace(/-/g,""),10)||1;
    var chosen=seededPick(QUEST_POOL,3,seed);
    Daily.questDate=today;
    Daily.quests=chosen.map(function(q){ return {id:q.id,prog:0,done:false,claimed:false}; });
    daySave();
  }
}
function questDef(id){ for(var i=0;i<QUEST_POOL.length;i++) if(QUEST_POOL[i].id===id) return QUEST_POOL[i]; return null; }
function questProgress(type,amount){
  ensureQuests();
  var changed=false;
  Daily.quests.forEach(function(q){
    var def=questDef(q.id); if(!def || q.done) return;
    if(def.type===type){ q.prog=Math.min(def.target, q.prog+amount); if(q.prog>=def.target){ q.done=true; changed=true; } }
  });
  if(changed){ daySave(); T("✅ Misi harian selesai! Klaim di Balai Takdir."); updateFab(); renderExp(); }
}
function questCoinCheck(){
  ensureQuests();
  Daily.quests.forEach(function(q){
    var def=questDef(q.id); if(!def||q.done||def.type!=="coin_have") return;
    q.prog=Math.min(def.target, (hasC()?(C.coin||0):0));
    if(q.prog>=def.target) q.done=true;
  });
  daySave();
}
function claimQuest(id){
  ensureQuests();
  var q=Daily.quests.find(function(x){return x.id===id;}); var def=questDef(id);
  if(!q||!def||!q.done||q.claimed){ return; }
  q.claimed=true; daySave();
  var d=Dyn.get(); d.crystals+=def.crystal; if(def.lg){ d.legacy+=def.lg; d.earned+=def.lg; } Dyn.save();
  if(alive() && def.coin){ C.coin+=def.coin; }
  T("🎁 Hadiah misi diklaim!");
  if(Daily.quests.every(function(x){return x.claimed;})){
    var bonus=3+asc(); d.crystals+=bonus; d.legacy+=5; d.earned+=5; Dyn.save();
    T("🌟 Semua misi harian tuntas! Bonus +"+bonus+" Kristal, +5 Warisan.");
  }
  REFRESH(); renderExp(); updateFab();
}
/* --- tukar kristal --- */
function spendCrystal(kind){
  var d=Dyn.get();
  if(kind==="coin"){ if(d.crystals<3){ T("Butuh 3 Kristal."); return; } if(!alive()){ T("Perlu kehidupan aktif."); return; }
    d.crystals-=3; C.coin+=600; Dyn.save(); T("💰 +600 keping"); }
  else if(kind==="legacy"){ if(d.crystals<2){ T("Butuh 2 Kristal."); return; } d.crystals-=2; d.legacy+=10; d.earned+=10; Dyn.save(); T("✦ +10 Warisan Jiwa"); }
  else if(kind==="heal"){ if(d.crystals<4){ T("Butuh 4 Kristal."); return; } if(!alive()){ T("Perlu kehidupan aktif."); return; }
    d.crystals-=4; addStat({health:35,happy:15}); Dyn.save(); T("❤️ Nyawa & suka pulih"); }
  REFRESH(); renderExp(); updateFab();
}

  var d=Dyn(); if(d){ var dd=d.get(); if(!dd.arena) dd.arena={ points:0, bestStreak:0, belts:[], champions:[] }; }

    return "<button class='btl-act "+dis+"' onclick=\"arenaAct('"+a.k+"')\"><span class='ba-ic'>"+a.ic+"</span><span class='ba-l'>"+a.l+"</span><span class='ba-s'>"+a.s+"</span></button>";
  }).join("")
  + (BTL.allowFlee?"<button class='btl-act flee "+(BTL.busy?"dis":"")+"' onclick='arenaFlee()'><span class='ba-ic'>🏃</span><span class='ba-l'>Kabur</span><span class='ba-s'>"+(BTL.fleeReward?"bawa hadiah":"selamatkan diri")+"</span></button>":"");
}

function foeAI(){
  var f=BTL.foe, me=BTL.me;
  if(f.boss && f.charging) return "unleash";      // lepaskan serangan besar
  if(f.hp < f.maxHp*0.28 && ch(0.4)) return "tahan";
  if(f.mag>0 && me.guard && ch(0.5)) return "sihir";
  var r=Math.random();
  if(f.mag>0){ if(r<0.45) return "serang"; if(r<0.7) return "sihir"; if(r<0.85) return "tipu"; return "tahan"; }
  if(r<0.6) return "serang"; if(r<0.78) return "tipu"; return "tahan";
}

window.arenaAct=function(k){
  if(!BTL || BTL.busy) return;
  BTL.busy=true; renderDuel();
  resolveTurn(k, foeAI());
};
window.arenaFlee=function(){
  if(!BTL || BTL.busy) return;
  var ok = !BTL.foe.boss || ch(0.6);
  if(!ok){ btlLog("🏃 Kau gagal kabur dari sang boss!","bad"); BTL.busy=true; renderDuel(); resolveTurn("__none__", "unleash"); return; }
  var res={win:false, fled:true};
  endDuel(res, "🏃 Kau mundur dari pertarungan.");
};

function actDamage(src, action, srcStats){
  // src: 'me'|'foe'
  if(action==="serang"){
    var base = src==="me" ? (8+stat("might")*0.35) : (srcStats.atk*0.5+6);
    var low = src==="me" && BTL.me.sta<16;
    return { dmg: Math.round(base*rf(0.85,1.15)*(low?0.5:1)), type:"fis" };
  }
  if(action==="sihir"){
    var mbase = src==="me" ? (10+stat("mana")*0.42) : (srcStats.mag*0.55+7);
    var fizz = src==="me" && BTL.me.mana<20;
    return { dmg: fizz?0 : Math.round(mbase*rf(0.85,1.15)), type:"mag", fizz:fizz };
  }
  if(action==="unleash"){ // boss special
    return { dmg: Math.round((srcStats.atk*0.9+18)*rf(0.9,1.2)), type:"boss" };
  }
  return { dmg:0, type:"none" };
}

function resolveTurn(myAct, foeAct){
  var me=BTL.me, f=BTL.foe;
  me.guard=false; f.guard=false;
  // biaya & efek "persiapan"
  var myNote="", foeNote="";
  // --- fase persiapan: tahan / tipu ---
  if(myAct==="tahan"){ me.guard=true; me.sta=Math.min(me.maxSta, me.sta+30); me.mana=Math.min(me.maxMana, me.mana+12); myNote="Kau memasang kuda-kuda bertahan."; }
  if(myAct==="tipu"){ me.sta=Math.max(0, me.sta-10); if(ch(0.55+stat("mind")/300+stat("charm")/400)){ me.critNext=true; myNote="Kau memancing — serangan berikutmu akan kritikal!"; } else { myNote="Tipuanmu tak termakan."; } }
  if(myAct==="serang"){ me.sta=Math.max(0, me.sta-16); }
  if(myAct==="sihir"){ if(me.mana>=20) me.mana-=20; }

  if(foeAct==="tahan"){ f.guard=true; foeNote=f.name+" bertahan."; }
  if(foeAct==="tipu"){ if(ch(0.5)){ f.critNext=true; foeNote=f.name+" mengincar celah..."; } }

  // --- fase serang: hitung damage ---
  var toFoe=0, toMe=0, msgs=[];
  if(myAct==="serang"||myAct==="sihir"){
    var d=actDamage("me", myAct, null);
    if(d.fizz){ msgs.push({t:"🔮 Mana tak cukup — sihirmu buyar.",c:"bad"}); }
    else{
      var crit = me.critNext || ch(0.10+stat("mind")/500);
      var raw=d.dmg*(crit?1.9:1);
      if(f.guard) raw*= (d.type==="mag"?0.8:0.4);
      toFoe=Math.round(raw);
      msgs.push({t:(d.type==="mag"?"🔮":"⚔️")+" Kau "+(d.type==="mag"?"merapal":"menyerang")+" — "+toFoe+" dmg"+(crit?" 💥KRITIS!":"")+(f.guard?" (tertahan)":""), c:"good"});
      me.critNext=false;
    }
  } else if(myNote){ msgs.push({t:myNote,c:""}); }

  if(foeAct==="serang"||foeAct==="sihir"||foeAct==="unleash"){
    var fd=actDamage("foe", foeAct, f);
    var fcrit = f.critNext || ch(0.08);
    var fraw=fd.dmg*(fcrit?1.8:1);
    if(foeAct==="unleash"){ fraw = me.guard ? fraw*0.35 : fraw*1.15; f.charging=false; f.chargeIn=3; }
    else if(me.guard){ fraw*= (fd.type==="mag"?0.8:0.4); }
    toMe=Math.round(fraw);
    var label = foeAct==="unleash" ? ("🔥 "+f.name+" melepas "+f.special+" — "+toMe+" dmg"+(me.guard?" (kau bertahan!)":"!")) : ((fd.type==="mag"?"🔮":"⚔️")+" "+f.name+" menyerang — "+toMe+" dmg"+(fcrit?" 💥":"")+(me.guard?" (tertahan)":""));
    msgs.push({t:label, c:"bad"});
    f.critNext=false;
  } else if(foeNote){ msgs.push({t:foeNote,c:""}); }

  f.hp=Math.max(0, f.hp-toFoe);
  me.hp=Math.max(0, me.hp-toMe);
  // regen pasif kecil
  me.sta=Math.min(me.maxSta, me.sta+6);

  // boss telegraph untuk giliran berikut
  if(f.boss && f.hp>0){
    if(!f.charging){ f.chargeIn--; if(f.chargeIn<=0){ f.charging=true; } }
    if(f.hp<f.maxHp*0.5 && !f._enraged){ f._enraged=true; f.atk=Math.round(f.atk*1.25); msgs.push({t:"🐉 "+f.name+" MENGAMUK! Serangannya menguat.",c:"bad"}); }
  }

  msgs.forEach(function(m){ btlLog(m.t,m.c); });
  if(toFoe>toMe) anim("clash",{dur:600});

  // animasi pukulan singkat lalu update
  var mePunch=document.getElementById("btlMeAva"), foePunch=document.getElementById("btlFoeAva");
  if(toFoe>0 && foePunch){ foePunch.classList.add("hit"); }
  if(toMe>0 && mePunch){ mePunch.classList.add("hit"); }
  renderDuel();
  setTimeout(function(){ if(foePunch)foePunch.classList.remove("hit"); if(mePunch)mePunch.classList.remove("hit"); },260);

  // cek akhir
  if(f.hp<=0){ setTimeout(function(){ endDuel({win:true}, "🏆 "+f.name+" tumbang!"); },420); return; }
  if(me.hp<=0){ setTimeout(function(){ endDuel({win:false}, "🩸 Kau tumbang..."); },420); return; }
  BTL.turn++;
  BTL.busy=false; renderDuel();
}

function endDuel(res, msg){
  if(!BTL) return;
  var cb=BTL.onEnd; var wasBoss=BTL.foe.boss;
  btlLog(msg, res.win?"good":"bad");
  renderDuel();
  if(res.win){ anim("win",{text:"MENANG!"}); sfx("win"); } else if(!res.fled){ anim("lose",{text:"KALAH"}); sfx("lose"); }
  setTimeout(function(){
    var ov=document.getElementById("duelOverlay"); if(ov) ov.classList.remove("show");
    BTL=null;
    try{ cb(res); }catch(e){}
  }, res.win?900:(res.fled?200:900));
}
window.arenaDuelQuit=function(){
  if(!BTL) return;
  if(BTL.foe.boss){ T("Tak bisa keluar dari perburuan boss — kabur dulu!"); return; }
  var ov=document.getElementById("duelOverlay"); if(ov) ov.classList.remove("show");
  var cb=BTL.onEnd; BTL=null; try{ cb({win:false,quit:true}); }catch(e){}
};

function startRivalDuel(wager){

function rivalOutcome(res, wager){
  if(!alive()) return;
  var rv=C._rival;
  if(res.quit){ return; }
  if(res.win && rv){
    var rep=ri(16,32)+ (rv.level||1)*3;
    C.reputation=(C.reputation||0)+rep;
    var lg=ri(9,17)+(rv.level||1)*3;
    awardLegacy(lg,"menang duel rival");
    addStat({might:2,happy:7});
    C._rivalsBeat=(C._rivalsBeat||0)+1;
    var d=Dyn(); if(d){ var dd=d.get(); dd.rivals=(dd.rivals||0)+1; if(C._rivalsBeat>=3 && !dd.ach["penakluk"]){ dd.ach["penakluk"]=true; dd.legacy+=40; dd.earned+=40; T("🏅 Prestasi: Sang Penakluk (+40 Warisan)"); } d.save(); }
    recordWin(20+(rv.level||1)*4);
    emit("duel_win",1);
    var extra="";
    if(wager){ C.coin=(C.coin||0)+wager; extra="<br>💰 Kau memenangkan taruhan +"+coinFmt(wager)+" keping!"; }
    rv.beaten=(rv.beaten||0)+1;
    if(rv.beaten>=2 || ch(0.5)){
      C._rival=null;
      showRes("⚔️","Rival Ditumbangkan!","e-epic","Kau mengalahkan <b>"+esc(rv.name)+"</b> untuk selamanya. (+"+rep+" reputasi, +"+lg+" Warisan)"+extra);
      setTimeout(function(){ if(alive()&&C.age>=15&&ch(0.6)&&window.MantaraExp&&window.MantaraExp.spawnRival) window.MantaraExp.spawnRival(); },500);
    }else{
      rv.hostility=cl((rv.hostility||50)+10);
      if(rv.might!==undefined){ rv.might=cl(rv.might+3); rv.mana=cl(rv.mana+2); rv.level=(rv.level||1)+1; }
      showRes("⚔️","Kau Menang!","e-good","Kau memukul mundur <b>"+esc(rv.name)+"</b> — ia bangkit lebih kuat & haus balas. (+"+rep+" reputasi, +"+lg+" Warisan)"+extra);
    }
  } else if(!res.fled && rv){
    var lc = wager ? wager : ri(25,70);
    C.coin=Math.max(0,(C.coin||0)-lc);
    var hd=ri(8,16); addStat({health:-hd,happy:-9});
    rv.hostility=cl((rv.hostility||50)+8);
    recordLoss();
    showRes("🩸","Kau Kalah","e-bad","<b>"+esc(rv.name)+"</b> mengalahkanmu. Kau kehilangan "+coinFmt(lc)+" keping"+(wager?" (taruhan)":"")+" & terluka. Bangkitlah.");
    if(alive() && C.stats.health<=0 && typeof die==="function") die("Kau gugur di tangan rivalmu, "+rv.name+".");
  }
  REFRESH(); renderArena(); try{ if(window.expTab && document.getElementById("expOverlay") && document.getElementById("expOverlay").classList.contains("show")) window.expTab("Rival"); }catch(e){}
}

var GAUNTLET_FOES=[
  {name:"Bandit Jalanan",ico:"🦰"},{name:"Prajurit Sewaan",ico:"🪖"},{name:"Gladiator Veteran",ico:"🗡️"},
  {name:"Penyihir Kelana",ico:"🧙"},{name:"Ksatria Hitam",ico:"⚫"},{name:"Juara Bertahan",ico:"👑"},
  {name:"Iblis Arena",ico:"👹"},{name:"Raja Gladiator",ico:"🛡️"}
];
function startGauntlet(wave, purse){
  wave=wave||0; purse=purse||0;
  if(wave===0){ if(!spend()){ T("Aksi tahun ini habis."); return; } if((C.coin||0)<20){ T("Biaya masuk 20 keping."); return; } C.coin-=20; }
  var base=wave;
  var foeName=GAUNTLET_FOES[Math.min(wave,GAUNTLET_FOES.length-1)];
  var hp=Math.round(40 + wave*16 + stat("might")*0.2);
  var foe={ name:foeName.name+" (Gel."+(wave+1)+")", ico:foeName.ico, hp:hp, atk:14+wave*4, mag:wave>2?(8+wave*3):0, special:"Hantaman" };
  var prize=30+wave*35;
  startTacticalDuel(foe, {
    title:"Arena Bertahan · Gelombang "+(wave+1),
    allowFlee:true, fleeReward:purse,
    intro:"🏟️ Gelombang "+(wave+1)+": "+esc(foe.name)+" memasuki arena! Hadiah gelombang "+prize+" keping.",
    onEnd:function(res){
      if(res.win){
        var np=purse+prize;
        recordWin(10+wave*4);
        var a=A(); if(wave+1>a.gauntletBest) a.gauntletBest=wave+1;
        if(wave+1>=GAUNTLET_FOES.length){
          C.coin+=np+200; C.reputation=(C.reputation||0)+20; awardLegacy(25,"menuntaskan gauntlet");
          grantBelt("gauntlet","Sabuk Sang Bertahan");
          showRes("👑","ARENA DITAKLUKKAN!","e-epic","Kau bertahan hingga gelombang terakhir! Total "+coinFmt(np+200)+" keping, +Sabuk Sang Bertahan.");
          REFRESH(); renderArena(); return;
        }
        showRes("🏟️","Gelombang "+(wave+1)+" Lolos!","e-good","Kemenangan! Simpanan hadiah kini <b>"+coinFmt(np)+" keping</b>. Lanjut ke gelombang berikut, atau kabur untuk mengamankannya.",0);
        setTimeout(function(){ contPrompt(np, wave+1); }, 300);
      } else if(res.fled){
        C.coin+=purse; recordLoss();
        showRes("🏃","Mundur Aman","e-good","Kau keluar arena membawa "+coinFmt(purse)+" keping.");
        REFRESH(); renderArena();
      } else {
        recordLoss(); var hd=ri(6,14); addStat({health:-hd});

        REFRESH(); renderArena();
        if(alive() && C.stats.health<=0 && typeof die==="function") die("Tewas di arena.");
      }
    }
  });
}
function contPrompt(purse, nextWave){
  if(typeof openChoice!=="function") return;
  openChoice({ico:"🏟️",cancel:false,prompt:"Simpanan hadiah: <b>"+coinFmt(purse)+" keping</b>.<br>Lanjut ke gelombang "+(nextWave+1)+" (risiko lebih besar) atau amankan sekarang?",

      else if(approval>=55) recordWin(6); else recordLoss();
      showRes("🎻","Penampilan Selesai","e-good","Persetujuan penonton: <b>"+Math.round(approval)+"%</b>. Hadiah +"+coinFmt(reward)+" keping."+(approval>=90?"<br>🏅 Mahkota Bard Agung!":""));
      REFRESH(); renderArena(); return;
    }
    openChoice({ico:"🎻",cancel:false,prompt:"Babak "+(round+1)+"/3 · Persetujuan "+Math.round(approval)+"%<br><span style='font-size:11px;color:var(--ink-soft);filter:brightness(1.6)'>Pukau penonton — pilih pertunjukan:</span>",
      choices:MOVES.map(function(m){ return {label:m.l,run:function(){ round++; var bonus=stat(m.sw)/12; var delta=Math.round(m.base+bonus-8+rf(0,10)); approval=Math.max(0,Math.min(100,approval+delta)); anim(delta>=0?"win":"lose",{text:(delta>=0?"+":"")+delta+"% penonton",dur:750}); setTimeout(perform,600); return null; }}; })});
  }
  perform();
}

// Blackjack / 21
function game21(){
  if(!spend()){ T("Aksi habis."); return; }
  bet("🂡 Angka Sakti (21) — dekati 21 tanpa lewat","🂡",function(b){
    C.coin-=b;
    var draw=function(){ return Math.min(11, ri(1,11)); };
    var me=[draw(),draw()], dealer=[draw()];
    var sum=function(a){ var s=a.reduce(function(x,y){return x+y;},0); var aces=a.filter(function(v){return v===11;}).length; while(s>21&&aces>0){ s-=10; aces--; } return s; };
    if(typeof closeModal==="function") closeModal();
    var step=function(){
      var ms=sum(me);
      if(ms>21){ settle(); return; }
      openChoice({ico:"🂡",cancel:false,prompt:"Kartumu: <b>"+me.join("+")+" = "+ms+"</b><br>Bandar buka: "+dealer[0]+"<br>Taruhan "+b,
        choices:[
          {label:"➕ Tarik (Hit)",run:function(){ me.push(draw()); if(sum(me)>21){ setTimeout(settle,120);} else setTimeout(step,120); return null; }},
          {label:"✋ Cukup (Stand)",run:function(){ setTimeout(settle,120); return null; }}
        ]});
    };
    var settle=function(){
      var ms=sum(me);
      while(sum(dealer)<17){ dealer.push(draw()); }
      var ds=sum(dealer);
      if(typeof closeModal==="function") closeModal();
      if(ms>21){ done("🂡 Kau melewati 21 ("+ms+"). Kalah "+b+".","e-bad","lose"); }
      else if(ms===21 && me.length===2){ var g=Math.round(b*2.5); C.coin+=g; done("🂡 BLACKJACK! ("+ms+") Menang +"+g+"!","e-epic","win","BLACKJACK"); }
      else if(ds>21 || ms>ds){ var w=b*2; C.coin+=w; done("🂡 Kau "+ms+" vs bandar "+ds+". MENANG +"+w+"!","e-epic","win"); }
      else if(ms===ds){ C.coin+=b; done("🂡 Seri ("+ms+"). Taruhan kembali.","e-good"); }
      else { done("🂡 Kau "+ms+" vs bandar "+ds+". Kalah "+b+".","e-bad","lose"); }
    };
    step();
  });
}
// Roda Takdir (wheel)
function gameWheel(){
  if(!spend()){ T("Aksi habis."); return; }
  bet("☸️ Roda Takdir — putar untuk pengganda","☸️",function(b){
    C.coin-=b; if(typeof closeModal==="function") closeModal(); anim("dice",{text:"☸️",dur:900});
    setTimeout(function(){
      var seg=[[0,0.16],[0.5,0.18],[1,0.20],[2,0.24],[3,0.13],[5,0.07],[10,0.02]];
      var r=Math.random(), acc=0, mult=0;
      for(var i=0;i<seg.length;i++){ acc+=seg[i][1]; if(r<=acc){ mult=seg[i][0]; break; } }
      var g=Math.round(b*mult);
      if(mult>=5){ C.coin+=g; done("☸️ Roda berhenti di ×"+mult+" — JACKPOT +"+g+"!","e-epic","win","×"+mult); }
      else if(mult>=1){ C.coin+=g; done("☸️ Roda ×"+mult+". "+(mult===1?"Taruhan kembali.":"Menang +"+g+"!"),"e-good","win"); }
      else { done("☸️ Roda ×"+mult+". Kalah "+(b-g)+".","e-bad","lose"); }
    },900);
  });
}
// Tebak Cangkir (cups, ladder)
function gameCups(prevWin){
  if(prevWin===undefined){ if(!spend()){ T("Aksi habis."); return; } }
  var stake=prevWin||0;
  var play=function(b){
    if(!prevWin){ C.coin-=b; stake=b; }
    if(typeof closeModal==="function") closeModal();
    var gem=ri(0,2);
    openChoice({ico:"🥤",cancel:false,prompt:"🥤🥤🥤 Permata di bawah salah satu cangkir. Taruhan "+coinFmt(stake)+".<br>Tebak (peluang ~"+(Math.round((0.34+stat("mind")/500)*100))+"%):",
      choices:[0,1,2].map(function(i){ return {label:"Cangkir "+(i+1),run:function(){
        if(typeof closeModal==="function") closeModal();
        var win = (i===gem) || ch(stat("mind")/900);
        if(win){ var g=Math.round(stake*2.6); done("🥤 Benar! Permata di cangkir "+(gem+1)+". Menang "+coinFmt(g)+"!","e-epic","win"); setTimeout(function(){ cupLadder(g); },500); }
        else { done("🥤 Salah! Permata di cangkir "+(gem+1)+". Kehilangan "+coinFmt(stake)+".","e-bad","lose"); REFRESH(); }
        return null;
      }}; })});
  };
  if(prevWin){ play(); } else { bet("🥤 Tebak Cangkir — permata di antara 3 cangkir","🥤",play); }
}
function cupLadder(winnings){
  C.coin+=winnings;
  if(typeof openChoice!=="function") return;
  openChoice({ico:"🥤",cancel:false,prompt:"Kau pegang <b>"+coinFmt(winnings)+" keping</b>. Pertaruhkan lagi untuk ×2.6, atau simpan?",
    choices:[
      {label:"🔁 Gandakan (risiko)",cls:"love",run:function(){ C.coin-=winnings; setTimeout(function(){ gameCups(winnings); },120); return null; }},
      {label:"💰 Simpan "+coinFmt(winnings),run:function(){ REFRESH(); return {t:"Kau menyimpan "+coinFmt(winnings)+" keping.",cls:"e-good"}; }}
    ]});
}
// Double or Nothing (coin ladder)
function gameDouble(){
  if(!spend()){ T("Aksi habis."); return; }
  bet("🪙 Lipat Ganda — lempar koin, menang ×2 beruntun","🪙",function(b){
    C.coin-=b;
    var pot=b*2, round=1;
    var flip=function(){
      if(typeof closeModal==="function") closeModal();
      openChoice({ico:"🪙",cancel:false,prompt:"Putaran "+round+" · Pot: <b>"+coinFmt(pot)+"</b>.<br>Lempar lagi (×2) atau ambil?",
        choices:[
          {label:"🪙 Lempar (50/50)",cls:"love",run:function(){ if(typeof closeModal==="function") closeModal(); anim("coin",{text:"🪙",dur:600}); setTimeout(function(){
              if(ch(0.5-(round*0.01))){ pot*=2; round++; done("🪙 Sisi keberuntungan! Pot jadi "+coinFmt(pot)+".","e-good",null); setTimeout(flip,250); }
              else { done("🪙 Sisi sial! Kau kehilangan seluruh pot "+coinFmt(pot/2)+".","e-bad","lose"); REFRESH(); }
            },600); return null; }},
          {label:"💰 Ambil "+coinFmt(pot),run:function(){ C.coin+=pot; done("🪙 Kau mengambil "+coinFmt(pot)+" keping.","e-epic","win"); return null; }}
        ]});
    };
    flip();
  });
}
// Mesin Rune (3-reel slot)
function gameRune(){
  if(!spend()){ T("Aksi habis."); return; }
  bet("🎰 Mesin Rune — cocokkan 3 gulungan","🎰",function(b){
    C.coin-=b; if(typeof closeModal==="function") closeModal(); anim("dice",{text:"🎰",dur:900});
    setTimeout(function(){
      var S=["🔥","⚡","🌙","💎","⭐","🍀"];
      var r=[pick(S),pick(S),pick(S)];
      var g=0, cls="e-bad", txt="";
      if(r[0]===r[1] && r[1]===r[2]){ var m = r[0]==="💎"?25 : r[0]==="⭐"?12 : 8; g=b*m; cls="e-epic"; txt="TRIPEL "+r[0]+"! ×"+m; }
      else if(r[0]===r[1] || r[1]===r[2] || r[0]===r[2]){ g=Math.round(b*1.5); cls="e-good"; txt="pasangan"; }
      var line=r.join(" ");
      if(g>0){ C.coin+=g; done("🎰 "+line+" — "+txt+" +"+coinFmt(g)+"!",cls,"win",txt); }
      else { done("🎰 "+line+" — tak cocok. Kalah "+b+".","e-bad","lose"); }
    },900);
  });
}

  if(next){ var prevP=0; for(var j=0;j<RANKS.length;j++){ if(RANKS[j][0]<=a.points) prevP=RANKS[j][0]; } var pct=Math.round((a.points-prevP)/(next[0]-prevP)*100);

  h+="<div class='exp-sec'>Sabuk Juara ("+a.belts.length+")</div>";

  if(a.belts.length){ h+="<div class='exp-grid'>"+a.belts.map(function(id){ return "<div class='exp-ach'><div class='ai'>"+(BELT[id]||"🏅").split(" ")[0]+"</div><div class='an'>"+((BELT[id]||"Sabuk").split(" ").slice(1).join(" "))+"</div></div>"; }).join("")+"</div>"; }
  else h+="<div class='exp-card'><div class='exp-desc' style='text-align:center;padding:6px'>Belum ada sabuk. Menangkan gauntlet, adu sihir, panah, bard, atau buru naga untuk merebutnya.</div></div>";
  if(da && da.champions && da.champions.length){ h+="<div class='exp-sec'>Balai Juara Dinasti</div>"; da.champions.slice(0,8).forEach(function(c){ h+="<div class='exp-card'><div class='exp-row'><div class='exp-ico'>👑</div><div style='flex:1'><div class='exp-name'>"+esc(c.name)+"</div><div class='exp-desc'>"+esc(c.belt)+" · usia "+c.age+"</div></div></div></div>"; }); }
  return h;
}

function trainSkillCourse(skillId,cost,stats,msg,cls){
  const owned=C.skills.find(s=>s.id===skillId);
  const lvl=owned?owned.level:0;
  if(lvl>=5){toast("Kau sudah Mahaguru aliran ini (Tingkat 5) — tak ada lagi yang bisa diajarkan.");return;}
  if(C.coin<cost){toast("Koin kurang.");return;}
  if(!spendAction())return;
  C.coin-=cost;
  if(owned)owned.level++;else C.skills.push({id:skillId,level:1});
  applyStats(stats);
  finishAct(`${msg} (Keahlian naik ke Tingkat ${lvl+1}/5)`,cls||"e-good");
}

// item busana untuk katalog toko — status ✓ dimiliki tampil dinamis
function wardrobeShopItem(slot,key,price,minAge){
  const cat=WARDROBE_CATALOG[slot];
  const v=cat.variants.find(x=>x.key===key);
  if(!v)return null;
  ensureWardrobe();
  const owned=(C.wardrobeOwned[slot]||[]).includes(key);
  const perks=Object.entries(v.perk||{}).map(([k,val])=>`${STAT_META[k]?STAT_META[k].name:k}+${val}`).join(" ")||"—";
  return {label:`${cat.ico} ${v.name}${owned?' ✓':''}`,
    sub:owned?"sudah dimiliki · pakai di Aset → Wardrobe":`${cat.name} · ${perks}/th · 💰${price}`,
    price:owned?0:price,minAge:minAge||8,
    run:()=>{
      if(owned){toast("Sudah kau miliki — pakai lewat Aset → Wardrobe.");return;}
      storeBuyWardrobe(slot,key,price,v.name);
    }};
}
(function fashionAndStock(){
  // ===== BUTIK PENJAHIT (busana kain & gaya) =====
  STORES.push({id:"butik",ico:"🧵",name:"Butik Penjahit",cat:"Busana",city:["all"],
    desc:"Busana jahitan halus — tampil menawan tiap musim.",
    build:()=>[
      wardrobeShopItem("body","tunic",40,5),
      wardrobeShopItem("body","silk",160,12),
      wardrobeShopItem("legs","cloth",25,5),
      wardrobeShopItem("legs","riding",90,10),
      wardrobeShopItem("feet","sandals",20,5),
      wardrobeShopItem("feet","boots",75,8),
      wardrobeShopItem("head","hood",30,5),
      wardrobeShopItem("head","circlet",150,12),
    ].filter(Boolean)});
  // ===== TUKANG TONGKAT: tambah busana arcane =====
  const ws=STORES.find(s=>s.id==="wandsmith");
  if(ws){const _wb=ws.build;
    ws.build=()=>_wb().concat([
      wardrobeShopItem("body","arcane_robe",700,16),
      wardrobeShopItem("head","mage_hat",400,13),
      wardrobeShopItem("feet","swift",520,14),
    ].filter(Boolean));}

  // ===== STOK BERPUTAR =====
  // deterministik per (toko + kota + usia): buka ulang di tahun sama = stok sama
  // (anti reroll), tapi tahun/kota berbeda = stok berbeda -> selalu ada yg baru.
  window.mantaraStockRng=function(tag){
    let h=2166136261;const s=tag+"|"+(C?C.cityId:"")+"|"+(C?C.age:0);
    for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0;}
    return function(){h=Math.imul(h,1103515245)+12345>>>0;return h/4294967296;};
  };
  STORES.forEach(s=>{
    if(s.cat==="Bimbel"||s.cat==="Perguruan")return; // kursus selalu lengkap
    const _b=s.build;
    s.build=function(){
      const items=_b();
      const rng=mantaraStockRng(s.id);
      const kept=items.filter(()=>rng()<0.68);
      const minKeep=Math.min(3,items.length);
      for(let i=0;kept.length<minKeep&&i<items.length*3;i++){
        const cand=items[Math.floor(rng()*items.length)];
        if(!kept.includes(cand))kept.push(cand);
      }
      return kept;
    };
  });
})();

  if(C.careerLevel>=car.ranks.length-1){toast("Kau sudah di puncak karir ini! 👑");return;}
  if(!spendAction())return;
  const _st=typeof currentJobStyle==="function"?currentJobStyle():null;
  const p=(C.jobPerf||50)/140+(C.jobDev.level*0.06)+(C.stats.charm/400)+(_st&&_st.promo?_st.promo:0);
  if(Math.random()<p){
    C.careerLevel++;C.careerYears=0;C.jobPerf=clamp(C.jobPerf-20);
    finishAct(`📈 Promosi! Kau kini ${car.ranks[C.careerLevel]}.`,"e-epic","win");
  }else{
    C.jobPerf=clamp(C.jobPerf-ri(5,12));
    finishAct("Atasanmu belum terkesan. Naikkan performa & keahlian profesimu dulu.","e-bad");
  }
};

/* ---------- GAYA PROFESI: 1 karir, banyak jalur pengembangan ----------
   Saat mulai kerja, pilih Gaya (spesialisasi). Gaya menentukan bonus
   tahunan, gaji, risiko & peluang promosi — layaknya "fighting style". */
const JOB_CLASS={
  combat:["guard","knight","gladiator","thief","adventurer","captain"],
  arcane:["mage","mageteacher","alchemist","researcher","healer"],
  social:["merchant","bard","politician","diplomat","guildmaster","monarch","scholar"],
  labor:["farmer","blacksmith","cattle","farm"],

const JOB_STYLES={
  combat:[
    {id:"striker",ico:"🔥",name:"Penyerang",desc:"Gaji +15% & Kekuatan +2/th, tapi Nyawa -1/th",pay:0.15,stats:{might:2,health:-1}},

    {id:"mentor",ico:"🕯️",name:"Pembimbing",desc:"Pesona +2/th & promosi lebih mudah",pay:0,stats:{charm:2},promo:0.1},

function jobClassOf(id){for(const k in JOB_CLASS)if(JOB_CLASS[k].includes(id))return k;return "labor";}
function currentJobStyle(){
  if(!C||!C.career||!C.jobStyle||C.jobStyle.career!==C.career)return null;
  const set=JOB_STYLES[jobClassOf(C.career)]||[];
  return set.find(s=>s.id===C.jobStyle.id)||null;
}
window.chooseJobStyle=function(isChange){
  if(!C.career){toast("Kau belum bekerja.");return;}
  if(isChange&&!spendAction())return;
  const car=CAREERS.find(x=>x.id===C.career);

      C.jobStyle={career:C.career,id:s.id};
      setTimeout(()=>{try{renderKarir();}catch(e){}},80);
      return{t:`Kau memilih gaya ${s.ico} ${s.name}. Jalan karirmu kini khas milikmu.`,cls:"e-epic"};
    }}))});
};

// integrasi: reset state saat ganti/berhenti kerja, bonus & decay tiap tahun
(function jobHooks(){
  const _acJob=applyCareer;
  applyCareer=function(id){
    const before=C?C.career:null;
    const r=_acJob.apply(this,arguments);
    if(C&&C.career&&C.career!==before){
      C.jobPerf=50;C.jobDev={id:C.career,level:0};C.jobStyle=null;
      setTimeout(()=>{try{chooseJobStyle(false);}catch(e){}},400); // pilih gaya saat mulai
    }
    return r;
  };
  const _pcJob=processCareer;
  processCareer=function(){
    const had=C.career;
    const r=_pcJob.apply(this,arguments);
    if(!had||!C.career)return r;
    ensureJobState();
    const car=CAREERS.find(x=>x.id===C.career);if(!car)return r;
    if(C.jobDev.level>0){
      const bonus=Math.round(car.basepay*0.1*C.jobDev.level);
      C.coin+=bonus;
      log(C.age,`Bonus keahlian ${jobDevOf(C.career).name}: +${bonus} keping.`,"e-good");
    }
    // efek Gaya Profesi tahunan
    const st=currentJobStyle();
    if(st){
      if(st.pay){const p=Math.round(car.basepay*st.pay);C.coin+=p;log(C.age,`Gaya ${st.name}: gaji ekstra +${p}.`,"e-good");}
      if(st.stats)applyStats(st.stats);
      if(st.rep)C.reputation+=st.rep;
      if(st.bonusAct&&typeof grantActionBonus==="function")grantActionBonus(1);
      if(st.risky&&chance(0.15)){applyStats({health:-ri(3,9)});log(C.age,"⚗️ Eksperimenmu meledak! Untung hanya alis yang hangus.","e-bad");}
      if(st.shady&&chance(0.15)){C.reputation-=ri(2,5);log(C.age,"🕶️ Gosip liar soal caramu bekerja menyebar...","e-bad");}
    }
    if((C.jobPerf>=75)&&C.careerLevel<car.ranks.length-1&&chance(0.3+(st&&st.promo?st.promo:0))){
      C.careerLevel++;C.careerYears=0;C.jobPerf=clamp(C.jobPerf-15);
      log(C.age,`Performamu diakui — promosi jadi ${car.ranks[C.careerLevel]}!`,"e-epic");
    }
    C.jobPerf=clamp(C.jobPerf-((st&&st.perfGuard)?ri(1,3):ri(2,6)));
    return r;
  };
})();

  .un-cell.snk{background:rgba(139,38,53,.16);border-color:rgba(224,154,154,.4);}

  .un-info{font-size:11.5px;color:var(--parchment);margin:4px 0 8px;line-height:1.4;min-height:30px;}
  `;
  document.head.appendChild(css);

  /* ---------- 🧹 BALAP SAPU TERBANG (tap-to-flap) ---------- */
  let brState=null;
  function brBuild(){
    if(document.getElementById("brOv"))return;
    const ov=document.createElement("div");
    ov.id="brOv";ov.className="br-ov";
    document.body.appendChild(ov);
  }
  window.startBroomRace=function(){
    if(typeof C==="undefined"||!C||!C.alive)return;
    if(C.age<10){toast("Terlalu muda untuk balap sapu (min 10).");return;}
    if(!spendAction())return;
    brBuild();
    const ov=document.getElementById("brOv");
    const stars=Array.from({length:14},()=>`<span class="br-star" style="left:${Math.random()*96}%;top:${Math.random()*94}%">✦</span>`).join("");
    ov.innerHTML=`<div class="br-panel">
      <div class="br-title">🧹 Balap Sapu Terbang — Lintasan Arcane</div>
      <div class="br-area" id="brArea">${stars}
        <div class="br-score" id="brScore">0</div>
        <div class="br-player" id="brPlayer">🧹</div>
        <div class="br-hint">ketuk untuk mengepak ke atas!</div>
      </div></div>`;
    ov.classList.add("show");
    const area=document.getElementById("brArea"),player=document.getElementById("brPlayer");
    const H=320,W=area.clientWidth||368,PX=56,SZ=26;
    brState={py:H/2,vy:0,pipes:[],score:0,over:false,last:performance.now(),spawn:0,raf:null};
    function flap(){if(brState&&!brState.over){brState.vy=-235;player.style.transform="rotate(-14deg)";setTimeout(()=>{if(player)player.style.transform="rotate(6deg)";},140);}}
    area.onclick=flap;
    function end(){
      if(!brState||brState.over)return;
      brState.over=true;
      if(brState.raf)cancelAnimationFrame(brState.raf);
      const sc=brState.score;
      const g=sc*8+(sc>=10?60:0);
      C.coin+=g;
      if(C.isMage&&sc>=5)applyStats({mana:+3});
      applyStats({happy:sc>=5?+5:+1});

        ov.classList.remove("show");

          :sc>0?`🧹 Balap selesai: ${sc} gerbang. +${g} keping.`
          :"🧹 Kau terjungkal di gerbang pertama. Penonton menahan tawa.",
          sc>=10?"e-epic":(sc>0?"e-good":"e-bad"));
      },800);
    }
    function tick(now){
      if(!brState||brState.over)return;
      const dt=Math.min(0.032,(now-brState.last)/1000);brState.last=now;
      brState.vy+=640*dt;brState.py+=brState.vy*dt;
      if(brState.py<4||brState.py>H-SZ-2)return end();
      player.style.top=brState.py+"px";
      brState.spawn-=dt;
      if(brState.spawn<=0){
        brState.spawn=1.55;
        const gap=105,gy=40+Math.random()*(H-gap-80);

        brState.pipes.push({x:W,top,bot,passed:false});
      }
      for(let i=brState.pipes.length-1;i>=0;i--){
        const p=brState.pipes[i];
        p.x-=135*dt;
        p.top.style.left=p.x+"px";p.bot.style.left=p.x+"px";

          const gy=parseFloat(p.top.style.height),gap=105;
          if(brState.py<gy-4||brState.py+SZ>gy+gap+4)return end();
        }

      brState.raf=requestAnimationFrame(tick);
    }

  /* ---------- 🐍 ULAR NAGA & TANGGA AWAN (papan vs lawan kedai) ---------- */
  const UN_LADDERS={2:13,7:16,15:25,21:28};

  let un=null;
  window.startUlarNaga=function(){
    if(typeof C==="undefined"||!C||!C.alive)return;

    const bet=10;

  function unCellNum(dr,col){const rb=5-dr;return rb%2===0?rb*5+col+1:rb*5+(5-col);}
  function unRender(){
    const ov=document.getElementById("unOv");if(!ov||!un)return;
    let cells="";
    for(let dr=0;dr<6;dr++)for(let col=0;col<5;col++){
      const n=unCellNum(dr,col);
      const lad=UN_LADDERS[n],snk=UN_SNAKES[n];
      let ico="";
      if(n===30)ico="🏆";else if(lad)ico="🪜";else if(snk)ico="🐉";
      let who="";
      if(un.me===n&&un.foe===n)who="🧍🤺";
      else if(un.me===n)who="🧍";else if(un.foe===n)who="🤺";
      cells+=`<div class="un-cell ${lad?'lad':''}${snk?' snk':''}${n===30?' fin':''}"><span class="n">${n}</span>${who||ico}</div>`;
    }
    ov.innerHTML=`<div class="br-panel">
      <div class="br-title">🐍 Ular Naga & Tangga Awan</div>
      <div style="font-size:10.5px;color:var(--ink-soft);filter:brightness(1.6)">🪜 tangga naik · 🐉 naga menelanmu turun · pertama ke 🏆 menang pot 25 keping</div>
      <div class="un-board">${cells}</div>
      <div class="un-info">${un.msg}</div>
      ${un.over
        ?`<button class="ss-btn" onclick="document.getElementById('unOv').classList.remove('show')">Selesai</button>`
        :`<button class="ss-btn" id="unRoll" ${un.turn==="me"?"":"disabled"} onclick="unRollMe()">🎲 Lempar Dadu</button>`}
    </div>`;
  }
  function unMove(who,d){
    let pos=un[who]+d;
    let note="";
    if(pos>=30){un[who]=30;return {pos:30,note:""};}
    if(UN_LADDERS[pos]){note=` — 🪜 naik ke ${UN_LADDERS[pos]}!`;pos=UN_LADDERS[pos];}
    else if(UN_SNAKES[pos]){note=` — 🐉 naga menelan, turun ke ${UN_SNAKES[pos]}!`;pos=UN_SNAKES[pos];}

  }
  window.unRollMe=function(){
    if(!un||un.over||un.turn!=="me")return;
    const d=ri(1,6);

})();

window.schoolEkskulTrain=function(){
  if(!slEnrolled()){toast("Kau sedang tidak bersekolah.");return;}
  const sl=slState();
  const e=SCHOOL_EKSKUL.find(x=>x.id===sl.ekskul);
  if(!e){toast("Pilih ekstrakurikuler dulu di menu 🎯.");schoolEkskulPopup();return;}
  if(e.train==="shot"){
    if(!spendAction())return;
    skillShotGame({title:`Latihan ${e.name}`,ico:e.ico,desc:"Bidik sasaran jerami — zona emas = tembakan pusat!",gold:12+C.stats.mind*0.08,speed:1.4},function(res){
      if(res==="perfect"){applyStats({might:+4,mind:+3,happy:+4});finishAct(`${e.ico} Tepat di pusat sasaran! Pelatih bersiul kagum.`,"e-epic","win");}
      else if(res==="good"){applyStats({might:+2,mind:+2,happy:+2});finishAct(`${e.ico} Tembakan bagus — terus berlatih.`,"e-good");}
      else{applyStats({happy:-1});finishAct(`${e.ico} Anak panahmu nyasar ke topi pelatih. Oops.`,"e-bad");}
    });
  }else if(e.train==="duel"){
    if(!(window.MantaraArena&&MantaraArena.startTacticalDuel)){
      if(!spendAction())return;
      applyStats(e.gain);finishAct(`${e.ico} Latihan keras di ${e.name}.`,"e-good","win");return;
    }
    if(!spendAction())return;
    const foe={name:"Kawan Sparring",ico:"🧒",hp:28+C.age*2,atk:8+Math.round(C.age/3),mag:0,special:"Serangan Kejutan"};
    MantaraArena.startTacticalDuel(foe,{
      title:`Sparring ${e.name}`,allowFlee:true,
      intro:`${e.ico} Sparring persahabatan dimulai — tunjukkan hasil latihanmu!`,
      onEnd:function(res){
        if(res&&res.win){applyStats({might:+(e.gain.might||3),health:+(e.gain.health||0),happy:+5});
          finishAct(`${e.ico} Kau memenangkan sparring! Pelatih mengangguk bangga.`,"e-epic","win");}
        else if(res&&!res.quit){applyStats({might:+1,health:-ri(2,5)});
          finishAct(`${e.ico} Kalah sparring, tapi tetap dapat pelajaran (dan memar).`,"e-bad");}
      }});
  }else if(e.train==="magic"){
    if(!C.isMage){toast("Khusus penyihir.");return;}
    if(!spendAction())return;
    applyStats(e.gain);applyStats({happy:+2});
    playAnim&&playAnim("win",{text:e.ico});
    finishAct(`${e.ico} Mantramu makin stabil — ${e.name} menempamu.`,"e-arcane","win");
  }else{
    if(!spendAction())return;
    applyStats(e.gain);
    finishAct(`${e.ico} Latihan ${e.name} berjalan seru.`,"e-good","win");
  }
};

(function schoolLifeYearly(){
  const _slAY=advanceYear;

    const r=_slAY.apply(this,arguments);
    try{
      if(slEnrolled()){
        const sl=slState();

          if(c.trouble&&chance(0.25)){applyStats({happy:-3});log(C.age,`${c.ico} Geng-mu kena hukuman guru — kau ikut menyalin gulungan.`,"e-bad");}
        }
        const e=SCHOOL_EKSKUL.find(x=>x.id===sl.ekskul);
        if(e&&chance(0.55)){
          const half={};for(const k in e.gain)half[k]=Math.max(1,Math.round(e.gain[k]/2));

        }

    }catch(err){}

/* ==================================================================
   MANTARA — SISTEM SUB-HALAMAN (ala BitLife)
   Halaman penuh bertumpuk dengan tombol back. Menu = halaman,

const MP={stack:[]};
let _pgH=[];
window._pgRun=function(i){const f=_pgH[i];if(f)f();};
function pgSec(t){return `<div class="pg-sec">${t}</div>`;}
function pgNote(t){return `<div class="pg-note">${t}</div>`;}
function pgRow(o){
  const idx=o.on?(_pgH.push(o.on)-1):-1;
  return `<div class="pg-row ${o.dim?'dim':''}" ${idx>=0&&!o.dim?`onclick="_pgRun(${idx})"`:""}>
    <div class="pg-ico">${o.ico||""}</div>
    <div class="pg-main"><div class="pg-title">${o.title||""}</div>
    ${o.sub?`<div class="pg-sub">${o.sub}</div>`:""}
    ${o.bar!==undefined?`<div class="pg-bar"><div class="fill ${o.barCls||'f-happy'}" style="width:${Math.max(2,Math.min(100,Math.round(o.bar)))}%"></div></div>`:""}</div>
    ${o.right?`<div class="pg-right">${o.right}</div>`:""}
    ${o.chev?`<div class="pg-chev">›</div>`:""}</div>`;
}
function mpEnsure(){
  if(document.getElementById("mpage"))return;
  const el=document.createElement("div");
  el.id="mpage";el.className="mpage";
  el.innerHTML=`<div class="mp-head"><button class="mp-back" onclick="popPage()">‹</button><div class="mp-title" id="mpTitle"></div></div><div class="mp-body" id="mpBody"></div>`;
  const phone=document.querySelector(".phone")||document.body;
  phone.appendChild(el);
}
function mpRender(){
  mpEnsure();
  const el=document.getElementById("mpage");
  if(!MP.stack.length){el.classList.remove("show");return;}
  const p=MP.stack[MP.stack.length-1];
  _pgH=[];
  document.getElementById("mpTitle").textContent=p.title||"";
  document.getElementById("mpBody").innerHTML=p.render();
  el.classList.add("show");
}
window.pushPage=function(p){MP.stack.push(p);mpRender();};
window.popPage=function(){MP.stack.pop();mpRender();};
window.mpRefresh=function(){if(MP.stack.length)mpRender();};
window.mpCloseAll=function(){MP.stack=[];mpRender();};
// halaman tertutup saat pindah tab / mati / ke menu
(function mpHooks(){
  const _st=switchTab;switchTab=function(){try{mpCloseAll();}catch(e){}return _st.apply(this,arguments);};
  if(typeof die==="function"){const _d=die;die=function(){try{mpCloseAll();}catch(e){}return _d.apply(this,arguments);};}
})();
// helper aksi dalam halaman: jalankan lalu refresh halaman & HUD
function pgDo(fn){
  return function(){
    const r=fn();
    if(r&&r.t){log(C.age,r.t,r.cls||"e-good");toast(r.t);}
    try{updateTitle();renderHidup();}catch(e){}
    mpRefresh();
  };
}

function slClass(){
  const sl=slState();
  const tier=C.school?C.school.currentTier:-1;
  if(!sl.klass||sl.klassTier!==tier){
    const tf=chance(0.5);
    sl.klassTier=tier;
    sl.klass={
      teacher:{name:randName(tf),female:tf,bond:ri(30,50)},
      mates:Array.from({length:ri(6,8)},()=>{const f=chance(0.5);
        return {name:randName(f),female:f,bond:ri(15,55),
          trait:rand(["ceria","pendiam","jahil","rajin","sok jago","penakut","baik hati","tukang gosip"]),friended:false};})
    };
  }
  return sl.klass;
}
function classPopularity(){
  const k=slClass();
  return Math.round(k.mates.reduce((s,m)=>s+m.bond,0)/k.mates.length);
}

};
const HOME_ICON={peasant:"🛖",noble:"🏛️",mageborn:"🗼",merchant_kid:"🏘️",orphan:"🏚️"};
function ensureHousehold(){
  if(C.household)return C.household;
  const o=C.origin||"peasant";
  const nExtra=o==="noble"?ri(3,4):(o==="orphan"?ri(1,2):ri(2,3));
  const pool=HOME_FACILITIES.filter(f=>!f.base&&!f.rare);
  // undian berbobot sesuai asal-usul + keberuntungan
  const picked=[];
  for(let i=0;i<nExtra&&pool.length;i++){
    const tot=pool.reduce((s,f)=>s+((f.w&&f.w[o])||1),0);
    let r=Math.random()*tot,sel=pool[0];
    for(const f of pool){r-=((f.w&&f.w[o])||1);if(r<=0){sel=f;break;}}
    picked.push(sel.id);pool.splice(pool.indexOf(sel),1);
  }
  if(chance(0.06))picked.push("dragon"); // keberuntungan legendaris!
  C.household={
    name:rand(HOME_NAMES[o]||HOME_NAMES.peasant)+(o==="orphan"?"":" "+(C.name.split(" ").pop()||"")),
    ico:HOME_ICON[o]||"🏠",
    facilities:["bed","yard","desk"].concat(picked),
  };
  return C.household;
}

      if(!spendAction())return;

        else{applyStats({happy:-1});finishAct("🎯 Rune melesat lolos. Besok coba lagi.","e-bad");}

          finishAct(`🐎 Kau menang balapan halaman melawan anak tetangga! +${g} keping taruhan kecil.`,"e-epic","win");}
        else{applyStats({might:+2,happy:-1});finishAct("🐎 Kalah tipis di tikungan terakhir. Kudamu butuh latihan.","e-bad");}
      },900);return;
    case "jacuzzi":
      if(!spendAction())return;
      applyStats({health:+7,happy:+6});finishAct("♨️ Berendam di mata air panas — penat lenyap.","e-good","win");return;
    case "pool":
      if(!spendAction())return;
      applyStats({health:+5,might:+3,happy:+3});finishAct("🏊 Berenang bolak-balik hingga lengan pegal.","e-good","win");return;
    case "forge":
      if(!spendAction())return;
      applyStats({might:+4});
      if(chance(0.4)){const g=ri(5,15);C.coin+=g;finishAct(`⚒️ Kau menempa & memperbaiki alat tetangga (+${g} keping).`,"e-good","coin");}
      else finishAct("⚒️ Palu berdentang hingga senja — lenganmu mengeras.","e-good","win");return;
    case "swordhall":
      if(window.MantaraArena&&MantaraArena.startTacticalDuel){
        if(!spendAction())return;
        MantaraArena.startTacticalDuel(
          {name:"Pelatih Keluarga",ico:"🧔",hp:30+C.age*2,atk:9+Math.round(C.age/3),mag:0,special:"Tebasan Mengunci"},
          {title:"Sparring Aula Pedang",allowFlee:true,
           intro:"🗡️ Pelatih keluargamu mengangkat pedang kayu. \"Tunjukkan perkembanganmu!\"",
           onEnd:function(res){
             if(res&&res.win){applyStats({might:+5,happy:+4});finishAct("🗡️ Pelatih mengangguk: \"Kau melampaui hari kemarin.\"","e-epic","win");}
             else if(res&&!res.quit){applyStats({might:+2,health:-ri(2,5)});finishAct("🗡️ Kalah sparring — tapi tiap memar adalah pelajaran.","e-bad");}
           }});
      }else{if(!spendAction())return;applyStats({might:+4});finishAct("🗡️ Latihan pedang hingga peluh bercucuran.","e-good","win");}
      return;
    case "library":
      if(!spendAction())return;
      applyStats({mind:+ri(4,8)});
      if(chance(0.12)){applyStats({mana:+2});finishAct("📚 Kau menemukan catatan arcane tersembunyi di rak tua!","e-arcane","win");}
      else finishAct("📚 Gulungan demi gulungan — wawasanmu meluas.","e-good","win");return;
    case "herb":
      if(!spendAction())return;
      applyStats({health:+4});
      if(chance(0.35)){addItem("health_potion");finishAct("🌿 Panen bagus! Kau meracik Ramuan Nyawa (masuk Tas).","e-epic","win");}
      else finishAct("🌿 Kau merawat bedeng herbal, aromanya menenangkan.","e-good","win");return;
    case "altar":

      if(C.isMage){applyStats({mana:+ri(5,9),mind:+2});finishAct("🔮 Altar keluarga berpendar — manamu mengalir deras.","e-arcane","win");}
      else{applyStats({mind:+2,happy:+3});finishAct("🔮 Kau berdoa di altar leluhur. Batinmu tenang.","e-good","win");}return;
    case "music":

      applyStats({charm:+ri(3,6),happy:+2});finishAct("🎻 Gesekan biolamu membuat seisi rumah terdiam kagum.","e-good","win");return;
    case "pigeon":
      if(!spendAction())return;
      const rels=C.relations.filter(r=>r.role!=="musuh");
      if(rels.length){const r2=rand(rels);r2.bond=clamp((r2.bond||50)+ri(4,9));
        finishAct(`🕊️ Suratmu sampai ke ${r2.name} — ikatan kalian menguat.`,"e-good","win");}
      else{applyStats({charm:+2});finishAct("🕊️ Kau melatih merpati pos. Kelak berguna.","e-good");}return;
    case "games":
      if(!spendAction())return;
      applyStats({happy:+ri(4,7)});
      const fam=C.relations.filter(r=>r.role==="keluarga");
      if(fam.length){const fr=rand(fam);fr.bond=clamp(fr.bond+3);

      if(!spendAction())return;
      C._dragonYr=C.age;

      finishAct("🐉 Mata patung naga berpendar — berkat leluhur mengalir ke seluruh tubuhmu!","e-epic","win");return;
  }

          if(C.coin<price)return{t:"Koinmu belum cukup.",cls:"e-bad"};

    });
    h+=pgSec("Lainnya");
    h+=pgRow({ico:"🛒",title:"Distrik Toko "+city.name,sub:"barang, busana, perhiasan 💍, bimbel & perguruan",chev:1,on:()=>{mpCloseAll();switchTab("Toko");}});

function ensureKingdom(){
  if(C.kingdom)return C.kingdom;
  const dyn=rand(DYNASTIES);
  C.kingdom={
    king:{name:randName(chance(0.25)),age:ri(32,58),years:ri(2,18),dynasty:dyn,isPlayer:false},
    chancellor:randName(chance(0.4)),
    governors:{aetheria:randName(chance(0.3)),thornvale:randName(chance(0.3)),saltmoor:randName(chance(0.3)),frostspire:randName(chance(0.3))},
    news:[{yr:C.age,t:"👑 "+dyn+" memerintah Aetheria dalam damai yang rapuh."}],
  };
  return C.kingdom;
}
function kAddNews(t){
  const K=ensureKingdom();
  K.news.unshift({yr:C.age,t});
  if(K.news.length>40)K.news.pop();
}
function polRole(){return C.polRole&&C.polRole.role;}
function polIsKing(){return polRole()==="raja";}

(function kingdomYearly(){
  const _kAY=advanceYear;
  advanceYear=function(){
    const r=_kAY.apply(this,arguments);
    try{
      if(!C||!C.alive)return r;
      const K=ensureKingdom();
      // berita acak
      if(chance(0.6))kAddNews(rand(WORLD_NEWS_POOL));
      // raja menua & suksesi (kecuali kau rajanya)
      if(!K.king.isPlayer){
        K.king.age++;K.king.years++;
        const deathChance=K.king.age>65?0.18:(K.king.age>55?0.07:0.02);
        if(chance(deathChance)){
          const coup=chance(0.12);
          const newDyn=coup?rand(DYNASTIES.filter(d=>d!==K.king.dynasty)):K.king.dynasty;
          kAddNews(coup
            ?`⚔️ GEMPAR! ${K.king.dynasty} digulingkan — ${newDyn} merebut takhta lewat kudeta berdarah!`
            :`⚰️ Raja ${K.king.name} wafat. Pewaris ${K.king.dynasty} naik takhta.`);
          K.king={name:randName(chance(0.25)),age:ri(20,40),years:0,dynasty:newDyn,isPlayer:false};
          if(polRole()&&chance(0.3)){
            kAddNews(`🏛️ Perombakan istana: ${C.name} kehilangan jabatannya.`);
            log(C.age,"Raja baru merombak istana — jabatan politikmu dicopot!","e-bad");
            C.polRole=null;
          }
        }
        if(chance(0.06)){const city=rand(CITIES.filter(c=>!(C.polRole&&C.polRole.role==="gubernur"&&C.polRole.city===c.id)));
          K.governors[city.id]=randName(chance(0.3));
          kAddNews(`🏛️ ${city.name} melantik gubernur baru: ${K.governors[city.id]}.`);}
      }else{
        K.king.age=C.age;K.king.years++;
        if(chance(0.1)){C.reputation=Math.max(0,C.reputation-ri(2,5));
          kAddNews("🔥 Riak pemberontakan kecil dipadamkan pengawal kerajaan.");
          log(C.age,"Sebagian rakyat menggerutu atas kekuasaanmu.","e-bad");}
      }
      // stipend jabatan politik
      const pr=polRole();
      if(pr==="kanselir"){C.coin+=60;C.reputation+=2;log(C.age,"🏛️ Tunjangan Kanselir +60 keping.","e-good");}
      else if(pr==="gubernur"){C.coin+=90;C.reputation+=3;log(C.age,`🏛️ Tunjangan Gubernur ${cityOf(C.polRole.city).name} +90 keping.`,"e-good");}
      else if(pr==="raja"){C.coin+=150;C.reputation+=5;log(C.age,"👑 Upeti kerajaan +150 keping.","e-epic");}
      // guild tahunan
      if(C.guild){
        const g=GUILDS.find(x=>x.id===C.guild.id);
        if(g){
          C.guild.years++;
          if(C.coin>=5)C.coin-=5;else if(chance(0.5)){log(C.age,`${g.ico} Kau dikeluarkan dari ${g.name} karena menunggak iuran.`,"e-bad");C.guild=null;}
          if(C.guild){
            g.perk();
            if(C.guild.rank<g.ranks.length-1&&chance(0.25)){C.guild.rank++;
              log(C.age,`${g.ico} Kau naik pangkat di ${g.name}: ${g.ranks[C.guild.rank]}!`,"e-epic");}
          }
        }
      }
    }catch(e){}
    return r;
  };
})();

})();

/* ==================================================================
   MANTARA — PETA HIDUP + PERANGAI (traits ala CK3) + EKSPEDISI
   Peta dunia beranimasi: laut berombak & kapal berlayar, hutan
   berkunang, gunung bersalju, asap ibukota, awan & burung. Ada
   TEMPAT TERSEMBUNYI acak untuk dieksplorasi. Karakter lahir dengan
   PERANGAI yang mempengaruhi hidup & bisa menurun ke ahli waris.
   ================================================================== */
/* ---------- PERANGAI (traits) ---------- */
const TRAITS=[
  {id:"brave",ico:"🦁",name:"Pemberani",d:"Kekuatan +1/th · unggul saat bahaya & ekspedisi",y:{might:1}},
  {id:"ambitious",ico:"🔥",name:"Ambisius",d:"Reputasi +1/th, tapi Bahagia -1/th",y:{happy:-1},rep:1},
  {id:"scholar",ico:"📖",name:"Kutu Buku",d:"Akal +1/th · pandai membaca rune kuno",y:{mind:1}},
  {id:"charming",ico:"🌹",name:"Menawan",d:"Pesona +1/th",y:{charm:1}},
  {id:"greedy",ico:"🪙",name:"Tamak",d:"Menemukan koin lebih banyak, kadang reputasi tergores",coin:[3,8]},
  {id:"kind",ico:"🕊️",name:"Baik Hati",d:"Bahagia +1/th · relasi menguat perlahan",y:{happy:1},bond:true},
  {id:"lazy",ico:"😴",name:"Pemalas",d:"Nyawa +1/th, tapi kadang kehilangan 1 aksi",y:{health:1},lazy:true},
  {id:"gifted",ico:"✨",name:"Berbakat Arcane",d:"Mana +1/th",y:{mana:1}},
];
function ensureTraits(){
  if(C.traits&&C.traits.length)return C.traits;
  const pool=TRAITS.slice();
  C.traits=[];
  for(let i=0;i<2;i++){const t=rand(pool);C.traits.push(t.id);pool.splice(pool.indexOf(t),1);}
  return C.traits;
}
function hasTrait(id){return C.traits&&C.traits.includes(id);}
function traitOf(id){return TRAITS.find(t=>t.id===id);}
window.openTraitsPage=function(){
  ensureTraits();
  pushPage({title:"Perangai",render:function(){
    let h=pgNote("Perangai terbentuk sejak lahir — mewarnai hidupmu tiap tahun & membuka jalan di peristiwa tertentu. Sebagian menurun ke ahli warismu.");
    h+=pgSec("Perangaimu");
    C.traits.forEach(id=>{const t=traitOf(id);if(t)h+=pgRow({ico:t.ico,title:t.name,sub:t.d});});
    return h;
  }});
};
// efek tahunan perangai + pewarisan ke ahli waris
(function traitHooks(){
  const _tAY=advanceYear;
  advanceYear=function(){
    const r=_tAY.apply(this,arguments);
    try{
      if(!C||!C.alive)return r;
      ensureTraits();
      C.traits.forEach(id=>{
        const t=traitOf(id);if(!t)return;
        if(t.y)applyStats(t.y);
        if(t.rep)C.reputation+=t.rep;
        if(t.coin){const g=ri(t.coin[0],t.coin[1]);C.coin+=g;if(chance(0.12)){C.reputation=Math.max(0,C.reputation-1);}}
        if(t.bond&&C.relations.length&&chance(0.5)){const r2=rand(C.relations);r2.bond=clamp((r2.bond||50)+2);}
        if(t.lazy&&chance(0.25)){C.actionsLeft=Math.max(0,C.actionsLeft-1);}
      });
    }catch(e){}
    return r;
  };
  if(typeof buildHeirCharacter==="function"){
    const _bh=buildHeirCharacter;
    buildHeirCharacter=function(){
      const parentTraits=(C&&C.traits)?C.traits.slice():[];
      const r=_bh.apply(this,arguments);
      try{
        if(C&&parentTraits.length){
          const inherited=rand(parentTraits);
          const pool=TRAITS.filter(t=>t.id!==inherited);
          C.traits=[inherited,rand(pool).id];
          log(C.age,`${traitOf(inherited).ico} Kau mewarisi perangai "${traitOf(inherited).name}" dari orang tuamu.`,"e-arcane");
        }
      }catch(e){}
      return r;
    };
  }
})();
// tampilkan chip perangai di kartu karakter (tap untuk detail)
(function traitChips(){
  const _rh=renderHidup;
  renderHidup=function(){
    _rh.apply(this,arguments);
    try{
      ensureTraits();
      const el=document.querySelector("#viewHidup .charcard .cinfo");
      if(el&&!el.querySelector(".trait-chips")){
        const chips=C.traits.map(id=>{const t=traitOf(id);return t?`${t.ico} ${t.name}`:"";}).join(" · ");
        el.insertAdjacentHTML("beforeend",`<div class="cage trait-chips" onclick="openTraitsPage()" style="color:var(--gold);cursor:pointer">${chips} ›</div>`);
      }
    }catch(e){}
  };
})();
/* ---------- TEMPAT TERSEMBUNYI (ekspedisi ala event CK3) ---------- */
const MAP_POIS=[
  {id:"ruins",ico:"🏚️",name:"Reruntuhan Kuno",x:112,y:196,desc:"Sisa peradaban era Peperangan Kuno. Konon hartanya belum habis dijarah.",minAge:13},
  {id:"shrine",ico:"⛩️",name:"Altar Rimba",x:38,y:108,desc:"Altar tua berlumut di jantung hutan. Ada yang berbisik di sana.",minAge:10},
  {id:"cave",ico:"💎",name:"Gua Kristal",x:120,y:38,desc:"Gua berkilau di kaki gunung — cahayanya memanggil.",minAge:13},
  {id:"wreck",ico:"🚢",name:"Bangkai Kapal",x:288,y:222,desc:"Kerangka kapal dagang tua di pesisir berkabut.",minAge:13},
  {id:"tower",ico:"🗼",name:"Menara Sunyi",x:196,y:120,desc:"Menara penyihir yang ditinggalkan... atau tidak?",minAge:15},
];
function ensureMapPOI(){
  if(C.mapPOI)return C.mapPOI;
  const pool=MAP_POIS.slice();C.mapPOI=[];
  for(let i=0;i<3;i++){const p=rand(pool);C.mapPOI.push(p.id);pool.splice(pool.indexOf(p),1);}
  return C.mapPOI;
}
window.openPOIPage=function(pid){
  const p=MAP_POIS.find(x=>x.id===pid);if(!p)return;
  pushPage({title:p.name,render:function(){
    const explored=C._poiYr&&C._poiYr[pid]===C.age;
    let h=pgNote(`${p.ico} ${p.desc}`);
    h+=pgSec("Ekspedisi");
    h+=pgRow({ico:"🧭",title:explored?"Sudah dijelajahi tahun ini":"Jelajahi tempat ini",
      sub:explored?"kembalilah tahun depan — tempat ini menyimpan lebih banyak rahasia":(C.age<p.minAge?`🔒 min ${p.minAge} th`:"2 ⚡ · hasil tak terduga — perangaimu berpengaruh"),
      dim:explored||C.age<p.minAge,
      on:()=>explorePOI(pid)});
    return h;
  }});
};
window.explorePOI=function(pid){
  const p=MAP_POIS.find(x=>x.id===pid);if(!p)return;
  if(C.actionsLeft<2){toast("Butuh 2 aksi untuk ekspedisi.");return;}
  C.actionsLeft-=2;
  if(!C._poiYr)C._poiYr={};
  C._poiYr[pid]=C.age;
  ensureTraits();
  const roll=Math.random();
  if(roll<0.3){ // harta
    let g=ri(20,60);
    if(hasTrait("greedy")){g=Math.round(g*1.5);}
    C.coin+=g;
    finishAct(`${p.ico} ${hasTrait("greedy")?"Nalurimu mencium emas — ":""}Kau menemukan ${g} keping tersembunyi di ${p.name}!`,"e-epic","coin",`+${g}💰`);
  }else if(roll<0.5){ // pengetahuan/rune
    if(hasTrait("scholar")){applyStats({mind:+8,mana:+3});
      finishAct(`${p.ico} Sebagai kutu buku, kau membaca rune kuno dengan mudah — rahasianya terbuka!`,"e-arcane","win");}
    else{applyStats({mind:+4});
      finishAct(`${p.ico} Kau menyalin ukiran aneh untuk dipelajari. Akal bertambah.`,"e-good","win");}
  }else if(roll<0.68){ // barang
    addItem(rand(["health_potion","ancient_scroll","lucky_coin"]));
    finishAct(`${p.ico} Di antara puing kau menemukan barang berharga (masuk Tas 🎒)!`,"e-epic","win");
  }else if(roll<0.88){ // PENUNGGU — duel!
    if(window.MantaraArena&&MantaraArena.startTacticalDuel){
      const guard={name:"Penunggu "+p.name,ico:"👻",hp:60+C.age,atk:14+ri(0,8),mag:12,special:"Jerit Kelam"};
      MantaraArena.startTacticalDuel(guard,{
        title:"Ekspedisi "+p.name,allowFlee:true,
        intro:`${p.ico} Bayangan bangkit dari kegelapan... Penunggu tempat ini tak suka tamu!`,
        onEnd:function(res){
          if(res&&res.win){const g=ri(40,90);C.coin+=g;applyStats({might:+3,happy:+5});
            finishAct(`${p.ico} Penunggu ditaklukkan! Hartanya jadi milikmu (+${g}).`,"e-epic","win");}
          else if(res&&!res.quit){applyStats({health:-ri(10,20)});
            finishAct(`${p.ico} Kau lari terbirit-birit dari penunggu itu...`,"e-bad");}
        }});
    }else{applyStats({health:-ri(5,15)});finishAct(`${p.ico} Sesuatu menyerangmu dari kegelapan!`,"e-bad");}
  }else{ // nihil / berani dapat bonus kecil
    if(hasTrait("brave")){applyStats({might:+3,happy:+3});
      finishAct(`${p.ico} Tempat itu sunyi — tapi menjelajah sendirian menempa nyalimu.`,"e-good","win");}
    else finishAct(`${p.ico} Kau hanya menemukan debu & gema langkahmu sendiri.`,"");
  }
  mpCloseAll();
};

(function jewelrySystem(){

    {key:"ring_silver",ico:"💍",name:"Cincin Perak",price:120,desc:"Sederhana namun tulus — untuk melamar (+5 peluang)."},

    {key:"necklace",ico:"📿",name:"Kalung Permata",price:250,desc:"Hadiah mewah untuk siapa pun — ikatan melonjak."},
  ];
  RINGS.forEach(rg=>{
    if(ITEM_CATALOG.find(i=>i.key===rg.key))return;
    ITEM_CATALOG.push({key:rg.key,ico:rg.ico,name:rg.name,price:rg.price,reusable:true,noBuy:true,
      desc:rg.desc,use:()=>rg.key==="necklace"
        ?"Hadiahkan lewat tombol Kelola → Hadiah, atau aksi relasi."
        :"Simpan baik-baik — gunakan lewat aksi 💍 Lamar pada pasanganmu (Diri → Relasi)."});
  });
  // gabungkan koleksi CINCIN LAMARAN ke toko Tukang Permata yang sudah ada
  const jw=STORES.find(s=>s.id==="jeweler");
  if(jw){
    const _jb=jw.build;
    jw.desc="Perhiasan penanda status & cincin lamaran 💍.";
    jw.build=()=>_jb().concat(RINGS.map(rg=>{
      const ownedN=(C.inventory&&C.inventory[rg.key])||0;

          if(C.coin<rg.price){toast("Koin kurang.");return;}
          if(!spendAction())return;
          C.coin-=rg.price;addItem(rg.key);
          finishAct(`${rg.ico} Kau membeli ${rg.name}. Tersimpan di Tas 🎒 — siap untuk momen besar.`,"e-good");
        }};
    }));
  }
})();

window.runeMemoryGame=function(opts,cb){
  opts=opts||{};
  const RUNES=["🔥","💧","🌪️","🌑"];
  const len=Math.max(3,Math.min(9,opts.length||4));
  const seq=Array.from({length:len},()=>ri(0,3));
  let ov=document.getElementById("rnOv");
  if(!ov){ov=document.createElement("div");ov.id="rnOv";ov.className="ss-ov";document.body.appendChild(ov);}
  let idx=0,phase="show",done=false;
  ov.innerHTML=`<div class="ss-panel">
    <div style="font-size:30px;margin-bottom:4px">📿</div>
    <div class="ss-title">${opts.title||"Hafalan Rune"}</div>
    <div class="ss-desc">${opts.desc||`Hafalkan urutan <b>${len} rune</b> yang menyala, lalu ulangi!`}</div>
    <div class="rn-grid">${RUNES.map((r,i)=>`<button class="rn-btn" id="rnB${i}">${r}</button>`).join("")}</div>
    <div class="rn-status" id="rnStatus">Perhatikan baik-baik...</div>
  </div>`;
  ov.classList.add("show");
  const btn=i=>document.getElementById("rnB"+i);
  const status=t=>{const s=document.getElementById("rnStatus");if(s)s.textContent=t;};
  function finish(ok){
    if(done)return;done=true;
    status(ok?"✨ SEMPURNA — rune tunduk padamu!":"💨 Urutan buyar dari ingatanmu...");
    setTimeout(()=>{ov.classList.remove("show");try{cb&&cb(ok);}catch(e){}},900);
  }
  seq.forEach((r,i)=>{
    setTimeout(()=>{const b=btn(r);if(b){b.classList.add("lit");setTimeout(()=>b.classList.remove("lit"),420);}},700+i*640);
  });
  setTimeout(()=>{
    phase="input";status(`Giliranmu — ulangi ${len} rune!`);
    RUNES.forEach((r,i)=>{
      btn(i).onclick=()=>{
        if(phase!=="input"||done)return;
        if(i===seq[idx]){
          btn(i).classList.add("good");setTimeout(()=>btn(i).classList.remove("good"),260);
          idx++;status(`${idx}/${len} benar...`);
          if(idx>=len)finish(true);
        }else{
          btn(i).classList.add("bad");
          finish(false);
        }
      };
    });
  },700+len*640+250);
};
/* ---------- MINIGAME: REFLEKS TANGKIS (reaction) ---------- */
window.parryGame=function(opts,cb){
  opts=opts||{};
  const rounds=opts.rounds||3;
  let ov=document.getElementById("pyOv");
  if(!ov){ov=document.createElement("div");ov.id="pyOv";ov.className="ss-ov";document.body.appendChild(ov);}
  let round=0,score=0,goAt=0,state="idle",timer=null,done=false;
  ov.innerHTML=`<div class="ss-panel">
    <div style="font-size:30px;margin-bottom:4px">🛡️</div>
    <div class="ss-title">${opts.title||"Refleks Tangkis"}</div>
    <div class="ss-desc">Tunggu aba-aba <b>TANGKIS!</b> lalu ketuk secepat kilat. Ketuk terlalu dini = kena tebas. ${rounds} serangan!</div>
    <div class="parry-zone" id="pyZone"><span id="pyMain">Bersiap...</span><span class="pz-sub" id="pySub">jangan ketuk dulu</span></div>
    <div class="rn-status" id="pyStatus"></div>
  </div>`;
  ov.classList.add("show");
  const zone=document.getElementById("pyZone");
  const main=t=>{const e=document.getElementById("pyMain");if(e)e.textContent=t;};
  const sub=t=>{const e=document.getElementById("pySub");if(e)e.textContent=t;};
  const stat=t=>{const e=document.getElementById("pyStatus");if(e)e.textContent=t;};
  function nextRound(){
    if(done)return;
    round++;state="wait";zone.classList.remove("go");
    main("Bersiap...");sub(`serangan ${round}/${rounds} — jangan ketuk dulu`);
    timer=setTimeout(()=>{
      if(done)return;
      state="go";goAt=performance.now();
      zone.classList.add("go");main("⚔️ TANGKIS!");sub("KETUK SEKARANG!");
      timer=setTimeout(()=>{if(state==="go"&&!done){state="idle";stat("💥 Terlambat! Seranganmu lolos.");after();}},900);
    },800+Math.random()*1900);
  }
  function after(){
    zone.classList.remove("go");
    if(round>=rounds){
      done=true;
      const ok=score>=Math.ceil(rounds*0.66);
      main(ok?"🛡️ LULUS!":"💀 Gagal...");sub(`${score}/${rounds} tangkisan berhasil`);
      setTimeout(()=>{ov.classList.remove("show");try{cb&&cb(ok,score);}catch(e){}},1000);
    }else setTimeout(nextRound,700);
  }
  zone.onclick=()=>{
    if(done)return;
    if(state==="wait"){clearTimeout(timer);state="idle";stat("😖 Terlalu dini — pedang lawan menyambar!");after();}
    else if(state==="go"){
      clearTimeout(timer);state="idle";
      const dt=performance.now()-goAt;
      if(dt<=380){score++;stat(`⚡ SEMPURNA! (${Math.round(dt)}ms)`);}
      else if(dt<=680){score++;stat(`👍 Tangkisan bagus (${Math.round(dt)}ms)`);}
      else stat(`💥 Terlalu lambat (${Math.round(dt)}ms)`);
      after();
    }
  };
  nextRound();
};

const ORDOS={
  mage:{ico:"🔮",name:"Lingkaran Arcane",place:"Menara Frostspire",
    ranks:["Inisiat","Adeptus","Magus","Magus Agung","Penyihir Bintang"],
    join:c=>c.isMage&&c.age>=16,joinHint:"khusus penyihir · usia 16+",
    perkDesc:"Mana & honorarium tiap tahun — makin tinggi tingkat, makin besar."},
  knight:{ico:"🛡️",name:"Ordo Kesatria Aurelia",place:"Colosseum Aurelia",
    ranks:["Squire","Kesatria","Kapten Kesatria","Paladin","Mahapatih Pedang"],
    join:c=>c.age>=16&&c.stats.might>=50,joinHint:"Kekuatan 50+ · usia 16+",
    perkDesc:"Kekuatan, Nyawa & upah patroli tiap tahun."},
};
function ensureOrdo(){if(!C.ordo)C.ordo={mage:-1,knight:-1};return C.ordo;}
window.openOrdoPage=function(type){
  const O=ORDOS[type];if(!O)return;
  ensureOrdo();
  pushPage({title:O.name,render:function(){
    const r=C.ordo[type];
    let h=pgNote(`${O.ico} ${O.name} — ${O.place}. ${O.perkDesc} Kenaikan tingkat lewat <b>ujian keterampilan</b>, bukan keberuntungan!`);
    h+=pgSec("Jenjang Tingkatan");
    O.ranks.forEach((nm,i)=>{
      h+=pgRow({ico:i<=r?"⭐":"☆",title:nm,sub:i<=r?(i===r?"tingkatmu saat ini":"telah dilalui"):`tingkat ${i+1}`,
        bar:i<=r?100:0,barCls:"f-happy",dim:i>r});
    });
    h+=pgSec("Aksi");
    if(r<0){
      const ok=O.join(C)&&C.coin>=80;
      h+=pgRow({ico:O.ico,title:"Bergabung dengan Ordo",sub:O.join(C)?`iuran perdana 💰80 · ${O.joinHint}`:"🔒 "+O.joinHint,right:"💰80",dim:!ok,
        on:pgDo(()=>{
          if(!O.join(C)||C.coin<80)return{t:"Syarat belum terpenuhi.",cls:"e-bad"};
          C.coin-=80;C.ordo[type]=0;
          if(typeof kAddNews==="function")kAddNews(`${O.ico} ${C.name} diterima sebagai ${O.ranks[0]} ${O.name}.`);
          return{t:`${O.ico} Selamat datang, ${O.ranks[0]}! Ujilah dirimu untuk naik tingkat.`,cls:"e-epic"};})});
    }else if(r<O.ranks.length-1){
      const fee=100*(r+1);
      h+=pgRow({ico:"⚡",title:`UJIAN KENAIKAN → ${O.ranks[r+1]}`,
        sub:`${type==="mage"?`hafalan ${3+r+1} rune`:"refleks tangkis"}${r+1>=3?" + duel penguji ⚔️":""} · 💰${fee} · 1 ⚡`,
        right:`💰${fee}`,dim:C.coin<fee,
        on:()=>startOrdoTrial(type)});
    }else{
      h+=pgRow({ico:"👑",title:"Puncak Ordo tercapai!",sub:`Kau adalah ${O.ranks[r]} — namamu dikenang sejarah.`});
    }
    return h;
  }});
};
window.startOrdoTrial=function(type){
  const O=ORDOS[type];ensureOrdo();
  const r=C.ordo[type];const next=r+1;
  const fee=100*next;
  if(C.coin<fee){toast(`Butuh ${fee} keping untuk ujian.`);return;}
  if(!spendAction())return;
  C.coin-=fee;
  mpCloseAll();
  function promote(){
    C.ordo[type]=next;C.reputation+=6+next*3;
    if(typeof kAddNews==="function")kAddNews(`${O.ico} ${C.name} naik tingkat menjadi ${O.ranks[next]} ${O.name}!`);
    finishAct(`${O.ico} LULUS UJIAN! Kau kini ${O.ranks[next]} — seluruh ordo memberi hormat.`,"e-epic","win");
  }
  function failed(msg){finishAct(msg||"Ujian gagal — berlatihlah & coba lagi.","e-bad");}
  function maybeDuel(){
    if(next<3)return promote();
    const foe=type==="mage"
      ?{name:"Magus Penguji",ico:"🧙‍♂️",hp:80+next*25,atk:12,mag:20+next*6,special:"Ledakan Arkana"}
      :{name:"Paladin Penguji",ico:"💂",hp:90+next*25,atk:18+next*4,mag:0,special:"Tebasan Sumpah"};
    (window.MantaraArena&&MantaraArena.startTacticalDuel)?MantaraArena.startTacticalDuel(foe,{
      title:`Ujian ${O.ranks[next]}`,allowFlee:false,
      intro:`${O.ico} Tahap akhir: kalahkan sang penguji di hadapan seluruh ordo!`,
      onEnd:function(res){
        if(res&&res.win)promote();
        else if(res&&!res.quit){applyStats({health:-ri(5,12)});failed("Sang penguji mengungguli. Buktikan lagi lain kali.");}
      }}):promote();
  }
  if(type==="mage"){
    runeMemoryGame({length:3+next,title:`Ujian ${O.ranks[next]}`,desc:`Ulangi urutan <b>${3+next} rune</b> tanpa cela — para Magus mengawasi.`},
      ok=>{ if(ok){applyStats({mana:+4,mind:+2});maybeDuel(); } else {applyStats({mana:-2});failed("Rune buyar dari ingatanmu di hadapan dewan...");} });
  }else{
    parryGame({rounds:3+Math.floor(next/2),title:`Ujian ${O.ranks[next]}`},
      (ok,score)=>{ if(ok){applyStats({might:+3,health:+2});maybeDuel(); } else failed(`Hanya ${score} tangkisan — pelatih menggeleng.`); });
  }
};
// perks ordo tiap tahun + badge di kartu karakter
(function ordoYearly(){
  const _oAY=advanceYear;
  advanceYear=function(){
    const r=_oAY.apply(this,arguments);
    try{
      if(!C||!C.alive)return r;
      ensureOrdo();
      if(C.ordo.mage>=0){const g=(C.ordo.mage+1)*8;C.coin+=g;applyStats({mana:+Math.ceil((C.ordo.mage+1)/2)});
        if(chance(0.25))log(C.age,`🔮 Honorarium ${ORDOS.mage.ranks[C.ordo.mage]} +${g} keping.`,"e-arcane");}
      if(C.ordo.knight>=0){const g=(C.ordo.knight+1)*8;C.coin+=g;applyStats({might:+1,health:+Math.ceil((C.ordo.knight+1)/3)});
        if(chance(0.25))log(C.age,`🛡️ Upah patroli ${ORDOS.knight.ranks[C.ordo.knight]} +${g} keping.`,"e-good");}
    }catch(e){}
    return r;
  };
  const _rhO=renderHidup;
  renderHidup=function(){
    _rhO.apply(this,arguments);
    try{
      ensureOrdo();
      const parts=[];
      if(C.ordo.mage>=0)parts.push(`🔮 ${ORDOS.mage.ranks[C.ordo.mage]}`);
      if(C.ordo.knight>=0)parts.push(`🛡️ ${ORDOS.knight.ranks[C.ordo.knight]}`);
      if(parts.length){
        const el=document.querySelector("#viewHidup .charcard .cinfo");
        if(el&&!el.querySelector(".ordo-chips"))
          el.insertAdjacentHTML("beforeend",`<div class="cage ordo-chips" style="color:var(--arcane-glow)">${parts.join(" · ")}</div>`);
      }
    }catch(e){}
  };
})();

    if(!SUBLOC_ACT_MIN_AGE.fr_tower)SUBLOC_ACT_MIN_AGE.fr_tower=[];

    SUBLOC_ACTS.fr_tower[0].hint="📿 minigame hafalan rune!";
    SUBLOC_ACTS.fr_tower[0].run=()=>{
      if(!C.isMage){toast("Hanya untuk penyihir.");return;}
      if(!spendAction())return;
      runeMemoryGame({length:4,title:"Latihan Sihir Tinggi",desc:"Rangkai mantra: ulangi 4 rune tanpa cela!"},ok=>{
        if(ok){applyStats({mana:+ri(7,12),mind:+3});finishAct("🔮 Mantramu mengalir sempurna — mana melonjak!","e-arcane","win");}
        else{applyStats({mana:+2});finishAct("🔮 Mantra buyar di tengah jalan. Sedikit kemajuan.","e-bad");}
      });
    };
  }
})();

/* ==================================================================
   MANTARA — MUSIK LATAR ADAPTIF 🎵
   4 track sesuai suasana: 🌙 santai, ⚔️ duel/brawl, 🏟️ lomba/minigame,
   👑 momen agung (lamaran, menikah, naik takhta). Kontrol via tombol 🎵.
   ================================================================== */
(function mantaraMusic(){
if(typeof Audio==="undefined")return; // lingkungan tanpa audio (tes)
const TRACKS={
  calm:{file:"assets/music/moonlit_keep.mp3",name:"Moonlit Keep",ico:"🌙",label:"Santai"},
  battle:{file:"assets/music/siege_of_blackwood.mp3",name:"Siege of Blackwood",ico:"⚔️",label:"Pertarungan"},
  event:{file:"assets/music/cathedral_of_ash.mp3",name:"Cathedral of Ash",ico:"🏟️",label:"Lomba & Minigame"},
  ceremony:{file:"assets/music/crown_of_ash_and_dawn.mp3",name:"Crown of Ash and Dawn",ico:"👑",label:"Momen Agung"},
};
const MKEY="mantara_music_v1";
function mLoad(){try{return Object.assign({on:1,vol:0.55,mode:"auto"},JSON.parse(localStorage.getItem(MKEY)||"{}"));}catch(e){return{on:1,vol:0.55,mode:"auto"};}}
function mSave(){try{localStorage.setItem(MKEY,JSON.stringify(MS));}catch(e){}}
const MS=mLoad();
let aud=null,cur=null,revertT=null,unlocked=false,fadeI=null;
function ensureAud(){
  if(aud)return;
  aud=new Audio();aud.loop=true;aud.volume=MS.on?MS.vol:0;
  aud.addEventListener("error",()=>{});
}
function fadeTo(v,ms){
  if(!aud)return;clearInterval(fadeI);
  const steps=10,dv=(v-aud.volume)/steps;let n=0;
  fadeI=setInterval(()=>{n++;try{aud.volume=Math.max(0,Math.min(1,aud.volume+dv));}catch(e){}if(n>=steps)clearInterval(fadeI);},(ms||600)/steps);
}
function srcOf(t){return (typeof resolveAsset==="function")?resolveAsset(t.file):t.file;}
function tryPlay(){if(aud&&MS.on)aud.play().catch(()=>{});}
// mood: dipanggil hook otomatis (hormati mode manual) / UI (force)
window.MusicMood=function(mood,opts){
  opts=opts||{};
  if(!MS.on)return;
  if(MS.mode!=="auto"&&!opts.force)return;
  const t=TRACKS[mood]||TRACKS.calm;
  ensureAud();
  clearTimeout(revertT);
  if(cur!==mood){
    cur=mood;
    aud.src=srcOf(t);
    aud.loop=true;
    aud.volume=0;
    tryPlay();fadeTo(MS.vol,700);
  }else tryPlay();
  if(opts.revert)revertT=setTimeout(()=>window.MusicMood(opts.revert),opts.after||45000);
  try{const b=document.getElementById("musicBtn");if(b)b.textContent=MS.on?t.ico:"🔇";}catch(e){}
};
window.musicNow=function(){return {state:MS,mood:cur,track:cur?TRACKS[cur]:null,paused:!aud||aud.paused};};
window.musicSetOn=function(on){
  MS.on=on?1:0;mSave();ensureAud();
  if(!MS.on){fadeTo(0,400);setTimeout(()=>{try{aud.pause();}catch(e){}},450);}
  else{if(!cur)cur=null,window.MusicMood("calm",{force:true});else{tryPlay();fadeTo(MS.vol,400);}}
  try{const b=document.getElementById("musicBtn");if(b)b.textContent=MS.on?(cur?TRACKS[cur].ico:"🎵"):"🔇";}catch(e){}
};
window.musicSetVol=function(v){MS.vol=v;mSave();if(aud&&MS.on)fadeTo(v,300);};
window.musicSetMode=function(m){MS.mode=m;mSave();};
// buka kunci autoplay pada sentuhan pertama
document.addEventListener("pointerdown",function once(){
  unlocked=true;
  if(MS.on&&typeof C!=="undefined"&&C&&C.alive)window.MusicMood(cur||"calm",{force:MS.mode!=="auto"});
  document.removeEventListener("pointerdown",once);
},{passive:true});
/* ---------- TOMBOL 🎵 & HALAMAN KONTROL ---------- */
function buildMusicBtn(){
  if(document.getElementById("musicBtn"))return;
  const tb=document.querySelector(".topbar");if(!tb)return;
  const b=document.createElement("button");
  b.id="musicBtn";b.className="tut-help";b.style.left="94px";
  b.textContent=MS.on?"🎵":"🔇";b.title="Musik";
  b.onclick=()=>openMusicPage();
  tb.appendChild(b);
}
window.openMusicPage=function(){
  if(typeof pushPage!=="function")return;
  pushPage({title:"Musik",render:function(){
    const now=cur?TRACKS[cur]:null;
    let h=pgSec("Sedang Diputar");
    h+=pgRow({ico:now?now.ico:"🎵",title:now?now.name:"(belum ada — ketuk track di bawah)",
      sub:now?`suasana: ${now.label} · ${(!aud||aud.paused)?"⏸ jeda":"▶ berbunyi"}`:"musik menyala otomatis mengikuti suasana",
      on:()=>{if(aud&&!aud.paused){aud.pause();}else{tryPlay();}mpRefresh();}});
    h+=pgRow({ico:MS.on?"🔊":"🔇",title:MS.on?"Musik: NYALA":"Musik: MATI",sub:"ketuk untuk "+(MS.on?"matikan":"nyalakan"),
      on:()=>{musicSetOn(!MS.on);mpRefresh();}});
    h+=pgSec("Mode");
    h+=pgRow({ico:"✨",title:"Otomatis ikuti suasana"+(MS.mode==="auto"?" ✓":""),
      sub:"santai → duel → lomba → momen agung, berganti sendiri",dim:MS.mode==="auto",
      on:()=>{musicSetMode("auto");window.MusicMood(cur||"calm",{force:true});mpRefresh();}});
    h+=pgSec("Pilih Track (mode manual)");
    Object.keys(TRACKS).forEach(k=>{
      const t=TRACKS[k];
      h+=pgRow({ico:t.ico,title:t.name+(cur===k?"  ♪":""),sub:t.label,
        on:()=>{musicSetMode("manual");musicSetOn(true);window.MusicMood(k,{force:true});mpRefresh();}});
    });
    h+=pgSec("Volume");
    [["🔈","Pelan",0.3],["🔉","Sedang",0.55],["🔊","Keras",0.85]].forEach(v=>{
      h+=pgRow({ico:v[0],title:v[1]+(Math.abs(MS.vol-v[2])<0.01?" ✓":""),on:()=>{musicSetVol(v[2]);mpRefresh();}});
    });
    return h;
  }});
};
/* ---------- HOOK SUASANA ---------- */
// mulai hidup / lanjut save -> santai
if(typeof confirmCustomize==="function"){const _mc=confirmCustomize;confirmCustomize=function(){const r=_mc.apply(this,arguments);try{window.MusicMood("calm");}catch(e){}return r;};}
if(typeof loadSlot==="function"){const _mls=loadSlot;loadSlot=function(){const r=_mls.apply(this,arguments);try{window.MusicMood("calm");}catch(e){}return r;};}
// momen agung: lamaran diterima, menikah, kelahiran
(function hookRomance(){
  if(typeof REL_ACTIONS==="undefined"||!REL_ACTIONS.pasangan)return;
  REL_ACTIONS.pasangan.forEach(a=>{
    const _run=a.run;
    a.run=function(r){
      const res=_run.apply(this,arguments);
      try{
        if(typeof res==="string"&&(res.includes("MENERIMA")||res.includes("menikah dengan")||res.includes("menambah anggota")))
          window.MusicMood("ceremony",{revert:"calm",after:60000});
      }catch(e){}
      return res;
    };
  });
})();
// duel, arena, minigame — dibungkus setelah semua modul termuat
function hookLate(){
  try{
    if(window.MantaraArena&&MantaraArena.startTacticalDuel){
      const _std=MantaraArena.startTacticalDuel;
      MantaraArena.startTacticalDuel=function(foe,opts){
        opts=opts||{};
        const _end=opts.onEnd;
        opts.onEnd=function(res){try{window.MusicMood("calm");}catch(e){}if(_end)return _end.apply(this,arguments);};
        try{window.MusicMood("battle");}catch(e){}
        return _std.call(this,foe,opts);
      };
    }
    if(typeof window.openArena==="function"){const _oa=window.openArena;window.openArena=function(){try{window.MusicMood("event");}catch(e){}return _oa.apply(this,arguments);};}
    if(typeof window.arenaClose==="function"){const _ac=window.arenaClose;window.arenaClose=function(){try{if(cur==="event")window.MusicMood("calm");}catch(e){}return _ac.apply(this,arguments);};}
    ["skillShotGame","runeMemoryGame","parryGame","startBroomRace","startUlarNaga"].forEach(fn=>{
      if(typeof window[fn]==="function"){
        const _f=window[fn];
        window[fn]=function(){try{window.MusicMood("event",{revert:"calm",after:40000});}catch(e){}return _f.apply(this,arguments);};
      }
    });
    if(typeof kAddNews==="function"){
      const _kn=kAddNews;
      window.kAddNews=kAddNews=function(t){try{if(String(t).includes("KUDETA BERHASIL")||String(t).includes("naik takhta"))window.MusicMood("ceremony",{revert:"calm",after:60000});}catch(e){}return _kn.apply(this,arguments);};
    }
  }catch(e){}
}
function bootMusic(){try{buildMusicBtn();}catch(e){}try{hookLate();}catch(e){}}
if(document.readyState!=="loading")setTimeout(bootMusic,500);
else document.addEventListener("DOMContentLoaded",function(){setTimeout(bootMusic,500);});
})();

// ---------- SPLASH SCREEN (tiap buka app; ketuk untuk lewati) ----------
(function mantaraSplash(){
  let reduce=false;
  try{reduce=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;}catch(e){}
  const sp=document.createElement("div");
  sp.className="splash";sp.id="mantaraSplash";
  const logo=(typeof MANTARA_ASSETS!=="undefined"&&MANTARA_ASSETS.logo)
    ?`<img src="${resolveAsset(MANTARA_ASSETS.logo)}" alt="">`:"🪄";
  const sparks=reduce?"":[["18%","30%","✦","0s"],["78%","24%","✧","0.6s"],["26%","68%","⟡","1.1s"],["72%","72%","✦","1.6s"]]
    .map(s=>`<span class="sp-spark" style="left:${s[0]};top:${s[1]};animation-delay:${s[3]}">${s[2]}</span>`).join("");
  sp.innerHTML=`${reduce?"":'<div class="sp-ring"></div><div class="sp-ring r2"></div>'}${sparks}
    <div class="sp-logo">${logo}</div>
    <div class="sp-title">MANTARA</div>
    <div class="sp-sub">Hikayat Dunia Sihir</div>
    <div class="sp-tap">ketuk untuk lewati</div>`;
  document.body.appendChild(sp);
  let gone=false;
  function dismiss(){
    if(gone)return;gone=true;
    sp.classList.add("out");
    setTimeout(()=>{try{sp.remove();}catch(e){}},550);
