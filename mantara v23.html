<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Mantara — Hikayat Dunia Sihir</title>
<!-- PWA / iOS standalone -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mantara">
<meta name="theme-color" content="#171019">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="Mantara — simulasi kehidupan fantasi dunia sihir. Jalani hidup dari lahir hingga mewariskan takdir ke keturunanmu.">
<!-- apple-touch-icon akan ditambahkan saat packaging (file ikon disiapkan di Xcode) -->
<style>
  :root{
    --parchment:#e8dcc0; --ink-soft:#5a4a38;
    --blood:#8b2635; --gold:#b8860b; --gold-bright:#f0c040;
    --royal:#4a3c6e; --arcane:#5b6ee1; --arcane-glow:#8b9cff;
    --moss:#6a8a3a; --bg0:#16110c; --bg1:#241a12; --card:#2e2218;
    --line:rgba(184,134,11,.25); --line2:rgba(139,156,255,.25);
    --good:#a8d49a; --bad:#e09a9a;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    background:
      radial-gradient(ellipse 130% 60% at 50% -5%, #2e2440 0%, transparent 50%),
      radial-gradient(ellipse 100% 45% at 50% 105%, #1a1208 0%, transparent 50%),
      var(--bg0);
    color:var(--parchment);
    font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    height:100vh;display:flex;justify-content:center;overflow:hidden;
  }
  .phone{
    width:100%;max-width:430px;height:100vh;
    display:flex;flex-direction:column;position:relative;z-index:1;
  }
  .ambient{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
  .ember{position:absolute;bottom:-20px;animation:drift linear infinite;}
  @keyframes drift{to{transform:translateY(-105vh) rotate(40deg);opacity:0;}}

  /* ---------- HEADER ---------- */
  .topbar{padding:calc(12px + env(safe-area-inset-top)) 16px 8px;text-align:center;flex-shrink:0;}
  .game-title{font-size:17px;letter-spacing:.18em;font-weight:700;color:var(--gold);}
  .logo-mark{display:inline-block;filter:drop-shadow(0 0 6px rgba(240,192,64,.5));margin-right:2px;}
  .game-sub{font-size:8.5px;letter-spacing:.2em;text-transform:uppercase;
    color:var(--ink-soft);filter:brightness(1.6);margin-top:2px;}

  /* ---------- SCROLL AREA ---------- */
  .view{flex:1;overflow-y:auto;padding:4px 14px 14px;-webkit-overflow-scrolling:touch;}
  .view::-webkit-scrollbar{width:0;}

  /* ---------- CHAR CARD (compact, always on Hidup tab) ---------- */
  .charcard{background:linear-gradient(155deg,var(--card),var(--bg1));
    border:1px solid var(--line);border-radius:15px;padding:12px;position:relative;overflow:hidden;}
  .charcard::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;
    background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.6;}
  .chartop{display:flex;align-items:center;gap:11px;}
  .portrait{width:54px;height:54px;border-radius:13px;flex-shrink:0;display:flex;
    align-items:center;justify-content:center;font-size:30px;
    background:radial-gradient(circle at 35% 30%,#3a2c1e,#1c140d);border:1px solid var(--line);}
  .portrait.mage{box-shadow:0 0 16px rgba(91,110,225,.4);border-color:var(--arcane);}
  .cinfo{flex:1;min-width:0;}
  .cname{font-size:15px;font-weight:700;}
  .ctitle{font-size:10.5px;color:var(--gold);filter:brightness(1.3);font-style:italic;margin-top:1px;}
  .cage{font-size:10px;color:var(--ink-soft);filter:brightness(1.7);margin-top:3px;}
  .coin{font-size:11px;color:var(--gold-bright);font-weight:700;margin-top:3px;}

  .stats{display:grid;grid-template-columns:1fr 1fr;gap:7px 12px;margin-top:12px;}
  .statrow{display:flex;justify-content:space-between;font-size:9.5px;margin-bottom:2px;}
  .statname{color:var(--ink-soft);filter:brightness(1.7);text-transform:uppercase;letter-spacing:.03em;}
  .statval{font-variant-numeric:tabular-nums;font-weight:700;}
  .bar{height:6px;border-radius:4px;background:rgba(0,0,0,.35);overflow:hidden;}
  .fill{height:100%;border-radius:4px;transition:width .5s cubic-bezier(.4,0,.2,1);}
  .f-health{background:linear-gradient(90deg,#7a1f2b,#c0392b);}
  .f-happy{background:linear-gradient(90deg,#b8860b,#f0c040);}
  .f-might{background:linear-gradient(90deg,#5a3a1a,#a0622d);}
  .f-mind{background:linear-gradient(90deg,#3a4a7a,#6e8fd0);}
  .f-mana{background:linear-gradient(90deg,#3a2c6e,#8b9cff);}
  .f-charm{background:linear-gradient(90deg,#6e2a4a,#d06ea0);}

  /* ---------- LOG ---------- */
  .logbox{background:rgba(12,8,4,.5);border:1px solid var(--line);border-radius:13px;
    padding:11px 13px;margin-top:11px;display:flex;flex-direction:column-reverse;
    max-height:34vh;overflow-y:auto;}
  .entry{font-size:13px;line-height:1.55;padding:5px 0;
    border-bottom:1px solid rgba(184,134,11,.08);animation:fadein .35s;}
  .entry:first-child{border-bottom:none;}
  @keyframes fadein{from{opacity:0;transform:translateY(4px);}to{opacity:1;}}
  .yr{color:var(--gold);filter:brightness(1.2);font-weight:700;font-size:10px;margin-right:6px;}
  .e-good{color:var(--good);} .e-bad{color:var(--bad);}
  .e-arcane{color:var(--arcane-glow);}
  .e-epic{color:var(--gold);filter:brightness(1.3);font-weight:600;}
  .e-death{color:var(--blood);filter:brightness(1.5);font-weight:700;}

  /* ---------- SECTION HEADINGS ---------- */
  .sechead{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);
    filter:brightness(1.1);margin:16px 4px 9px;display:flex;align-items:center;gap:8px;}
  .sechead::after{content:"";flex:1;height:1px;background:var(--line);}
  .sechead:first-child{margin-top:6px;}

  /* ---------- TILES (activities/map/etc) ---------- */
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
  .tile{background:linear-gradient(155deg,var(--card),var(--bg1));border:1px solid var(--line);
    border-radius:13px;padding:12px;cursor:pointer;color:var(--parchment);font-family:inherit;
    text-align:left;transition:transform .1s,border-color .15s,box-shadow .15s;position:relative;}
  .tile:active{transform:scale(.97);}
  .tile:hover{border-color:var(--gold);}
  .tile .ti{font-size:24px;display:block;margin-bottom:6px;}
  .tile .tn{font-size:13px;font-weight:600;}
  .tile .td{font-size:9.5px;color:var(--ink-soft);filter:brightness(1.7);margin-top:3px;line-height:1.35;}
  .tile.locked{opacity:.45;}
  .tile.arcane{border-color:var(--line2);}
  .tile.arcane:hover{border-color:var(--arcane);}
  .tile .badge{position:absolute;top:8px;right:8px;font-size:8px;padding:2px 6px;border-radius:10px;
    background:rgba(184,134,11,.2);color:var(--gold-bright);font-weight:700;letter-spacing:.04em;}

  .fullrow{grid-column:1/-1;}

  /* ---------- RELATIONS ---------- */
  .relcard{background:linear-gradient(155deg,var(--card),var(--bg1));border:1px solid var(--line);
    border-radius:13px;padding:11px;margin-bottom:9px;}
  .reltop{display:flex;align-items:center;gap:10px;}
  .relav{width:42px;height:42px;border-radius:11px;flex-shrink:0;display:flex;align-items:center;
    justify-content:center;font-size:22px;background:radial-gradient(circle at 35% 30%,#3a2c1e,#1c140d);}
  .relinfo{flex:1;min-width:0;}
  .relname{font-size:13.5px;font-weight:600;}
  .relrole{font-size:10px;font-style:italic;margin-top:1px;}
  .role-pasangan{color:#d06ea0;} .role-bestie{color:var(--gold-bright);}
  .role-teman{color:var(--good);} .role-musuh{color:var(--bad);}
  .role-pengikut{color:var(--arcane-glow);} .role-keluarga{color:#c0a060;}
  .relbar{height:5px;border-radius:3px;background:rgba(0,0,0,.35);overflow:hidden;margin-top:6px;}
  .relfill{height:100%;border-radius:3px;transition:width .4s;}
  .relmeta{display:flex;justify-content:space-between;font-size:9px;color:var(--ink-soft);
    filter:brightness(1.7);margin-top:4px;}
  .relacts{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px;}
  .ra{font-size:10.5px;padding:6px 10px;border-radius:9px;background:rgba(255,255,255,.05);
    border:1px solid var(--line);color:var(--parchment);cursor:pointer;font-family:inherit;
    transition:transform .1s,background .15s;}
  .ra:active{transform:scale(.95);}
  .ra:hover{background:rgba(184,134,11,.12);}
  .ra.danger{border-color:rgba(139,38,53,.4);color:var(--bad);}
  .ra.love{border-color:rgba(208,110,160,.4);}

  /* ---------- ASSET ---------- */
  .asset{background:linear-gradient(155deg,var(--card),var(--bg1));border:1px solid var(--line);
    border-radius:13px;padding:12px;margin-bottom:9px;display:flex;align-items:center;gap:12px;}
  .assetico{font-size:30px;display:inline-flex;align-items:center;justify-content:center;min-width:34px;}
  .assetico img,.assetico .m-ico{width:30px;height:30px;}
  .assetinfo{flex:1;min-width:0;}
  .assetname{font-size:13.5px;font-weight:600;}
  .assetlvl{font-size:10px;color:var(--gold);filter:brightness(1.2);margin-top:2px;}
  .assetdesc{font-size:9.5px;color:var(--ink-soft);filter:brightness(1.7);margin-top:3px;}
  .upbtn{padding:9px 13px;border-radius:11px;border:none;background:linear-gradient(135deg,var(--gold),#9a6f08);
    color:#1a1208;font-family:inherit;font-size:11px;font-weight:700;cursor:pointer;flex-shrink:0;
    transition:transform .1s;white-space:nowrap;}
  .upbtn:active{transform:scale(.95);}
  .upbtn:disabled{opacity:.4;background:rgba(255,255,255,.1);color:var(--ink-soft);}

  /* ---------- MISSIONS ---------- */
  .mission{background:rgba(91,110,225,.06);border:1px solid var(--line2);border-radius:12px;
    padding:11px 13px;margin-bottom:9px;}
  .mtitle{font-size:13px;font-weight:600;color:var(--arcane-glow);}
  .mdesc{font-size:10.5px;color:var(--ink-soft);filter:brightness(1.7);margin-top:4px;line-height:1.4;}
  .mprog{font-size:10px;color:var(--gold);margin-top:6px;}
  .mreward{font-size:9.5px;color:var(--good);margin-top:3px;}

  /* ---------- DECISION MODAL ---------- */
  .modal{position:fixed;inset:0;background:rgba(8,5,2,.82);z-index:50;display:none;
    align-items:center;justify-content:center;padding:24px;backdrop-filter:blur(3px);}
  .modal.show{display:flex;}
  .modalbox{background:linear-gradient(155deg,#322a44,#1e1828);border:1px solid var(--line2);
    border-radius:18px;padding:18px;max-width:380px;width:100%;animation:rise .3s;}
  @keyframes rise{from{opacity:0;transform:translateY(14px);}to{opacity:1;}}
  .mico{font-size:28px;text-align:center;display:block;margin-bottom:10px;}
  .mprompt{font-size:14.5px;line-height:1.55;margin-bottom:15px;text-align:center;}
  .mchoices{display:flex;flex-direction:column;gap:8px;}
  .mchoice{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:11px;
    padding:12px 13px;text-align:left;cursor:pointer;color:var(--parchment);font-family:inherit;
    font-size:13px;transition:transform .1s,background .15s,border-color .15s;}
  .mchoice:active{transform:scale(.98);}
  .mchoice:hover{background:rgba(139,156,255,.1);border-color:var(--arcane);}
  .mchoice .hint{display:block;font-size:9.5px;color:var(--ink-soft);filter:brightness(1.7);
    margin-top:3px;font-style:italic;}
  .mchoice .mc-label{font-size:13.5px;font-weight:600;display:block;}
  .mchoice .mc-sub{display:block;font-size:10.5px;color:var(--gold);filter:brightness(1.2);margin-top:2px;}
  .mchoice.love{border-color:rgba(208,110,160,.4);}
  .mchoice.danger{border-color:rgba(139,38,53,.45);}
  .mchoice.danger .mc-label{color:var(--bad);}
  .mc-cancel{text-align:center;color:var(--ink-soft);filter:brightness(1.6);font-size:12px;}
  .mchoices{max-height:60vh;overflow-y:auto;}

  /* ---------- TOAST ---------- */
  .toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);
    background:linear-gradient(135deg,#322a44,#1e1828);border:1px solid var(--line);
    border-radius:12px;padding:11px 16px;font-size:12.5px;max-width:90%;text-align:center;
    z-index:60;opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;line-height:1.4;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* ---------- AGE BUTTON (floats above tabbar on Hidup) ---------- */
  .agewrap{padding:10px 14px;flex-shrink:0;}
  .btn-age{width:100%;padding:15px;border-radius:14px;border:none;cursor:pointer;
    font-family:inherit;font-size:15px;font-weight:700;letter-spacing:.04em;
    background:linear-gradient(135deg,var(--gold),#9a6f08);color:#1a1208;
    transition:transform .1s;box-shadow:0 4px 16px rgba(184,134,11,.25);}
  .btn-age:active{transform:scale(.98);}
  .btn-age:disabled{opacity:.4;}

  /* ---------- TABBAR ---------- */
  .tabbar{display:flex;flex-shrink:0;border-top:1px solid var(--line);
    background:rgba(12,8,4,.7);backdrop-filter:blur(8px);
    padding-bottom:env(safe-area-inset-bottom);}
  .tab{flex:1;padding:9px 0 10px;background:none;border:none;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink-soft);
    filter:brightness(1.5);font-family:inherit;transition:color .15s,filter .15s;position:relative;}
  .tab.active{color:var(--gold);filter:brightness(1.2);}
  .tab .tabi{font-size:19px;}
  .tab .tabt{font-size:9px;letter-spacing:.04em;}
  /* ---------- 3-TAB: ikon lebih besar ---------- */
  .tab3{padding:11px 0 12px;gap:5px;}
  .tab3 .tabi{font-size:28px;line-height:1;}
  .tab3 .tabt{font-size:11px;letter-spacing:.05em;}
  /* ---------- SUB-TAB PILL (bar permanen di atas konten) ---------- */
  #globalSubbar{flex-shrink:0;padding:10px 16px 4px;}
  .subbar{display:flex;gap:7px;flex-wrap:wrap;}
  .subpill{flex:1;min-width:74px;padding:8px 10px;border-radius:10px;cursor:pointer;
    background:rgba(184,134,11,.07);border:1px solid rgba(184,134,11,.22);
    color:var(--ink-soft);filter:brightness(1.4);font-family:inherit;font-size:12.5px;font-weight:600;
    letter-spacing:.02em;display:flex;align-items:center;justify-content:center;gap:6px;position:relative;
    transition:background .15s,color .15s,border-color .15s;}
  .subpill.active{background:rgba(184,134,11,.18);border-color:var(--gold);color:var(--gold);filter:brightness(1.1);}
  .subpill-ico{display:inline-flex;align-items:center;font-size:15px;}
  .subpill .dot{position:absolute;top:5px;right:7px;width:7px;height:7px;border-radius:50%;}
  .tab .dot{position:absolute;top:6px;right:calc(50% - 18px);width:7px;height:7px;border-radius:50%;
    background:var(--blood);filter:brightness(1.4);display:none;}
  .tab .dot.on{display:block;}

  /* ---------- NET WORTH STRIP ---------- */
  .networth{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px;margin-top:11px;
    padding-top:11px;border-top:1px solid var(--line);}
  .nw-item{display:flex;flex-direction:column;align-items:center;gap:2px;}
  .nw-lbl{font-size:8px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);filter:brightness(1.6);}
  .nw-val{font-size:12px;font-weight:700;color:var(--gold-bright);font-variant-numeric:tabular-nums;}

  /* ---------- CUSTOMIZE SCREEN ---------- */
  .cust-wrap{padding:2px 2px 12px;}
  .cust-avatar{display:flex;justify-content:center;margin:6px 0 14px;}
  .cust-face{width:96px;height:96px;border-radius:24px;display:flex;align-items:center;
    justify-content:center;font-size:54px;background:radial-gradient(circle at 35% 30%,#3a2c1e,#150f09);
    border:1px solid var(--line);box-shadow:0 6px 24px rgba(0,0,0,.4);}
  .cust-field{margin-bottom:15px;}
  .cust-field>label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;
    color:var(--gold);filter:brightness(1.1);margin-bottom:7px;}
  .name-row{display:flex;gap:8px;}
  .nameinput{flex:1;padding:11px 13px;border-radius:11px;background:var(--card);
    border:1px solid var(--line);color:var(--parchment);font-family:inherit;font-size:14px;}
  .mini-btn{padding:0 14px;border-radius:11px;background:rgba(255,255,255,.06);
    border:1px solid var(--line);color:var(--parchment);font-size:16px;cursor:pointer;}
  .seg{display:flex;gap:8px;}
  .seg-btn{flex:1;padding:11px;border-radius:11px;background:var(--card);border:1px solid var(--line);
    color:var(--parchment);font-family:inherit;font-size:13px;cursor:pointer;transition:border-color .15s,background .15s;}
  .seg-btn.sel{border-color:var(--gold);background:rgba(184,134,11,.15);color:var(--gold-bright);font-weight:700;}
  .opt-row{display:flex;gap:8px;flex-wrap:wrap;}
  .optbtn{width:48px;height:48px;border-radius:12px;background:var(--card);border:1px solid var(--line);
    font-size:24px;cursor:pointer;transition:border-color .15s,transform .1s;}
  .optbtn.sel{border-color:var(--gold);box-shadow:0 0 10px rgba(184,134,11,.3);transform:scale(1.06);}
  .skill-alloc{display:flex;flex-direction:column;gap:11px;}
  .skillrow{}
  .skillrow .sk-name{font-size:12px;color:var(--parchment);}
  .sk-ctrl{display:flex;align-items:center;gap:12px;float:right;}
  .sk-btn{width:28px;height:28px;border-radius:8px;background:rgba(255,255,255,.06);
    border:1px solid var(--line);color:var(--gold-bright);font-size:16px;font-weight:700;cursor:pointer;
    display:flex;align-items:center;justify-content:center;}
  .sk-btn:active{transform:scale(.9);}
  .sk-val{font-size:14px;font-weight:700;min-width:26px;text-align:center;font-variant-numeric:tabular-nums;}

  /* ---------- CITY PICKER (kustomisasi) ---------- */
  .city-pick{display:flex;flex-direction:column;gap:9px;}
  .city-card{background:var(--card);border:1px solid var(--line);border-radius:13px;
    padding:12px;text-align:left;cursor:pointer;color:var(--parchment);font-family:inherit;
    transition:border-color .15s,transform .1s;}
  .city-card:active{transform:scale(.98);}
  .city-card.sel{border-color:var(--gold);box-shadow:0 0 12px rgba(184,134,11,.25);}
  .cc-top{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
  .cc-ico{font-size:22px;}
  .cc-name{font-size:14px;font-weight:700;}
  .cc-tag{font-size:9.5px;color:var(--ink-soft);filter:brightness(1.7);margin-left:auto;font-style:italic;}
  .cc-pros{font-size:10px;color:var(--good);line-height:1.4;}
  .cc-cons{font-size:10px;color:var(--bad);line-height:1.4;margin-top:2px;}

  /* ---------- CITY TILES (peta) ---------- */
  .city-tile.here{border-color:var(--gold);box-shadow:0 0 12px rgba(184,134,11,.2);}
  .tile.here{border-color:var(--gold);}
  .badge.dist{background:rgba(91,110,225,.2);color:var(--arcane-glow);}

  /* ---------- ANIMASI PENDEK ---------- */
  .anim-layer{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;
    pointer-events:none;}
  .anim-layer.show{display:flex;}
  .anim-box{background:rgba(8,5,2,.55);backdrop-filter:blur(2px);border-radius:24px;
    padding:34px 44px;animation:animPop .3s;}
  @keyframes animPop{from{transform:scale(.6);opacity:0;}to{transform:scale(1);opacity:1;}}
  .anim-clash{font-size:50px;display:flex;align-items:center;gap:4px;}
  .anim-clash .ac-l{display:inline-block;animation:clashL .5s ease-in-out infinite alternate;}
  .anim-clash .ac-r{display:inline-block;animation:clashR .5s ease-in-out infinite alternate;}
  .anim-clash .ac-spark{font-size:34px;animation:sparkPulse .4s infinite;}
  @keyframes clashL{from{transform:translateX(-6px) rotate(-12deg);}to{transform:translateX(6px) rotate(8deg);}}
  @keyframes clashR{from{transform:translateX(6px) rotate(12deg) scaleX(-1);}to{transform:translateX(-6px) rotate(-8deg) scaleX(-1);}}
  @keyframes sparkPulse{0%,100%{transform:scale(.7);opacity:.6;}50%{transform:scale(1.3);opacity:1;}}
  .anim-race{font-size:54px;display:flex;align-items:center;}
  .anim-race .ar-run{display:inline-block;animation:gallop .35s ease-in-out infinite;}
  .anim-race .ar-dust{font-size:32px;animation:dustTrail .5s infinite;}
  @keyframes gallop{0%,100%{transform:translateY(0) rotate(-3deg);}50%{transform:translateY(-8px) rotate(3deg);}}
  @keyframes dustTrail{0%{opacity:.2;transform:translateX(0) scale(.8);}100%{opacity:.7;transform:translateX(-14px) scale(1.2);}}

<script>
// ============================================================
//  TAKDIR — PRODUCTION SILENCER + GLOBAL ERROR GUARD (paling awal)
// ============================================================
(function(){
  // simpan log asli, senyapkan log produksi (sisakan error utk diagnosa)
  try{window._origConsoleLog=console.log;console.log=function(){};}catch(e){}

  // GLOBAL ERROR GUARD: cegah satu error kecil membuat layar putih.
  // Simpan error ke buffer agar bisa diperiksa, tapi jangan crash UI.
  try{
    window._takdirErrors=[];
    // handler klasik (paling universal, termasuk Safari lama)
    window.onerror=function(msg,src,line,col,err){
      try{window._takdirErrors.push({msg:String(msg),src:src||"",line:line||0,col:col||0,
        stack:err&&err.stack?String(err.stack).slice(0,300):""});}catch(e){}
      return true; // cegah "Uncaught" muncul & cegah crash
    };
    window.addEventListener("error",function(ev){
      try{
        window._takdirErrors.push({
          msg:ev.message||"(no message)",
          src:ev.filename||"",
          line:ev.lineno||0,col:ev.colno||0,
          stack:ev.error&&ev.error.stack?String(ev.error.stack).slice(0,300):"",
        });
      }catch(e){}
      return true;
    },true);
    window.addEventListener("unhandledrejection",function(ev){
      try{window._takdirErrors.push({msg:"promise: "+(ev.reason&&ev.reason.message||ev.reason||"?")});}catch(e){}
      ev.preventDefault&&ev.preventDefault();
    });
  }catch(e){}
})();

// utilitas debug: ketik takdirDebug() di console untuk lihat error tertangkap
function takdirDebug(){
  try{
    const errs=window._takdirErrors||[];
    if(window._origConsoleLog){
      window._origConsoleLog("=== TAKDIR captured errors ("+errs.length+") ===");
      errs.forEach((e,i)=>window._origConsoleLog((i+1)+".",e.msg,e.src?("@ "+e.src+":"+e.line):"",e.stack||""));
    }
    return errs;
  }catch(e){return [];}
}

// Path ikon file: absolut dari root saat di-serve (npm start), relatif saat file://
(function normalizeAssetPaths(){
  const isFile=location.protocol==="file:";
  Object.keys(MANTARA_ASSETS).forEach(k=>{
    const v=MANTARA_ASSETS[k];
    if(typeof v!=="string"||v.startsWith("data:")||v.startsWith("http")||v.startsWith("/"))return;
    MANTARA_ASSETS[k]=isFile?v:("/"+v.replace(/^\.\//,""));
  });
})();
function resolveAsset(src){
  if(!src||src.startsWith("data:")||src.startsWith("http")||src.startsWith("/"))return src;
  return location.protocol==="file:"?src:("/"+src.replace(/^\.\//,""));
}

function imgIcon(name, fallbackEmoji, sizePx){
  const src=MANTARA_ASSETS[name];
  if(!src)return fallbackEmoji||"";
  const s=sizePx||"1em";
  return `<img src="${resolveAsset(src)}" class="m-ico" style="width:${s};height:${s};vertical-align:middle;object-fit:contain" alt="">`;
}
function setModalIco(el,ico){
  if(!el)return;
  if(ico&&String(ico).includes("<img"))el.innerHTML=ico;
  else el.textContent=ico||"❓";
}// ============================================================

function makeRel(role,opts={}){
  const female=opts.female!==undefined?opts.female:chance(0.5);
  return {
    id:"r"+Math.random().toString(36).slice(2,8),
    name:opts.name||randName(female), female, role,
    bond:opts.bond!==undefined?opts.bond:ri(35,55),
    ico:opts.ico||relIcon(role,female),
    loyalty:opts.loyalty||50, met:C?C.age:0,
    trait:opts.trait||rand(["periang","pendiam","ambisius","setia","licik","pemberani","bijak"]),
    isChild:opts.isChild||false,
  };
}
function relIcon(role,female){
  if(role==="pasangan")return female?"💃":"🤵";
  if(role==="musuh")return "😡";
  if(role==="pengikut")return "🧑‍🌾";
  if(role==="bestie")return female?"👯‍♀️":"🧑‍🤝‍🧑";
  if(role==="keluarga")return female?"👩":"👨";
  if(role==="rekan")return female?"👩‍💼":"👨‍💼";
  return female?"👩":"👨";
}
function addRel(role,opts={}){
  const r=makeRel(role,opts);C.relations.push(r);C.pendingDot=true;return r;
}

function updateTitle(){
  if(!C.alive){C.title="Mendiang";return;}
  if(C.career){const car=CAREERS.find(x=>x.id===C.career);if(car){C.title=car.ranks[C.careerLevel];return;}}
  const s=C.stats;
  if(C.isMage&&s.mana>=85)C.title="Archmage Agung";
  else if(s.might>=85&&C.reputation>=40)C.title="Ksatria Agung";
  else if(s.charm>=80&&C.reputation>=40)C.title=C.female?"Bangsawati":"Bangsawan";
  else if(C.businesses.length>=3)C.title="Taipan";
  else if(C.isMage&&C.age>=16)C.title="Penyihir";
  else if(C.age>=18)C.title=C.female?"Wanita Biasa":"Rakyat Jelata";
  else if(C.age>=13)C.title="Remaja";
  else C.title="Bocah";
}

function processBusinesses(){
  C.businesses.forEach(b=>{
    const def=BUSINESS_TYPES.find(x=>x.id===b.id);if(!def)return;
    let inc=def.income[b.level];
    // risk event
    if(chance(0.15)){inc=Math.round(inc*0.3);C._bizRisk=`${def.name} terkena masalah tahun ini (income turun).`;}
    C.coin+=inc;b._lastIncome=inc;
  });
}

function processCareer(){
  if(!C.career)return;
  const car=CAREERS.find(x=>x.id===C.career);if(!car)return;
  const pay=Math.round(car.basepay+C.careerLevel*car.basepay*0.6);
  C.coin+=pay;applyStats(car.statGain);C.careerYears++;
  if(C.careerYears>=3&&C.careerLevel<car.ranks.length-1&&chance(0.5)){
    C.careerLevel++;C.careerYears=0;
    log(C.age,`Kau dipromosikan jadi ${car.ranks[C.careerLevel]}!`,"e-epic");
  }
}

// ---------- RELASI ----------
function renderRelasi(){
  C.pendingDot=false;document.getElementById("dotRelasi").classList.remove("on");
  if(!C.relations.length){
    document.getElementById("viewRelasi").innerHTML=
      `<div class="sechead">Relasi</div><p style="font-size:13px;color:var(--ink-soft);filter:brightness(1.6);text-align:center;padding:30px 10px;line-height:1.6;">Belum ada relasi. Temui orang lewat aktivitas atau seiring waktu.</p>`;
    return;}
  const roleOrder={pasangan:0,bestie:1,teman:2,rekan:3,keluarga:4,pengikut:5,musuh:6};
  const sorted=[...C.relations].sort((a,b)=>(roleOrder[a.role]??9)-(roleOrder[b.role]??9));
  let html=`<div class="sechead">Relasi (${C.relations.length})</div>`;
  sorted.forEach(r=>{
    const meter=r.role==="pengikut"?r.loyalty:r.bond;
    const meterLabel=r.role==="pengikut"?"Loyalitas":"Ikatan";
    const barColor=r.role==="musuh"?"linear-gradient(90deg,#7a1f2b,#c0392b)":
      r.role==="pasangan"?"linear-gradient(90deg,#6e2a4a,#d06ea0)":"linear-gradient(90deg,#6e5a1a,#d4af37)";
    const acts=REL_ACTIONS[r.role]||[];
    html+=`<div class="relcard">
      <div class="reltop">
        <div class="relav">${r.ico}</div>
        <div class="relinfo">
          <div class="relname">${r.name}</div>
          <div class="relrole role-${r.role}">${r.role.charAt(0).toUpperCase()+r.role.slice(1)}${r.isChild?' (anak)':''} · ${r.trait}</div>
          <div class="relbar"><div class="relfill" style="width:${meter}%;background:${barColor}"></div></div>
          <div class="relmeta"><span>${meterLabel} ${Math.round(meter)}</span><span>kenal ${C.age-r.met}th</span></div>
        </div>
      </div>
      <div class="relacts">
        ${acts.map((act,i)=>`<button class="ra ${act.cls||''}" onclick="doRelAction('${r.id}',${i})">${act.label}</button>`).join("")}
      </div></div>`;});
  document.getElementById("viewRelasi").innerHTML=html;
}
function doRelAction(relId,actIdx){
  if(!spendAction()){renderHidup();return;}
  const r=C.relations.find(x=>x.id===relId);if(!r)return;
  const act=(REL_ACTIONS[r.role]||[])[actIdx];if(!act)return;
  const msg=act.run(r);log(C.age,msg,"e-good");toast(msg);
  if(C.stats.health<=0){die("Pilihanmu berakibat fatal.");return;}
  checkMissions();updateTitle();renderAll();
}

function buyBiz(id){
  const def=BUSINESS_TYPES.find(b=>b.id===id);if(C.coin<def.buy){toast("Koin tidak cukup.");return;}
  C.coin-=def.buy;C.businesses.push({id,level:0});
  log(C.age,`Kau membuka ${def.name}! Income +${def.income[0]}/tahun.`,"e-epic");toast(`${def.name} dibuka!`);
  checkMissions();updateTitle();renderAset();renderHidup();
}
function upgradeSkill(id){
  const def=SKILL_TYPES.find(t=>t.id===id);let owned=C.skills.find(s=>s.id===id);
  const lvl=owned?owned.level:0;if(lvl>=5)return;const cost=(lvl+1)*60;
  if(C.coin<cost){toast("Koin tidak cukup.");return;}
  C.coin-=cost;if(owned)owned.level++;else C.skills.push({id,level:1});
  toast(`${def.name} naik ke tingkat ${lvl+1}!`);renderAset();renderHidup();
}

  const car=CAREERS.find(x=>x.id===id);if(!car||!car.req(C)){toast("Syarat belum cukup.");return;}

  log(C.age,`Kau memulai karir sebagai ${car.ranks[0]} (${car.name}).`,"e-good");toast(`Karir: ${car.name}`);
  updateTitle();renderAktivitas();renderHidup();
}

}

// ---------- APPLY PERKS (dipanggil tiap tahun) ----------
function applyAssetPerksV4(){
  // properti multi-unit
  C.properties.forEach(p=>{
    const def=PROPERTY_CATALOG.find(x=>x.key===p.key);if(!def)return;
    if(def.happy)applyStats({happy:+def.happy});
    if(def.health)applyStats({health:+def.health});
    if(def.mana)applyStats({mana:+def.mana});
    if(def.reputation)C.reputation+=def.reputation;
    // sewa otomatis
    if(p.rented&&def.rentMode==="auto"&&def.rentAuto){C.coin+=def.rentAuto;p._income=def.rentAuto;}
  });
  // gear single
  for(const cat in C.gear){
    const v=GEAR_CATALOG[cat].variants.find(x=>x.key===C.gear[cat]);
    if(v&&v.perk)applyStats(v.perk);
  }
  // skill
  C.skills.forEach(sk=>{const def=SKILL_TYPES.find(t=>t.id===sk.id);if(def)applyStats({[def.stat]:+sk.level});});
}

// ---------- SEWA AKTIF: trader nego tiap tahun ----------
// dipanggil saat ageUp untuk tiap properti rentMode active yg di-set "disewakan"
function processActiveRentals(){
  const offers=[];
  C.properties.forEach(p=>{
    const def=PROPERTY_CATALOG.find(x=>x.key===p.key);
    if(p.rented&&def&&def.rentMode==="active"&&def.rentActive){
      const [lo,hi]=def.rentActive;
      const amt=ri(lo,hi);
      const trader=rand(["Trader Eldon","Saudagar Vex","Kafilah Mirae","Tuan Holloway","Nyonya Sable","Pedagang Quill"]);
      offers.push({propKey:p.key,propName:def.name,propIco:def.ico,trader,amt});
    }
  });
  return offers; // diproses lewat popup berantai di UI
}

  delete c.assets;          // ganti sistem lama
  return c;
};

// ---------- proses antrian tawaran sewa (popup berantai) ----------
function flushRentQueue(){
  if(!C._rentQueue||!C._rentQueue.length)return;
  const offer=C._rentQueue.shift();
  openChoice({
    ico:offer.propIco,
    prompt:`<b>${offer.trader}</b> ingin menyewa <b>${offer.propName}</b>-mu tahun ini, menawarkan <b>${offer.amt} keping</b>.`,
    cancel:false,
    choices:[
      {label:"Terima tawaran",sub:`+${offer.amt} keping`,cls:"love",run:()=>{C.coin+=offer.amt;return{t:`${offer.trader} menyewa ${offer.propName} (+${offer.amt} keping).`,cls:"e-good",_then:flushRentQueue};}},
      {label:"Tolak — tahan harga",sub:"berharap tawaran lebih baik",run:()=>{return{t:`Kau menolak tawaran ${offer.trader}. ${offer.propName} kosong tahun ini.`,cls:"",_then:flushRentQueue};}},

}

  html+=`<div class="sechead">Perlengkapan (1 slot tiap jenis)</div>`;
  for(const cat in GEAR_CATALOG){
    const g=GEAR_CATALOG[cat];if(g.arcane&&!C.isMage)continue;
    const cur=g.variants.find(v=>v.key===C.gear[cat]);
    const perkStr=Object.entries(cur.perk||{}).map(([k,v])=>`${STAT_META[k]?STAT_META[k].name:k} +${v}`).join(", ")||"—";
    html+=`<div class="asset"><span class="assetico">${g.ico}</span>
      <div class="assetinfo"><div class="assetname">${cur.name}</div>
        <div class="assetlvl">${g.name} · ${perkStr}/th</div>
        <div class="assetdesc">${cur.desc}</div></div>
      <button class="upbtn" onclick="chooseGearPopup('${cat}')">Ganti</button></div>`;
  }

  // BISNIS (tetap, tapi pakai popup utk kelola)
  html+=`<div class="sechead">Bisnis (Income Pasif)</div>`;
  BUSINESS_TYPES.forEach(def=>{
    const owned=C.businesses.find(b=>b.id===def.id);
    if(owned){
      const next=owned.level+1;const canUp=next<def.tiers.length;
      html+=`<div class="asset"><span class="assetico">${def.ico}</span>
        <div class="assetinfo"><div class="assetname">${def.tiers[owned.level]}</div>
          <div class="assetlvl">${def.name} · +${def.income[owned.level]}/th</div>
          <div class="assetdesc">${def.risk}</div></div>
        ${canUp?`<button class="upbtn" onclick="bizPopup('${def.id}')">Kelola</button>`:`<span style="font-size:10px;color:var(--gold)">MAX</span>`}
      </div>`;
    }else{
      const afford=C.coin>=def.buy;
      html+=`<div class="asset"><span class="assetico">${def.ico}</span>
        <div class="assetinfo"><div class="assetname">${def.name}</div>
          <div class="assetlvl">Income +${def.income[0]}/th</div>
          <div class="assetdesc">${def.risk}</div></div>
        <button class="upbtn" ${afford?`onclick="buyBiz('${def.id}')"`:'disabled'}>Beli<br>💰${def.buy}</button></div>`;
    }
  });

  // SKILL
  html+=`<div class="sechead">Keahlian</div>`;
  SKILL_TYPES.filter(t=>!t.arcane||C.isMage).forEach(def=>{
    const owned=C.skills.find(s=>s.id===def.id);const lvl=owned?owned.level:0;
    const canUp=lvl<5;const cost=(lvl+1)*60;const afford=C.coin>=cost;
    html+=`<div class="asset"><span class="assetico">${def.ico}</span>
      <div class="assetinfo"><div class="assetname">${def.name}</div>
        <div class="assetlvl">Tingkat ${lvl}/5</div>
        <div class="assetdesc">${STAT_META[def.stat].name} +${lvl}/tahun pasif</div></div>
      ${canUp?`<button class="upbtn" ${afford?`onclick="upgradeSkill('${def.id}')"`:'disabled'}>Latih<br>💰${cost}</button>`:`<span style="font-size:10px;color:var(--gold)">MAX</span>`}
    </div>`;});
  document.getElementById("viewAset").innerHTML=html;
}

// ---------- POPUP: beli properti (katalog varian) ----------
function buyPropertyPopup(){
  const cat=PROPERTY_CATALOG.filter(p=>!p.arcane||C.isMage);

// ---------- POPUP: kelola properti (sewakan / jual) ----------
function managePropertyPopup(idx){
  const p=C.properties[idx];const def=PROPERTY_CATALOG.find(x=>x.key===p.key);
  const choices=[];
  if(def.rentMode!=="none"){
    if(!p.rented)choices.push({label:"Sewakan properti",sub:def.rentMode==="auto"?`+${def.rentAuto}/th otomatis`:"trader akan nego tiap tahun",cls:"love",
      run:()=>{p.rented=true;return{t:`${def.name} kini disewakan.`,cls:"e-good"};}});
    else choices.push({label:"Hentikan sewa",sub:"properti jadi kosong",
      run:()=>{p.rented=false;return{t:`Kau menghentikan sewa ${def.name}.`,cls:""};}});
  }
  choices.push({label:"Jual properti",sub:`dapat ~${Math.round(def.price*0.6)} keping`,cls:"danger",
    run:()=>{const g=Math.round(def.price*0.6);C.coin+=g;C.properties.splice(idx,1);
      return{t:`Kau menjual ${def.name} seharga ${g} keping.`,cls:"e-bad"};}});
  openChoice({ico:def.ico,prompt:`Kelola <b>${def.name}</b>:`,choices});
}

// ---------- POPUP: pilih gear varian ----------
function chooseGearPopup(cat){
  const g=GEAR_CATALOG[cat];
  openChoice({ico:g.ico,prompt:`Pilih ${g.name}:`,
    choices:g.variants.map(v=>{
      const owned=C.gear[cat]===v.key;
      const afford=v.price===0||C.coin>=v.price||owned;
      const perks=Object.entries(v.perk||{}).map(([k,val])=>`${STAT_META[k]?STAT_META[k].name:k}+${val}`).join(" ")||"—";
      return {label:`${v.name}${owned?' ✓':''}`,sub:`${v.price>0?'💰'+v.price+' · ':''}${perks}`,hint:v.desc,
        disabled:owned||!afford,
        run:()=>{if(v.price>0)C.coin-=v.price;C.gear[cat]=v.key;
          return{t:`Kau kini memakai ${v.name}.`,cls:"e-good"};}};
    })});
}

// ---------- POPUP: kelola bisnis ----------
function bizPopup(id){
  const def=BUSINESS_TYPES.find(b=>b.id===id);const owned=C.businesses.find(b=>b.id===id);
  const next=owned.level+1;const canUp=next<def.tiers.length;const cost=canUp?def.upgrade[next]:0;
  const choices=[];
  if(canUp)choices.push({label:`Perluas jadi ${def.tiers[next]}`,sub:`💰${cost} · income jadi +${def.income[next]}/th`,cls:"love",disabled:C.coin<cost,
    run:()=>{C.coin-=cost;owned.level=next;return{t:`${def.name} diperluas jadi ${def.tiers[next]}!`,cls:"e-epic"};}});
  choices.push({label:"Jual bisnis",sub:`dapat ~${Math.round(def.buy*0.5)} keping`,cls:"danger",
    run:()=>{const g=Math.round(def.buy*0.5);C.coin+=g;C.businesses=C.businesses.filter(b=>b.id!==id);
      return{t:`Kau menjual ${def.name} seharga ${g} keping.`,cls:"e-bad"};}});
  openChoice({ico:def.ico,prompt:`Kelola <b>${def.name}</b>:`,choices});
}

// ---------- override resolveChoice: dukung _then (popup berantai) & non-activity popups ----------
resolveChoice=function(i){
  const {data}=pendingChoice;
  if(data._isActivity&&!spendAction()){closeModal();return;}
  const res=data.choices[i].run();
  let then=null;
  if(res){
    if(res.t)log(C.age,res.t,res.cls);
    if(res.t)toast(res.t);
    if(res._then)then=res._then;
    if(res.chain){closeModal();openChoice(res.chain);return;}
  }
  closeModal();
  if(C.stats.health<=0){die("Pilihanmu membawamu pada ajal.");return;}
  checkMissions();updateTitle();renderAll();
  if(C.pendingDot&&currentTab!=="Relasi")document.getElementById("dotRelasi").classList.add("on");
  if(then)setTimeout(then,180); // lanjut popup berantai (sewa)
};

// builder: kembalikan emoji wajah sesuai umur+gender+skin
function buildAvatar(ap, age, isMage, alive){
  if(!alive)return "💀";
  const m = ap && ap.skin ? (SKIN_TONES.find(s=>s.key===ap.skin)||{}).mod || "" : "";
  const fem = ap ? ap.female : false;
  if(isMage && age>=16) return (fem?"🧙‍♀️":"🧙‍♂️"); // mage tidak pakai skin mod (ZWJ)
  if(age<3) return "👶"+m;
  if(age<13) return "🧒"+m;
  if(age<18) return (fem?"👧":"👦")+m;
  if(age<55) return (fem?"👩":"👨")+m;
  return (fem?"👵":"👴")+m;
}

function initDraft(originId){
  const o=ORIGINS.find(x=>x.id===originId);

    appearance:{female:false, skin:"medium", hair:"none"},

function netWorth(){
  let total=C.coin;
  C.properties.forEach(p=>{const def=PROPERTY_CATALOG.find(x=>x.key===p.key);if(def)total+=Math.round(def.price*0.6);});
  C.businesses.forEach(b=>{const def=BUSINESS_TYPES.find(x=>x.id===b.id);if(def)total+=Math.round(def.buy*0.5);});

function addItem(key,qty=1){C.inventory[key]=(C.inventory[key]||0)+qty;}
function useItem(key){
  if(!C.inventory[key]||C.inventory[key]<=0)return;
  const def=ITEM_CATALOG.find(x=>x.key===key);if(!def)return;
  const msg=def.use();
  if(!def.reusable)C.inventory[key]--;
  log(C.age,msg,"e-good");toast(msg);
  if(C.stats.health<=0){die("Akibat fatal.");return;}
  updateTitle();renderAll();
}

// ---------- buat karakter dari draft kustomisasi ----------
function createFromDraft(){
  C=newChar(draft.originId);

  C.appearance={...draft.appearance,female:draft.female};
  // terapkan alokasi skill ke base
  for(const k of DRAFT_SKILL_KEYS) C.stats[k]=clamp(C.stats[k]+draft.alloc[k]);
  initMissions();C._log=[];
  const o=ORIGINS.find(x=>x.id===draft.originId);

// redam efek negatif lingkungan kalau skill relevan tinggi
function envDamping(){
  // pedang & sihir tinggi -> tahan lingkungan keras
  const tough=Math.max(C.stats.might,C.stats.mana);
  return tough>=70?0.2 : tough>=50?0.5 : tough>=30?0.8 : 1.0;

// ---------- KUOTA AKSI ----------
function spendAction(n=1){
  if(C.actionsLeft<n){toast("Aksi tahun ini habis. Lanjut ke tahun berikutnya.");return false;}
  C.actionsLeft-=n;return true;
}
function grantActionBonus(n){
  const room=ACTION_BONUS_CAP-C.actionBonus;
  const give=Math.min(n,room);
  if(give>0){C.actionBonus+=give;C.actionsLeft+=give;toast(`+${give} aksi bonus tahun ini!`);}
}

// ---------- ADVANCE YEAR (mengganti ageUp & advanceMonth) ----------
function teenAllowanceAmount(){
  const base=Math.round((C.familyWealth||0)*0.3);
  const mins={orphan:25,peasant:15};
  return Math.max(mins[C.origin]||20,base);
}
function maybeGrantTeenAllowance(wasChild){
  if(wasChild&&C.age>=13&&!C.allowance){
    C.allowance=true;
    const give=teenAllowanceAmount();
    if(give>0){
      C.coin+=give;
      log(C.age,`Kau cukup dewasa untuk mengelola uang. Keluarga memberimu ${give} keping sebagai bekal.`,"e-good");
    }
  }
}

function advanceYear(){
  if(!C.alive)return;
  const wasChild=C.age<13;
  C.age++;
  maybeGrantTeenAllowance(wasChild);

  // reset kuota aksi tahunan
  C.actionsLeft=ACTIONS_PER_YEAR;
  C.actionBonus=0;

  // efek lingkungan kota (diredam skill) — skala tahunan
  const city=currentCity();const damp=envDamping();
  if(city.env){
    for(const k in city.env){
      let d=city.env[k]*3;                     // efek setahun ~3x sebulan
      if(d<0)d=Math.round(d*damp);             // negatif diredam
      if(k==="coin")C.coin=Math.max(0,C.coin+d);
      else applyStats({[k]:d});
    }
  }

  // jauh dari rumah & keluarga
  if(C.cityId!==C.homeCityId){
    C.yearsAwayFromHome++;
    const fam=C.relations.filter(r=>r.role==="keluarga"||r.role==="pasangan");
    if(fam.length){
      fam.forEach(r=>{r.bond=clamp(r.bond-ri(3,7));});
      if(C.yearsAwayFromHome>=2&&chance(0.5))
        log(C.age,`Kau rindu & khawatir pada keluarga di ${cityOf(C.homeCityId).name}. (relasi menurun)`,"e-bad");
    }
  }else{
    C.yearsAwayFromHome=0;
  }

  // proses tahunan: gaji, bisnis, aset, umur
  processYearly();
  if(!C.alive)return;

  if(C.stats.health<=0)return die("Tubuhmu menyerah.");

  // event tahunan (~72% seperti semula)
  if(chance(0.72)){
    const pool=EVENTS.filter(e=>C.age>=e.minAge&&C.age<=e.maxAge&&(!e.cond||e.cond(C)));
    if(pool.length){
      const tot=pool.reduce((s,e)=>s+(e.w||1),0);let r=Math.random()*tot,ev;
      for(const e of pool){r-=(e.w||1);if(r<=0){ev=e;break;}}
      ev=ev||pool[0];
      if(ev.choice){openChoice(ev.choice());updateTitle();render();return;}
      const res=ev.auto();log(C.age,res.t,res.cls);
    }
  }else{
    log(C.age,rand(["Tahun tenang berlalu.","Musim berganti damai.","Hanya rutinitas sehari-hari.","Hidup berjalan tanpa kejutan."]),"");
  }

  if(C.stats.health<=0)return die("Lukamu terlalu parah.");
  checkMissions();updateTitle();render();
  if(typeof flushRentQueue==="function")flushRentQueue();
}

// proses yg jalan tiap tahun (gaji, bisnis, aset, umur)
function processYearly(){
  if(typeof applyAssetPerksV4==="function")applyAssetPerksV4();
  processCareer();
  processBusinesses();
  if(C._bizRisk)log(C.age,C._bizRisk,"e-bad");
  if(C.age>50)applyStats({health:-ri(1,3)});
  if(C.age>65)applyStats({health:-ri(3,6)});
  if(C.age>60&&chance((C.age-60)*0.015)&&C.stats.health<35){die("Usia tua menjemputmu.");return;}
  if(typeof processActiveRentals==="function")C._rentQueue=processActiveRentals();
}

// ---------- TRAVEL antar kota ----------
function travelTo(cityId){
  if(cityId===C.cityId){toast("Kau sudah di kota ini.");return;}
  const dist=CITY_DISTANCE[C.cityId][cityId];
  if(C.actionsLeft<dist){toast(`Butuh ${dist} aksi untuk ke sana (sisa ${C.actionsLeft}). Lanjut tahun dulu.`);return;}
  // popup konfirmasi + opsi ajak keluarga
  const fam=C.relations.filter(r=>r.role==="keluarga"||r.role==="pasangan");
  const target=cityOf(cityId);
  const choices=[
    {label:`Berangkat sendiri`,sub:`${dist} aksi`,run:()=>{doTravel(cityId,dist,false);return null;}},
  ];
  if(fam.length){
    choices.unshift({label:`Ajak keluarga (${fam.length})`,sub:`${dist+2} aksi · relasi aman`,cls:"love",
      disabled:C.actionsLeft<dist+2,
      run:()=>{doTravel(cityId,dist+2,true);return null;}});
  }
  openChoice({ico:target.ico,prompt:`Bepergian ke <b>${target.name}</b> (${target.tag})?<br><span style="font-size:11px;color:var(--ink-soft);filter:brightness(1.6)">${target.pros[0]} · tapi ${target.cons[0].toLowerCase()}</span>`,choices});
}
function doTravel(cityId,cost,withFamily){
  C.actionsLeft-=cost;
  C.cityId=cityId;C.location=cityId;C.subloc=null;
  if(withFamily){
    C.relations.filter(r=>r.role==="keluarga"||r.role==="pasangan").forEach(r=>r.bond=clamp(r.bond+ri(1,3)));
    C.yearsAwayFromHome=0;C.homeCityId=cityId;
  }
  const city=cityOf(cityId);
  log(C.age,`Kau tiba di ${city.name}. ${city.tag}.`,"e-good");
  toast(`Tiba di ${city.name}!`);
  closeModal();updateTitle();renderAll();
}

// ---------- PETA INTERAKTIF (klik kota -> sub-lokasi) ----------
function renderPeta(){
  const city=currentCity();
  let html=`<div class="sechead">🗺️ Dunia Aetheria — 4 Kota</div>`;

  // PETA VISUAL SVG dengan animasi
  if(typeof worldMapSVG==="function")html+=`<div class="map-wrap">${worldMapSVG()}</div>`;

  html+=`<p style="font-size:11px;color:var(--ink-soft);filter:brightness(1.6);margin:0 4px 12px;line-height:1.5;">Tap kota di peta untuk berpindah (atau lihat daftar di bawah). Pindah kota makan aksi sesuai jarak. Kamu di <b>${city.name}</b>.</p>
    <div class="tiles">`;
  CITIES.forEach(c=>{
    const here=c.id===C.cityId;
    const dist=CITY_DISTANCE[C.cityId][c.id];
    html+=`<div class="tile city-tile ${here?'here':''}" onclick="${here?`viewCity()`:`travelTo('${c.id}')`}">
      ${here?'<span class="badge">DI SINI</span>':`<span class="badge dist">${dist}⚡</span>`}
      <span class="ti">${c.ico}</span><span class="tn">${c.name}</span>
      <span class="td">${c.tag}</span></div>`;
  });
  html+=`</div>`;

  // sub-lokasi kota saat ini
  html+=`<div class="sechead">📍 Sub-Lokasi ${city.name}</div>
    <p style="font-size:10.5px;color:var(--gold);filter:brightness(1.1);margin:0 4px 10px;">Eksklusif di sini: ${city.exclusive}</p>
    <div class="tiles">`;
  city.sublocs.forEach(s=>{
    const at=C.subloc===s.id;
    html+=`<div class="tile ${at?'here':''}" onclick="gotoSubloc('${s.id}')">
      ${at?'<span class="badge">DI SINI</span>':''}
      <span class="ti">${s.ico}</span><span class="tn">${s.name}</span>
      <span class="td">${s.desc}</span></div>`;
  });
  html+=`</div>`;

  // distrik toko berkategori (wand smith, swordsmith, salon, dll)
  if(typeof storeDistrictHTML==="function")html+=storeDistrictHTML();

  document.getElementById("viewPeta").innerHTML=html;
}

renderAktivitas=function(){
  const city=currentCity();
  let html="";
  // konteks lokasi
  const sub=C.subloc?city.sublocs.find(s=>s.id===C.subloc):null;
  html+=`<div class="sechead">📍 ${city.name}${sub?' › '+sub.name:''}</div>`;
  html+=`<p style="font-size:11px;color:var(--ink-soft);filter:brightness(1.6);margin:0 4px 10px;line-height:1.5;">${sub?sub.desc:'Pilih sub-lokasi di tab Peta untuk aktivitas khusus. Aktivitas umum bisa di mana saja.'}</p>`;

  // aktivitas khas sub-lokasi (Prioritas 2)
  if(typeof sublocActsHTML==="function")html+=sublocActsHTML();

  // karir
  html+=`<div class="sechead">Pekerjaan & Karir</div>`;
  if(C.age<MIN_WORK_AGE){
    html+=`<p style="font-size:11.5px;color:var(--ink-soft);filter:brightness(1.6);margin:0 4px 8px;">Terlalu muda untuk bekerja (min usia ${MIN_WORK_AGE}).</p>`;
  }else if(C.career){
    const car=CAREERS.find(x=>x.id===C.career);
    html+=`<div class="tiles"><div class="tile fullrow" onclick="quitCareer()">
      <span class="ti">${car.ico}</span><span class="tn">${car.ranks[C.careerLevel]}</span>
      <span class="td">${car.name}. Gaji tiap tahun. Ketuk untuk berhenti.</span></div></div>`;
  }else{
    html+=`<div class="tiles">`;
    CAREERS.filter(c=>!c.arcane||C.isMage).forEach(c=>{const ok=c.req(C);
      html+=`<div class="tile ${ok?'':'locked'} ${c.arcane?'arcane':''}" ${ok?`onclick="applyCareer('${c.id}')"`:''}>
        <span class="ti">${c.ico}</span><span class="tn">${c.name}${c.shady?' 🕶️':''}</span>
        <span class="td">${ok?'Gaji '+c.basepay+'/th':'🔒 Syarat kurang'}</span></div>`;});
    html+=`</div>`;
  }

  // aktivitas umum
  html+=`<div class="sechead">Aktivitas Umum (1 aksi)</div><div class="tiles">`;
  ACTIVITIES.filter(a=>!a.cond||a.cond(C)).forEach(a=>{
    const minA=(typeof ACT_MIN_AGE!=="undefined"&&ACT_MIN_AGE[a.id])||0;
    const locked=C.age<minA;

// ---------- ANIMASI PENDEK (overlay ringan 2-3 detik) ----------
// tipe: 'clash' (pedang), 'race' (kuda), 'dice', 'cards', 'cheer', 'sad'
function playAnim(type,opts={}){
  const layer=document.getElementById("animLayer");
  if(!layer)return;
  // jangan mainkan animasi "hasil" (win/lose/coin/win) jika popup sedang terbuka,
  // supaya tidak menimpa & menutupi teks result popup.
  const modal=document.getElementById("modal");
  const modalOpen=modal&&modal.classList&&modal.classList.contains("show");
  if(modalOpen&&(type==="win"||type==="lose"||type==="coin"))return;
  let inner="";
  if(type==="clash") inner=`<div class="anim-clash"><span class="ac-l">⚔️</span><span class="ac-spark">💥</span><span class="ac-r">🛡️</span></div>`;
  else if(type==="race") inner=`<div class="anim-race"><span class="ar-run">🐎</span><span class="ar-dust">💨</span></div>`;
  else if(type==="chariot") inner=`<div class="anim-race"><span class="ar-run">🛞</span><span class="ar-dust">💨</span></div>`;
  else if(type==="dice") inner=`<div class="anim-dice">🎲</div>`;
  else if(type==="cards") inner=`<div class="anim-cards">🃏</div>`;
  else if(type==="win") inner=`<div class="anim-burst">🎉<span class="ab-sub">${opts.text||'MENANG!'}</span></div>`;
  else if(type==="lose") inner=`<div class="anim-burst sad">💀<span class="ab-sub">${opts.text||'KALAH'}</span></div>`;
  else if(type==="coin") inner=`<div class="anim-burst">💰<span class="ab-sub">${opts.text||''}</span></div>`;
  else inner=`<div class="anim-burst">✨</div>`;
  layer.innerHTML=`<div class="anim-box">${inner}</div>`;
  layer.classList.add("show");
  clearTimeout(layer._tm);
  layer._tm=setTimeout(()=>{layer.classList.remove("show");layer.innerHTML="";},opts.dur||1500);
}

// ---------- skill check util: peluang menang berbasis stat vs kesulitan ----------
// return {win, margin} ; margin 0..1 seberapa telak
function skillRoll(statVal,difficulty){
  // statVal 0..100, difficulty 0..100
  const edge=(statVal-difficulty)/100;          // -1..1
  const p=clamp((0.5+edge*0.45)*100)/100;        // 0.05..0.95 kira2
  const roll=Math.random();
  const win=roll<p;
  const margin=win?(p-roll)/Math.max(p,0.01):(roll-p)/Math.max(1-p,0.01);
  return {win,margin:clamp(margin*100)/100,p};
}

function mountKey(){return C.gear?C.gear.mount:"none";}
function hasReqMount(t){return !t.reqMount||t.reqMount.includes(mountKey());}

function openTournament(tid){
  const t=TOURNAMENTS.find(x=>x.id===tid);if(!t)return;
  if(!hasReqMount(t)){toast(`Butuh tunggangan: ${t.reqMount.join("/")}. Beli di tab Aset.`);return;}
  if(C.coin<t.entry){toast(`Biaya masuk ${t.entry} keping, koin kurang.`);return;}
  // mulai dari ronde 0
  startTournamentRound(t,0,0);
}
function startTournamentRound(t,roundIdx,winnings){
  if(roundIdx===0){
    if(!spendAction()){toast("Aksi habis.");return;}
    C.coin-=t.entry;
  }
  const round=t.rounds[roundIdx];
  const statVal=Math.max(C.stats[t.stat], t.altStat?C.stats[t.altStat]:0);
  openChoice({ico:t.ico,
    prompt:`<b>${t.name}</b> — Ronde ${roundIdx+1}/${t.rounds.length}<br><span style="font-size:11px;color:var(--ink-soft);filter:brightness(1.6)">Lawan tingkat kesulitan ${round.diff}. ${STAT_META[t.stat].name}mu: ${Math.round(statVal)}. Hadiah ronde: ${round.prize} keping.</span>`,
    cancel:false,
    choices:[
      {label:"Bertarung!",sub:`menang lanjut, kalah pulang dgn hadiah terkumpul`,cls:"love",run:()=>{
        const res=skillRoll(statVal,round.diff);
        playAnim(t.anim);
        setTimeout(()=>{
          if(res.win){
            const w=winnings+round.prize;
            applyStats({[t.stat]:+2,happy:+4});
            if(roundIdx+1<t.rounds.length){
              log(C.age,`🏆 ${t.name}: menang ronde ${roundIdx+1}! (+${round.prize})`,"e-good");
              playAnim("win",{text:`RONDE ${roundIdx+1} LOLOS`});
              setTimeout(()=>startTournamentRound(t,roundIdx+1,w),900);
            }else{
              C.coin+=w;C.reputation+=8;
              log(C.age,`👑 JUARA ${t.name}! Total hadiah ${w} keping & reputasi naik.`,"e-epic");
              playAnim("win",{text:`JUARA! +${w}💰`});
              checkMissions();updateTitle();renderAll();
            }
          }else{
            // kalah: tetap bawa hadiah terkumpul, tapi cedera
            C.coin+=winnings;
            const hurt=ri(8,22);applyStats({health:-hurt,happy:-5});
            log(C.age,`${t.name}: kalah di ronde ${roundIdx+1}. Cedera -${hurt} nyawa. Bawa pulang ${winnings} keping.`,"e-bad");
            playAnim("lose");
            if(C.stats.health<=0){setTimeout(()=>die("Tewas di arena turnamen."),500);return;}
            updateTitle();renderAll();
          }
        },700);
        return null; // animasi handle sisanya
      }},
      ...(roundIdx>0?[{label:"Mundur — ambil hadiah",sub:`bawa ${winnings} keping`,run:()=>{
        C.coin+=winnings;return{t:`Kau mundur dari ${t.name} membawa ${winnings} keping.`,cls:"e-good"};}}]:[]),
    ]});
}

function betPrompt(title,ico,onBet){

function diceGame(){
  if(!spendAction()){toast("Aksi habis.");return;}
  betPrompt("🎲 Dadu Hazard — tebak hasil","🎲",(bet)=>{
    closeModal();
    setTimeout(()=>openChoice({ico:"🎲",prompt:`Taruhan ${bet}. Tebak total 2 dadu:`,cancel:false,
      choices:[
        {label:"Rendah (2-6)",sub:"bayar 2x",run:()=>{rollDice(bet,"low");return null;}},
        {label:"Tujuh (7)",sub:"bayar 4x (langka!)",run:()=>{rollDice(bet,"seven");return null;}},
        {label:"Tinggi (8-12)",sub:"bayar 2x",run:()=>{rollDice(bet,"high");return null;}},
      ]}),140);
  });
}
function rollDice(bet,guess){
  C.coin-=bet;
  closeModal();              // tutup popup tebak dulu agar animasi tampil bersih
  playAnim("dice");
  setTimeout(()=>{
    const d1=ri(1,6),d2=ri(1,6),sum=d1+d2;
    let win=false,mult=0;
    if(guess==="low"&&sum<=6){win=true;mult=2;}
    if(guess==="high"&&sum>=8){win=true;mult=2;}
    if(guess==="seven"&&sum===7){win=true;mult=4;}
    if(win){const gain=bet*mult;C.coin+=gain;
      finishAct(`🎲 Dadu ${d1}+${d2}=${sum}. MENANG! +${gain} keping.`,"e-epic");}
    else{finishAct(`🎲 Dadu ${d1}+${d2}=${sum}. Kalah taruhan ${bet}.`,"e-bad");}
  },800);
}
function cardGame(){
  if(!spendAction()){toast("Aksi habis.");return;}
  betPrompt("🃏 Kartu Tinggi — adu vs bandar","🃏",(bet)=>{
    C.coin-=bet;closeModal();
    playAnim("cards");
    setTimeout(()=>{
      // pesona sedikit menaikkan peluang (membaca bandar)
      const me=ri(1,13)+Math.round(C.stats.charm/40);
      const dealer=ri(1,13);
      const NAMES={1:"As",11:"Jack",12:"Ratu",13:"Raja"};
      const nm=v=>NAMES[v]||v;
      if(me>dealer){const gain=bet*2;C.coin+=gain;
        finishAct(`🃏 Kartumu ${nm(Math.min(me,13))} mengalahkan bandar ${nm(dealer)}. MENANG +${gain}!`,"e-epic");}
      else if(me===dealer){C.coin+=bet;
        finishAct(`🃏 Seri (${nm(dealer)}). Taruhan kembali.`,"e-good");}
      else{finishAct(`🃏 Kartumu ${nm(Math.min(me,13))} kalah dari bandar ${nm(dealer)}. Kehilangan ${bet}.`,"e-bad");}
    },800);
  });
}

// ---------- helper cek umur ----------
function actAllowed(minAge){return C.age>=(minAge||0);}

// ---------- override openSubs: cek umur aktivitas umum ----------
const _preAgeOpenSubs=openSubs;
openSubs=function(actId){
  const minA=ACT_MIN_AGE[actId]||0;
  if(!actAllowed(minA)){toast(`Kamu harus berusia minimal ${minA} tahun untuk ini.`);return;}
  _preAgeOpenSubs(actId);
};

// ---------- override runSublocAct: cek umur per aktivitas ----------
const _preAgeRunSubloc=runSublocAct;
runSublocAct=function(sublocId,idx){
  const ages=SUBLOC_ACT_MIN_AGE[sublocId];
  const minA=ages?(ages[idx]||0):0;
  if(!actAllowed(minA)){toast(`Perlu usia minimal ${minA} tahun untuk aktivitas ini.`);return;}
  _preAgeRunSubloc(sublocId,idx);
};

// ---------- override renderAktivitas: tampilkan child-acts utk anak, filter umur ----------
const _preAgeRenderAktivitas=renderAktivitas;
renderAktivitas=function(){
  _preAgeRenderAktivitas();
  const host=document.getElementById("viewAktivitas");
  if(!host)return;

  // 1) sisipkan kartu aktivitas anak di paling atas kalau masih muda
  if(C.age<13){
    const kid=CHILD_ACTS.filter(a=>C.age>=a.minAge&&C.age<=a.maxAge);
    if(kid.length){
      let kh=`<div class="sechead">🧒 Masa Kecil</div><div class="tiles">`;
      kid.forEach((a,i)=>{kh+=`<div class="tile" onclick="runChildAct(${i})">
        <span class="ti">${a.ico}</span><span class="tn">${a.label}</span>
        <span class="td">${a.hint}</span></div>`;});
      kh+=`</div>`;
      host.innerHTML=kh+host.innerHTML;
    }
  }

  // 2) redam (locked) kartu yg belum cukup umur — tandai visual
  //    (filter dilakukan saat klik via guard; di sini kita beri catatan)
  if(C.age<18){
    const note=document.createElement("div");
  }
};
function runChildAct(i){
  const kid=CHILD_ACTS.filter(a=>C.age>=a.minAge&&C.age<=a.maxAge);
  const a=kid[i];if(!a)return;a.run();
}

// ---------- filter visual: sembunyikan aktivitas sub-lokasi yg belum cukup umur ----------
// override sublocActsHTML supaya aktivitas terkunci tampil redup + label umur
const _preAgeSublocHTML=sublocActsHTML;
sublocActsHTML=function(){
  if(!C.subloc)return "";
  const acts=SUBLOC_ACTS[C.subloc];
  if(!acts||!acts.length)return "";
  const ages=SUBLOC_ACT_MIN_AGE[C.subloc]||[];
  const sub=currentCity().sublocs.find(s=>s.id===C.subloc);
  let html=`<div class="sechead">✦ Khas ${sub.name}</div><div class="tiles">`;
  acts.forEach((a,i)=>{
    const minA=ages[i]||0;
    const locked=C.age<minA;
    html+=`<div class="tile ${locked?'locked':''}" ${locked?'':`onclick="runSublocAct('${C.subloc}',${i})"`}>
      <span class="ti">${a.ico}</span><span class="tn">${a.label}</span>
      <span class="td">${locked?`🔒 min ${minA} th`:a.hint}</span></div>`;});
  html+=`</div>`;
  return html;
};

// pasang ke state saat newChar (via patch di bawah)
function ensureWardrobe(){
  if(!C.wardrobe)C.wardrobe={body:"none",legs:"none",feet:"none",head:"none"};
}

// perks wardrobe dipanggil tiap tahun
function applyWardrobePerks(){
  ensureWardrobe();
  for(const slot in C.wardrobe){
    const cat=WARDROBE_CATALOG[slot];if(!cat)continue;
    const v=cat.variants.find(x=>x.key===C.wardrobe[slot]);
    if(v&&v.perk)applyStats(v.perk);
  }
}

// ---------- RENDER WARDROBE (di tab Aset, section baru) ----------
function wardrobeHTML(){
  ensureWardrobe();
  let html=`<div class="sechead">👗 Wardrobe (pakai bonus stat)</div>`;
  for(const slot in WARDROBE_CATALOG){
    const cat=WARDROBE_CATALOG[slot];
    const cur=cat.variants.find(v=>v.key===C.wardrobe[slot]);
    const perkStr=Object.entries(cur.perk||{}).map(([k,v])=>`${STAT_META[k]?STAT_META[k].name:k}+${v}`).join(" ")||"—";
    html+=`<div class="asset"><span class="assetico">${cat.ico}</span>
      <div class="assetinfo"><div class="assetname">${cur.name}</div>
        <div class="assetlvl">${cat.name} · ${perkStr}/th</div>
        <div class="assetdesc">${cur.desc}</div></div>
      <button class="upbtn" onclick="chooseWardrobePopup('${slot}')">Ganti</button></div>`;
  }
  return html;
}
function chooseWardrobePopup(slot){
  const cat=WARDROBE_CATALOG[slot];
  openChoice({ico:cat.ico,prompt:`Pilih ${cat.name}:`,
    choices:cat.variants.filter(v=>!v.arcane||C.isMage).map(v=>{
      const owned=C.wardrobe[slot]===v.key;
      const afford=v.price===0||C.coin>=v.price||owned;
      const perks=Object.entries(v.perk||{}).map(([k,val])=>`${STAT_META[k]?STAT_META[k].name:k}+${val}`).join(" ")||"—";
      return {label:`${v.name}${owned?' ✓':''}`,sub:`${v.price>0?'💰'+v.price+' · ':''}${perks}`,hint:v.desc,
        disabled:owned||!afford,
        run:()=>{if(v.price>0)C.coin-=v.price;C.wardrobe[slot]=v.key;applyWardrobePerks();
          return{t:`Kau kini mengenakan ${v.name}.`,cls:"e-good"};}};
    })});
}

// nilai hadiah menaikkan bond/loyalty sesuai harga item
function giftItemPopup(itemKey){
  const it=ITEM_CATALOG.find(x=>x.key===itemKey);if(!it)return;
  if(!C.relations.length){toast("Belum ada relasi untuk diberi hadiah.");return;}
  openChoice({ico:"🎁",prompt:`Beri <b>${it.name}</b> kepada siapa?`,
    choices:C.relations.map(r=>({label:`${r.ico} ${r.name}`,sub:r.role,run:()=>{
      C.inventory[itemKey]--;
      const val=it.price||15;
      const boost=Math.min(20,Math.round(val/8)+ri(3,7));
      if(r.role==="pengikut")r.loyalty=clamp(r.loyalty+boost);
      else r.bond=clamp(r.bond+boost);
      applyStats({happy:+2});
      return{t:`Kau memberi ${it.name} pada ${r.name}. ${r.role==="pengikut"?"Loyalitas":"Ikatan"} +${boost}.`,cls:"e-good"};
    }}))});
}

//  HAGGLE — tawar harga saat beli item
// ============================================================
// peluang sukses berbasis Pesona; sukses = diskon, gagal = harga naik/penjual marah
function haggleItem(itemKey){
  const it=ITEM_CATALOG.find(x=>x.key===itemKey);if(!it||it.price<=0)return;
  if(!spendAction())return;
  const res=skillRoll(C.stats.charm,45);
  playAnim(res.win?"win":"lose",{text:res.win?"NEGO!":"GAGAL"});
  setTimeout(()=>{
    if(res.win){
      const disc=Math.round(it.price*(0.15+res.margin*0.3));
      const price=it.price-disc;
      if(C.coin>=price){C.coin-=price;addItem(itemKey);
        finishAct(`Tawar berhasil! ${it.name} cuma ${price} (hemat ${disc}).`,"e-good");}
      else finishAct(`Nego berhasil (${price}) tapi koinmu tetap kurang.`,"e-bad");
    }else{
      finishAct(`Penjual tersinggung tawaranmu. ${it.name} tak jadi dibeli.`,"e-bad");
    }
  },700);
}

// ============================================================
//  LELANG — jual barang via lelang (hasil bervariasi)
// ============================================================
function auctionItem(itemKey){
  const it=ITEM_CATALOG.find(x=>x.key===itemKey);if(!it)return;
  if((C.inventory[itemKey]||0)<1){toast("Barang tak ada di tas.");return;}
  if(!spendAction())return;
  playAnim("coin");
  setTimeout(()=>{
    C.inventory[itemKey]--;
    const base=it.price||15;
    // lelang: 0.5x - 2.2x harga dasar, dipengaruhi pesona & keberuntungan
    const roll=0.5+Math.random()*1.4+C.stats.charm/200;
    const sale=Math.max(1,Math.round(base*roll));
    C.coin+=sale;
    finishAct(`Lelang ${it.name} laku ${sale} keping!`,"e-good","coin",`+${sale}💰`);
  },700);
}

// jual cepat (setengah harga, tanpa aksi)
function sellItem(itemKey){
  const it=ITEM_CATALOG.find(x=>x.key===itemKey);if(!it)return;
  if((C.inventory[itemKey]||0)<1)return;
  C.inventory[itemKey]--;
  const g=Math.max(1,Math.round((it.price||15)*0.5));
  C.coin+=g;
  finishAct(`Kau menjual cepat ${it.name} (+${g}).`,"e-good","coin");
}

// jadikan bahan sihir (jika mage & mana cukup) -> mana +
function enchantItem(itemKey){
  const it=ITEM_CATALOG.find(x=>x.key===itemKey);if(!it)return;
  if(!C.isMage){toast("Hanya penyihir bisa.");return;}
  if((C.inventory[itemKey]||0)<1)return;
  C.inventory[itemKey]--;
  applyStats({mana:+ri(4,9)});
  finishAct(`Kau menyerap esensi ${it.name} jadi mana.`,"e-arcane","win");
}

// ---------- POPUP aksi item (dipanggil dari tab Tas) ----------
function itemActionPopup(itemKey){
  const it=ITEM_CATALOG.find(x=>x.key===itemKey);if(!it)return;
  const choices=[];
  if(it.use&&!it.noBuy)choices.push({label:"Pakai",sub:it.desc,cls:"love",run:()=>{closeModal();setTimeout(()=>useItem(itemKey),100);return null;}});
  choices.push({label:"🎁 Hadiahkan",sub:"beri ke relasi (naikkan ikatan)",run:()=>{closeModal();setTimeout(()=>giftItemPopup(itemKey),120);return null;}});
  choices.push({label:"⚖️ Lelang",sub:"jual via lelang (hasil bervariasi)",run:()=>{closeModal();setTimeout(()=>auctionItem(itemKey),120);return null;}});
  choices.push({label:"💰 Jual cepat",sub:"setengah harga, instan",run:()=>{sellItem(itemKey);return null;}});
  if(C.isMage)choices.push({label:"✨ Jadikan bahan sihir",sub:"ubah jadi mana",cls:"arcane",run:()=>{enchantItem(itemKey);return null;}});
  openChoice({ico:it.ico,prompt:`<b>${it.name}</b> ×${C.inventory[itemKey]}:`,choices});
}

// jenjang: usia masuk & lulus (ambil tengah dari rentang yg user sebut)
const SCHOOL_LEVELS=[
  {tier:0,name:"Dasar",enterAge:5,gradAge:9},     // 4/5/6 -> 8/9/10
  {tier:1,name:"Menengah",enterAge:9,gradAge:12}, // 8/9/10 -> 11/12/13
  {tier:2,name:"Tinggi",enterAge:12,gradAge:16},  // 11/12/13 -> 15/16/17
];

function trackFor(origin){return SCHOOL_TRACKS[origin]||SCHOOL_TRACKS._default;}

// ---------- inisialisasi data sekolah saat karakter dibuat ----------
function initSchool(){
  const track=trackFor(C.origin);
  // randomize nama tiap jenjang
  C.school={
    track:track.type, ico:track.ico, statFocus:track.statFocus,
    levelNames:SCHOOL_LEVELS.map((lv,i)=>rand(track.names[i])),
    currentTier:-1,     // -1 = belum sekolah
    enrolled:false,
    failsThisYear:0,    // attempt kuis tahun ini (max 2)
    totalFails:0,       // gagal beruntun (3 = dropout)
    graduated:[],       // tier yg sudah lulus
    droppedOut:false,
    yearsInTier:0,
  };
}

// ---------- cek apakah waktunya masuk sekolah (dipanggil tiap tahun) ----------
function checkSchoolEnrollment(){
  if(!C.school||C.school.droppedOut)return;
  const s=C.school;
  // sudah di jenjang? skip
  if(s.enrolled)return;
  // cari jenjang yg cocok umur & belum lulus
  for(const lv of SCHOOL_LEVELS){
    if(s.graduated.includes(lv.tier))continue;
    if(C.age>=lv.enterAge && C.age<lv.gradAge+2){
      // tawarkan masuk (otomatis untuk jenjang dasar; pilihan untuk tinggi)
      s.currentTier=lv.tier;s.enrolled=true;s.yearsInTier=0;s.failsThisYear=0;
      log(C.age,`📚 Kau masuk ${s.levelNames[lv.tier]} (Jenjang ${lv.name}).`,"e-good");
      return;
    }
  }
}

function startQuiz(){
  const s=C.school;
  const bank=QUIZ_BANK[s.statFocus]||QUIZ_BANK.mind;
  const soal=rand(bank);
  // bonus: stat tinggi kadang kasih "petunjuk" (auto-pass chance kecil)
  const lvName=s.levelNames[s.currentTier];
  openChoice({ico:"📝",cancel:false,
    prompt:`<b>Kuis Kenaikan — ${lvName}</b><br><span style="font-size:12px">${soal.q}</span><br><span style="font-size:10.5px;color:var(--ink-soft);filter:brightness(1.6)">Attempt ${s.failsThisYear+1}/2 · ${s.statFocus==="mana"?"Mana":s.statFocus==="charm"?"Pesona":"Akal"}mu bantu sedikit</span>`,
    choices:soal.opts.map((opt,i)=>({label:opt,run:()=>{
      gradeQuiz(i===soal.a);return null;
    }}))});
}
function gradeQuiz(correct){
  const s=C.school;const lv=SCHOOL_LEVELS[s.currentTier];
  // stat tinggi bisa "selamatkan" jawaban salah dgn peluang kecil
  const statVal=C.stats[s.statFocus]||0;
  const saved=!correct && chance(statVal/300); // maks ~33% di stat 100
  if(correct||saved){
    closeModal();
    playAnim("win",{text:"LULUS!"});
    s.failsThisYear=0;s.totalFails=0;
    applyStats({[s.statFocus]:+ri(3,6),happy:+4});
    setTimeout(()=>{
      // lulus jenjang kalau sudah cukup umur
      if(C.age>=lv.gradAge){
        s.graduated.push(s.currentTier);s.enrolled=false;
        log(C.age,`🎓 Kau LULUS ${s.levelNames[s.currentTier]} (Jenjang ${lv.name})! ${saved?'(terselamatkan ilmu)':''}`,"e-epic");
        // gelar jika lulus jenjang tinggi
        if(s.currentTier===2){C.flags["diploma_"+s.track]=1;C.reputation+=10;
          log(C.age,`Ijazah ${s.track} kini menjadi syarat karir tingkat tinggi.`,"e-good");}
      }else{
        log(C.age,`Kau naik kelas di ${s.levelNames[s.currentTier]}. ${saved?'(nyaris gagal, tapi ilmumu menyelamatkan)':'Bagus!'}`,"e-good");
      }
      updateTitle();renderAll();
    },800);
  }else{
    closeModal();
    s.failsThisYear++;
    if(s.failsThisYear>=2){
      // gagal tahun ini -> ulang setahun
      s.totalFails++;s.failsThisYear=0;
      playAnim("lose",{text:"TIDAK NAIK"});
      if(s.totalFails>=3){
        s.droppedOut=true;s.enrolled=false;
        log(C.age,`💔 Kau gagal 3 kali & DROPOUT dari ${s.levelNames[s.currentTier]}. Pilih jalan hidup lain.`,"e-bad");
        applyStats({happy:-10});
      }else{
        log(C.age,`Kau gagal kuis tahun ini & harus mengulang. (gagal ${s.totalFails}/3)`,"e-bad");
        applyStats({happy:-5});
      }
      setTimeout(()=>{updateTitle();renderAll();},800);
    }else{
      // masih ada attempt ke-2
      log(C.age,`Jawaban salah! Sisa 1 attempt.`,"e-bad");
      setTimeout(()=>startQuiz(),600);
    }
  }
}

// ---------- proses sekolah tiap tahun ----------
function processSchool(){
  if(!C.school||C.school.droppedOut)return;
  checkSchoolEnrollment();
  const s=C.school;
  if(s.enrolled){
    s.yearsInTier++;
    // picu kuis (ditampilkan setelah event tahunan via antrian)
    C._quizPending=true;
  }
}

// snapshot stat sebelum aksi, untuk hitung delta yg ditampilkan di result popup
let _statSnapshot=null;
function snapStats(){
  if(typeof C==="undefined"||!C||!C.stats){_statSnapshot=null;return;}
  _statSnapshot={...C.stats,coin:C.coin,reputation:C.reputation};
}
function statDeltas(){
  if(!_statSnapshot)return [];
  const out=[];
  for(const k of STAT_ORDER){
    const d=Math.round(C.stats[k])-Math.round(_statSnapshot[k]);
    if(d!==0)out.push({label:STAT_META[k].name,d});
  }
  const dc=C.coin-_statSnapshot.coin; if(dc!==0)out.push({label:"Koin",d:dc,coin:true});
  const dr=C.reputation-_statSnapshot.reputation; if(dr!==0)out.push({label:"Reputasi",d:dr});
  return out;
}

// ---------- RESULT POPUP: untuk aksi tanpa pilihan ----------
// tampilkan hasil + ringkasan dampak yg rapi. opts:{ico,title,body,cls,anim,animText}
function showResult(opts){
  const deltas=statDeltas();
  const deltaHTML=deltas.length?`<div class="res-deltas">`+
    deltas.map(x=>{
      const pos=x.d>0;
      return `<span class="res-delta ${pos?'up':'down'}">${x.coin?'💰':''}${x.label} ${pos?'+':''}${x.d}</span>`;
    }).join("")+`</div>`:'';
  pendingChoice={data:{_isResult:true}};
  setModalIco(document.getElementById("mico"),opts.ico||"✨");
  document.getElementById("mprompt").innerHTML=
    `${opts.title?`<div class="res-title ${opts.cls||''}">${opts.title}</div>`:''}
     <div class="res-body">${opts.body||''}</div>${deltaHTML}`;
  document.getElementById("mchoices").innerHTML=
    `<button class="mchoice mc-ok" onclick="closeModal()">Lanjut ▸</button>`;
  document.getElementById("modal").classList.add("show");
  document.getElementById("btnAge").disabled=true;
  // catatan: animasi overlay sengaja TIDAK diputar di sini supaya tidak menimpa
  // teks result popup. Animasi standalone (turnamen/gambling) tetap diputar di tempatnya.
}

    showResult({ico:"💀",title:"Nasib Buruk",body:msg,cls:"e-death"});
    setTimeout(()=>{closeModal();die("Aktivitas berakibat fatal.");},50);
    return;
  }
  checkMissions();updateTitle();
  showResult({
    ico:cls==="e-bad"?"⚠️":cls==="e-epic"?"🌟":cls==="e-arcane"?"🔮":"✨",
    title:cls==="e-bad"?"Hasil Kurang Baik":cls==="e-epic"?"Luar Biasa!":"Selesai",
    body:msg,cls
  });
  // render di belakang modal
  renderAll();
};

// ---------- pemicu aging event (dipanggil tiap advanceYear) ----------
function rollAgingEvent(){
  if(!C||!C.alive)return false;
  if(!C._agingDone)C._agingDone={};
  const pool=AGING_EVENTS.filter(e=>{
    if(C.age<e.min||C.age>e.max)return false;
    if(e.once&&C._agingDone[e.id])return false;
    if(e.cond&&!e.cond(C))return false;
    return true;
  });
  if(!pool.length)return false;
  const ev=rand(pool);
  if(ev.once)C._agingDone[ev.id]=1;
  const data=ev.build();
  // bungkus choices supaya hasil tampil via result-style (log + render)
  const wrapped={ico:data.ico,prompt:data.prompt,cancel:false,
    choices:data.choices.map(ch=>({label:ch.label,sub:ch.sub,cls:ch.cls,run:()=>{
      const res=ch.run();
      if(res&&res.t){log(C.age,res.t,res.cls);
        // tampilkan ringkasan setelah pilih (pakai finishAct-style)
        setTimeout(()=>{if(typeof finishAct==="function"){/* finishAct already snapshots via openChoice */}},0);
      }
      return res;
    }}))};
  // snapshot utk delta, lalu buka
  if(typeof snapStats==="function")snapStats();
  openChoice(wrapped);
  return true;
}

// ============================================================
//  PATCH — Integrasi Aging Events
// ============================================================

// ---------- bungkus advanceYear: SELALU coba aging event tiap tambah umur ----------
// urutan: proses tahunan & event lama jalan dulu (via _aging_prevAdvance),
// LALU kalau tak ada modal terbuka, picu aging event.
const _aging_prevAdvance=advanceYear;
advanceYear=function(){
  // reset penanda lulus tahun ini
  C._justGraduated=false;
  _aging_prevAdvance.call(this);
  // setelah semua proses, kalau hidup & layar bebas, picu aging event
  if(C&&C.alive){
    if(!pendingChoice){
      rollAgingEvent();
    }else{
      // ada modal (event/kuis/sewa) — antrekan aging event setelah modal ditutup
      C._agingQueued=true;
    }
  }
};

// ---------- saat modal ditutup, jalankan aging event yg terantre ----------
const _aging_prevClose=closeModal;
closeModal=function(){
  _aging_prevClose();
  if(C&&C.alive&&C._agingQueued&&!pendingChoice){
    C._agingQueued=false;
    setTimeout(()=>{if(C.alive&&!pendingChoice)rollAgingEvent();},200);
  }
};

// ---------- tandai _justGraduated saat lulus jenjang (untuk grad_gift) ----------
// gradeQuiz menambah ke s.graduated; kita pantau lewat wrapper
if(typeof gradeQuiz==="function"){
  const _aging_prevGrade=gradeQuiz;
  gradeQuiz=function(correct){
    const before=C.school?C.school.graduated.length:0;
    _aging_prevGrade(correct);
    // cek apakah jumlah lulus bertambah (lulus jenjang)
    setTimeout(()=>{
      if(C.school&&C.school.graduated.length>before){C._justGraduated=true;
        // picu grad_gift segera kalau layar bebas
        if(!pendingChoice){const ev=AGING_EVENTS.find(e=>e.id==="grad_gift");
          if(ev&&ev.cond(C)){const data=ev.build();
            if(typeof snapStats==="function")snapStats();
            openChoice({ico:data.ico,prompt:data.prompt,cancel:false,choices:data.choices});}}}
    },900);
  };
}

const NPC_ORIGINS=["Aetheria","Thornvale","Saltmoor","Frostspire","desa terpencil","negeri seberang"];
const WEALTH_TIERS=["miskin","pas-pasan","berkecukupan","kaya","sangat kaya"];

// lengkapi profil saat relasi dibuat (lazy: hanya kalau belum ada)
function ensureProfile(r){
  if(r._profile)return r._profile;
  const sibCount=ri(0,4);
  const sibs=[];for(let i=0;i<sibCount;i++)sibs.push(randName(chance(0.5)).split(" ")[0]);
  r._profile={
    age:C.age+ri(-3,5),
    job:r.role==="keluarga"?"—":rand(NPC_JOBS),
    origin:rand(NPC_ORIGINS),
    wealth:rand(WEALTH_TIERS),
    married:chance(0.4),
    children:chance(0.3)?ri(1,3):0,
    siblings:sibs,
    parents:[randName(false).split(" ")[0],randName(true).split(" ")[0]],
    ambition:rand(["jadi kaya raya","menemukan cinta sejati","membalas dendam","menjadi ksatria","menguasai sihir","hidup tenang","membuka usaha","menjelajah dunia"]),
    secret:rand(["pernah jadi pencuri","keturunan bangsawan tersembunyi","takut pada sihir","berhutang besar","mencintai diam-diam seseorang","menyimpan harta karun"]),
  };
  // tingkat keterbukaan info: 0=belum kenal dalam, naik tiap ngobrol
  if(r._known===undefined)r._known=0;
  return r._profile;
}

// buka popup percakapan
function openConversation(relId){
  const r=C.relations.find(x=>x.id===relId);if(!r)return;
  const p=ensureProfile(r);
  const meter=r.role==="pengikut"?r.loyalty:r.bond;
  openChoice({ico:r.ico,prompt:`Ngobrol dengan <b>${r.name}</b><br><span style="font-size:11px;color:var(--ink-soft);filter:brightness(1.6)">${r.role} · ${r.trait} · ikatan ${Math.round(meter)}</span><br><span style="font-size:10.5px;color:var(--gold);filter:brightness(1.1)">Pilih topik (info terbuka makin sering ngobrol)</span>`,
    choices:CONVO_TOPICS.map(t=>{
      const locked=meter<t.minBond;
      return {label:`${t.ico} ${t.label}`,sub:locked?`🔒 butuh ikatan ${t.minBond}`:'',disabled:locked,
        run:()=>{
          const info=t.reveal(p);
          if(r.role==="pengikut")r.loyalty=clamp(r.loyalty+t.bond);else r.bond=clamp(r.bond+t.bond);
          r._known=(r._known||0)+1;
          applyStats({happy:+2});
          return{t:`💬 ${r.name}: "${info}"`,cls:"e-good"};
        }};
    })});
}

// ---------- PROFIL DETAIL (popup lihat profil lengkap) ----------
function openProfile(relId){
  const r=C.relations.find(x=>x.id===relId);if(!r)return;
  const p=ensureProfile(r);
  const known=r._known||0;
  // makin sering ngobrol, makin banyak baris terbuka
  const lines=[];
  lines.push(`<b>${r.name}</b> · ${r.female?"Perempuan":"Lelaki"}`);
  lines.push(`Status: ${r.role}${r.isChild?" (anak)":""} · sifat ${r.trait}`);
  lines.push(`Ikatan: ${Math.round(r.role==="pengikut"?r.loyalty:r.bond)} · kenal ${C.age-r.met} thn`);
  if(known>=1){lines.push(`Umur: ~${p.age} · Pekerjaan: ${p.job}`);lines.push(`Asal: ${p.origin}`);}
  else lines.push(`<i style="color:var(--ink-soft)">Ngobrol lebih sering untuk tahu pekerjaan & asal...</i>`);
  if(known>=2){lines.push(`Kekayaan: ${p.wealth}`);lines.push(`Keluarga: ortu ${p.parents.join(" & ")}${p.siblings.length?`, saudara ${p.siblings.join(", ")}`:", anak tunggal"}`);}
  if(known>=3){lines.push(`Status nikah: ${p.married?`menikah${p.children?`, ${p.children} anak`:""}`:"lajang"}`);}
  if(known>=4){lines.push(`Ambisi: ${p.ambition}`);}
  if(known>=6){lines.push(`<span style="color:var(--arcane-glow)">Rahasia: ${p.secret}</span>`);}
  openChoice({ico:r.ico,prompt:`<div style="text-align:left;font-size:12.5px;line-height:1.7">${lines.join("<br>")}</div>`,
    choices:[
      {label:"💬 Ajak ngobrol",run:()=>{closeModal();setTimeout(()=>openConversation(relId),140);return null;}},
    ]});
}

  if(C.coin<price){toast("Koin tak cukup.");return;}

}

  if(C.coin<cost){toast("Koin tak cukup.");return;}

  C.coin-=cost;applyStats(effect);finishAct(msg,cls||"e-good");
}

// ---------- toko mana yang ada di kota saat ini ----------
function storesInCity(){
  return STORES.filter(s=>s.city.includes("all")||s.city.includes(C.cityId));
}

// ---------- buka katalog toko ----------
function openStore(storeId){
  const s=STORES.find(x=>x.id===storeId);if(!s)return;
  const items=s.build();
  snapStats&&snapStats();
  openChoice({ico:s.ico,prompt:`<b>${s.name}</b> — ${s.cat}<br><span style="font-size:11px;color:var(--ink-soft);filter:brightness(1.6)">${s.desc} · Koinmu: ${C.coin}</span>`,
    choices:items.map(it=>{
      const locked=C.age<(it.minAge||0);
      const afford=it.price===0||C.coin>=it.price;
      return {label:it.label,sub:locked?`🔒 min ${it.minAge} th`:it.sub,disabled:locked||!afford,
        run:()=>{closeModal();setTimeout(()=>{recordActivity&&recordActivity(`${s.name}: ${it.label}`,()=>{snapStats&&snapStats();it.run();});it.run();},120);return null;}};
    })});
}

// ---------- render distrik toko (dipanggil di renderPeta) ----------
function storeDistrictHTML(){
  const stores=storesInCity();
  if(!stores.length)return "";
  let html=`<div class="sechead">🏪 Distrik Toko ${currentCity().name}</div>
    <p style="font-size:10.5px;color:var(--ink-soft);filter:brightness(1.6);margin:0 4px 10px;">Tiap toko punya barang & jasa khas. Klik untuk lihat katalog.</p>
    <div class="tiles">`;
  stores.forEach(s=>{
    html+=`<div class="tile store-tile" onclick="openStore('${s.id}')">
      <span class="ti">${s.ico}</span><span class="tn">${s.name}</span>
      <span class="td">${s.cat}</span></div>`;
  });
  html+=`</div>`;
  return html;
}
