<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Mantara — Hikayat Dunia Sihir</title>
<!-- PWA / iOS standalone -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mantara">
<meta name="theme-color" content="#171019">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="Mantara — simulasi kehidupan fantasi dunia sihir. Jalani hidup dari lahir hingga mewariskan takdir ke keturunanmu.">
<!-- apple-touch-icon akan ditambahkan saat packaging (file ikon disiapkan di Xcode) -->
<style>
  :root{
    --parchment:#e8dcc0; --ink-soft:#5a4a38;
    --blood:#8b2635; --gold:#b8860b; --gold-bright:#f0c040;
    --royal:#4a3c6e; --arcane:#5b6ee1; --arcane-glow:#8b9cff;
    --moss:#6a8a3a; --bg0:#16110c; --bg1:#241a12; --card:#2e2218;
    --line:rgba(184,134,11,.25); --line2:rgba(139,156,255,.25);
    --good:#a8d49a; --bad:#e09a9a;
    --app-safe-top:env(safe-area-inset-top,0px);
    --app-safe-bottom:env(safe-area-inset-bottom,0px);
  }
  html.native-ios{--app-safe-top:max(env(safe-area-inset-top,0px),54px);}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    background:
      radial-gradient(ellipse 130% 60% at 50% -5%, #2e2440 0%, transparent 50%),
      radial-gradient(ellipse 100% 45% at 50% 105%, #1a1208 0%, transparent 50%),
      var(--bg0);
    color:var(--parchment);
    font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    height:100vh;height:100dvh;display:flex;justify-content:center;overflow:hidden;
  }
  .phone{
    width:100%;max-width:430px;height:100vh;height:100dvh;
    display:flex;flex-direction:column;position:relative;z-index:1;
  }
  .ambient{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
  .ember{position:absolute;bottom:-20px;animation:drift linear infinite;}
  @keyframes drift{to{transform:translateY(-105vh) rotate(40deg);opacity:0;}}

  /* ---------- HEADER ---------- */
  .topbar{padding:calc(12px + var(--app-safe-top)) 16px 8px;text-align:center;flex-shrink:0;}
  .game-title{font-size:17px;letter-spacing:.18em;font-weight:700;color:var(--gold);}
  .logo-mark{display:inline-block;filter:drop-shadow(0 0 6px rgba(240,192,64,.5));margin-right:2px;}
  .game-sub{font-size:8.5px;letter-spacing:.2em;text-transform:uppercase;
    color:var(--ink-soft);filter:brightness(1.6);margin-top:2px;}

  /* ---------- SCROLL AREA ---------- */
  .view{flex:1;overflow-y:auto;padding:4px 14px 14px;-webkit-overflow-scrolling:touch;}
  .view::-webkit-scrollbar{width:0;}

  /* ---------- CHAR CARD (compact, always on Hidup tab) ---------- */
  .charcard{background:linear-gradient(155deg,var(--card),var(--bg1));
    border:1px solid var(--line);border-radius:15px;padding:12px;position:relative;overflow:hidden;}
  .charcard::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;
    background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.6;}
  .chartop{display:flex;align-items:center;gap:11px;}
  .portrait{width:54px;height:54px;border-radius:13px;flex-shrink:0;display:flex;
    align-items:center;justify-content:center;font-size:30px;
    background:radial-gradient(circle at 35% 30%,#3a2c1e,#1c140d);border:1px solid var(--line);}
  .portrait.mage{box-shadow:0 0 16px rgba(91,110,225,.4);border-color:var(--arcane);}
  .cinfo{flex:1;min-width:0;}
  .cname{font-size:15px;font-weight:700;}
  .ctitle{font-size:10.5px;color:var(--gold);filter:brightness(1.3);font-style:italic;margin-top:1px;}
  .cage{font-size:10px;color:var(--ink-soft);filter:brightness(1.7);margin-top:3px;}
  .coin{font-size:11px;color:var(--gold-bright);font-weight:700;margin-top:3px;}

  .stats{display:grid;grid-template-columns:1fr 1fr;gap:7px 12px;margin-top:12px;}
  .statrow{display:flex;justify-content:space-between;font-size:9.5px;margin-bottom:2px;}
  .statname{color:var(--ink-soft);filter:brightness(1.7);text-transform:uppercase;letter-spacing:.03em;}
  .statval{font-variant-numeric:tabular-nums;font-weight:700;}
  .bar{height:6px;border-radius:4px;background:rgba(0,0,0,.35);overflow:hidden;}
  .fill{height:100%;border-radius:4px;transition:width .5s cubic-bezier(.4,0,.2,1);}
  .f-health{background:linear-gradient(90deg,#7a1f2b,#c0392b);}
  .f-happy{background:linear-gradient(90deg,#b8860b,#f0c040);}
  .f-might{background:linear-gradient(90deg,#5a3a1a,#a0622d);}
  .f-mind{background:linear-gradient(90deg,#3a4a7a,#6e8fd0);}
  .f-mana{background:linear-gradient(90deg,#3a2c6e,#8b9cff);}
  .f-charm{background:linear-gradient(90deg,#6e2a4a,#d06ea0);}

  /* ---------- LOG ---------- */
  .logbox{background:rgba(12,8,4,.5);border:1px solid var(--line);border-radius:13px;
    padding:11px 13px;margin-top:11px;display:flex;flex-direction:column-reverse;
    max-height:34vh;overflow-y:auto;}
  .entry{font-size:13px;line-height:1.55;padding:5px 0;
    border-bottom:1px solid rgba(184,134,11,.08);animation:fadein .35s;}
  .entry:first-child{border-bottom:none;}
  @keyframes fadein{from{opacity:0;transform:translateY(4px);}to{opacity:1;}}
  .yr{color:var(--gold);filter:brightness(1.2);font-weight:700;font-size:10px;margin-right:6px;}
  .e-good{color:var(--good);} .e-bad{color:var(--bad);}
  .e-arcane{color:var(--arcane-glow);}
  .e-epic{color:var(--gold);filter:brightness(1.3);font-weight:600;}
  .e-death{color:var(--blood);filter:brightness(1.5);font-weight:700;}

  /* ---------- SECTION HEADINGS ---------- */
  .sechead{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);
    filter:brightness(1.1);margin:16px 4px 9px;display:flex;align-items:center;gap:8px;}
  .sechead::after{content:"";flex:1;height:1px;background:var(--line);}
  .sechead:first-child{margin-top:6px;}

  /* ---------- TILES (activities/map/etc) ---------- */
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
  .tile{background:linear-gradient(155deg,var(--card),var(--bg1));border:1px solid var(--line);
    border-radius:13px;padding:12px;cursor:pointer;color:var(--parchment);font-family:inherit;
    text-align:left;transition:transform .1s,border-color .15s,box-shadow .15s;position:relative;}
  .tile:active{transform:scale(.97);}
  .tile:hover{border-color:var(--gold);}
  .tile .ti{font-size:24px;display:block;margin-bottom:6px;}
  /* QA v25: .tn & .td dulu INLINE — judul dan keterangan menyambung jadi satu
     baris ("Wabah PesHarga naik, nyawa terancam"), dan margin-top pada .td
     tidak berpengaruh sama sekali. Tersembunyi selama ini karena di tile
     2 kolom judul panjang kebetulan memenuhi barisnya; baru kelihatan jelas
     di tile .fullrow dan saat judulnya pendek. */
  .tile .tn{display:block;font-size:13px;font-weight:600;line-height:1.32;}
  .tile .td{display:block;font-size:9.5px;color:var(--ink-soft);filter:brightness(1.7);margin-top:4px;line-height:1.45;}
  .tile.locked{opacity:.45;}
  .tile.arcane{border-color:var(--line2);}
  .tile.arcane:hover{border-color:var(--arcane);}
  .tile .badge{position:absolute;top:8px;right:8px;font-size:8px;padding:2px 6px;border-radius:10px;
    background:rgba(184,134,11,.2);color:var(--gold-bright);font-weight:700;letter-spacing:.04em;}

  .fullrow{grid-column:1/-1;}

  /* ---------- RELATIONS ---------- */
  .relcard{background:linear-gradient(155deg,var(--card),var(--bg1));border:1px solid var(--line);
    border-radius:13px;padding:11px;margin-bottom:9px;}
  .reltop{display:flex;align-items:center;gap:10px;}
  .relav{width:42px;height:42px;border-radius:11px;flex-shrink:0;display:flex;align-items:center;
    justify-content:center;font-size:22px;background:radial-gradient(circle at 35% 30%,#3a2c1e,#1c140d);}
  .relinfo{flex:1;min-width:0;}
  .relname{font-size:13.5px;font-weight:600;}
  .relrole{font-size:10px;font-style:italic;margin-top:1px;}
  .reltop-open{cursor:pointer;border-radius:10px;transition:background .15s,transform .1s;}
  .reltop-open:active{background:rgba(184,134,11,.055);transform:scale(.995);}
  .reltop-open:focus-visible{outline:1px solid var(--gold);outline-offset:4px;}
  .reldetails{display:flex;flex-wrap:wrap;gap:4px 5px;margin-top:7px;}
  .reldetails span{padding:3px 6px;border-radius:6px;background:rgba(255,255,255,.035);
    border:1px solid rgba(184,134,11,.12);font-size:8.5px;color:var(--ink-soft);filter:brightness(1.65);line-height:1.2;}
  .reldetails b{color:var(--parchment);font-weight:600;}
  .role-pasangan{color:#d06ea0;} .role-bestie{color:var(--gold-bright);}
  .role-teman{color:var(--good);} .role-musuh{color:var(--bad);}
  .role-pengikut{color:var(--arcane-glow);} .role-keluarga{color:#c0a060;}
  .relbar{height:5px;border-radius:3px;background:rgba(0,0,0,.35);overflow:hidden;margin-top:6px;}
  .relfill{height:100%;border-radius:3px;transition:width .4s;}
  .relmeta{display:flex;justify-content:space-between;font-size:9px;color:var(--ink-soft);
    filter:brightness(1.7);margin-top:4px;}
  .relacts{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px;}
  .ra{font-size:10.5px;padding:6px 10px;border-radius:9px;background:rgba(255,255,255,.05);
    border:1px solid var(--line);color:var(--parchment);cursor:pointer;font-family:inherit;
    transition:transform .1s,background .15s;}
  .ra:active{transform:scale(.95);}
  .ra:hover{background:rgba(184,134,11,.12);}
  .ra.danger{border-color:rgba(139,38,53,.4);color:var(--bad);}
  .ra.love{border-color:rgba(208,110,160,.4);}

  /* ---------- ASSET ---------- */
  .asset{background:linear-gradient(155deg,var(--card),var(--bg1));border:1px solid var(--line);
    border-radius:13px;padding:12px;margin-bottom:9px;display:flex;align-items:center;gap:12px;}
  .assetico{font-size:30px;display:inline-flex;align-items:center;justify-content:center;min-width:34px;}
  .assetico img,.assetico .m-ico{width:30px;height:30px;}
  .assetinfo{flex:1;min-width:0;}
  .assetname{font-size:13.5px;font-weight:600;}
  .assetlvl{font-size:10px;color:var(--gold);filter:brightness(1.2);margin-top:2px;}
  .assetdesc{font-size:9.5px;color:var(--ink-soft);filter:brightness(1.7);margin-top:3px;}
  .upbtn{padding:9px 13px;border-radius:11px;border:none;background:linear-gradient(135deg,var(--gold),#9a6f08);
    color:#1a1208;font-family:inherit;font-size:11px;font-weight:700;cursor:pointer;flex-shrink:0;
    transition:transform .1s;white-space:nowrap;}
  .upbtn:active{transform:scale(.95);}
  .upbtn:disabled{opacity:.4;background:rgba(255,255,255,.1);color:var(--ink-soft);}

  /* ---------- MISSIONS ---------- */
  .mission{background:rgba(91,110,225,.06);border:1px solid var(--line2);border-radius:12px;
    padding:11px 13px;margin-bottom:9px;}
  .mtitle{font-size:13px;font-weight:600;color:var(--arcane-glow);}
  .mdesc{font-size:10.5px;color:var(--ink-soft);filter:brightness(1.7);margin-top:4px;line-height:1.4;}
  .mprog{font-size:10px;color:var(--gold);margin-top:6px;}
  .mreward{font-size:9.5px;color:var(--good);margin-top:3px;}

  /* ---------- DECISION MODAL ---------- */
  .modal{position:fixed;inset:0;background:rgba(8,5,2,.82);z-index:50;display:none;
    align-items:center;justify-content:center;padding:24px;backdrop-filter:blur(3px);}
  .modal.show{display:flex;}
  .modalbox{background:linear-gradient(155deg,#322a44,#1e1828);border:1px solid var(--line2);
    border-radius:18px;padding:18px;max-width:380px;width:100%;animation:rise .3s;}
  @keyframes rise{from{opacity:0;transform:translateY(14px);}to{opacity:1;}}
  .mico{font-size:28px;text-align:center;display:block;margin-bottom:10px;}
  .mprompt{font-size:14.5px;line-height:1.55;margin-bottom:15px;text-align:center;}
  .mchoices{display:flex;flex-direction:column;gap:8px;}
  .mchoice{min-height:44px;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:11px;
    padding:12px 13px;text-align:left;cursor:pointer;color:var(--parchment);font-family:inherit;
    font-size:13px;transition:transform .1s,background .15s,border-color .15s;}
  .mchoice:active{transform:scale(.98);}
  .mchoice:hover{background:rgba(139,156,255,.1);border-color:var(--arcane);}
  .mchoice .hint{display:block;font-size:9.5px;color:var(--ink-soft);filter:brightness(1.7);
    margin-top:3px;font-style:italic;}
  .mchoice .mc-label{font-size:13.5px;font-weight:600;display:block;}
  .mchoice .mc-sub{display:block;font-size:10.5px;color:var(--gold);filter:brightness(1.2);margin-top:2px;}
  .mchoice.love{border-color:rgba(208,110,160,.4);}
  .mchoice.danger{border-color:rgba(139,38,53,.45);}
  .mchoice.danger .mc-label{color:var(--bad);}
  .mc-cancel{text-align:center;color:var(--ink-soft);filter:brightness(1.6);font-size:12px;}
  .mchoices{max-height:60vh;overflow-y:auto;}

  /* ---------- TOAST ---------- */
  .toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);
    background:linear-gradient(135deg,#322a44,#1e1828);border:1px solid var(--line);
    border-radius:12px;padding:11px 16px;font-size:12.5px;max-width:90%;text-align:center;
    z-index:60;opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;line-height:1.4;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* ---------- AGE BUTTON (floats above tabbar on Hidup) ---------- */
  .agewrap{padding:10px 14px;flex-shrink:0;}
  .btn-age{width:100%;padding:15px;border-radius:14px;border:none;cursor:pointer;
    font-family:inherit;font-size:15px;font-weight:700;letter-spacing:.04em;
    background:linear-gradient(135deg,var(--gold),#9a6f08);color:#1a1208;
    transition:transform .1s;box-shadow:0 4px 16px rgba(184,134,11,.25);}
  .btn-age:active{transform:scale(.98);}
  .btn-age:disabled{opacity:.4;}

  /* ---------- TABBAR ---------- */
  .tabbar{display:flex;flex-shrink:0;border-top:1px solid var(--line);
    background:rgba(12,8,4,.7);backdrop-filter:blur(8px);
    padding-bottom:env(safe-area-inset-bottom);}
  .tab{flex:1;padding:9px 0 10px;background:none;border:none;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink-soft);
    filter:brightness(1.5);font-family:inherit;transition:color .15s,filter .15s;position:relative;}
  .tab.active{color:var(--gold);filter:brightness(1.2);}
  .tab .tabi{font-size:19px;}
  .tab .tabt{font-size:9px;letter-spacing:.04em;}
  /* ---------- 3-TAB: ikon lebih besar ---------- */
  .tab3{padding:11px 0 12px;gap:5px;}
  .tab3 .tabi{font-size:28px;line-height:1;}
  .tab3 .tabt{font-size:11px;letter-spacing:.05em;}
  /* ---------- SUB-TAB PILL (bar permanen di atas konten) ---------- */
  #globalSubbar{flex-shrink:0;padding:10px 16px 4px;}
  .subbar{display:flex;gap:7px;flex-wrap:wrap;}
  .subpill{flex:1;min-width:74px;padding:8px 10px;border-radius:10px;cursor:pointer;
    background:rgba(184,134,11,.07);border:1px solid rgba(184,134,11,.22);
    color:var(--ink-soft);filter:brightness(1.4);font-family:inherit;font-size:12.5px;font-weight:600;
    letter-spacing:.02em;display:flex;align-items:center;justify-content:center;gap:6px;position:relative;
    transition:background .15s,color .15s,border-color .15s;}
  .subpill.active{background:rgba(184,134,11,.18);border-color:var(--gold);color:var(--gold);filter:brightness(1.1);}
  .subpill-ico{display:inline-flex;align-items:center;font-size:15px;}
  .subpill .dot{position:absolute;top:5px;right:7px;width:7px;height:7px;border-radius:50%;}
  .tab .dot{position:absolute;top:6px;right:calc(50% - 18px);width:7px;height:7px;border-radius:50%;
    background:var(--blood);filter:brightness(1.4);display:none;}
  .tab .dot.on{display:block;}

  /* ---------- NET WORTH STRIP ---------- */
  .networth{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px;margin-top:11px;
    padding-top:11px;border-top:1px solid var(--line);}
  .nw-item{display:flex;flex-direction:column;align-items:center;gap:2px;}
  .nw-lbl{font-size:8px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);filter:brightness(1.6);}
  .nw-val{font-size:12px;font-weight:700;color:var(--gold-bright);font-variant-numeric:tabular-nums;}

  /* ---------- CUSTOMIZE SCREEN ---------- */
  .cust-wrap{padding:2px 2px 12px;}
  .cust-avatar{display:flex;justify-content:center;margin:6px 0 14px;}
  .cust-face{width:96px;height:96px;border-radius:24px;display:flex;align-items:center;
    justify-content:center;font-size:54px;background:radial-gradient(circle at 35% 30%,#3a2c1e,#150f09);
    border:1px solid var(--line);box-shadow:0 6px 24px rgba(0,0,0,.4);}
  .cust-field{margin-bottom:15px;}
  .cust-field>label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;
    color:var(--gold);filter:brightness(1.1);margin-bottom:7px;}
  .name-row{display:flex;gap:8px;}
  .nameinput{flex:1;padding:11px 13px;border-radius:11px;background:var(--card);
    border:1px solid var(--line);color:var(--parchment);font-family:inherit;font-size:14px;}
  .mini-btn{padding:0 14px;border-radius:11px;background:rgba(255,255,255,.06);
    border:1px solid var(--line);color:var(--parchment);font-size:16px;cursor:pointer;}
  .seg{display:flex;gap:8px;}
  .seg-btn{flex:1;padding:11px;border-radius:11px;background:var(--card);border:1px solid var(--line);
    color:var(--parchment);font-family:inherit;font-size:13px;cursor:pointer;transition:border-color .15s,background .15s;}
  .seg-btn.sel{border-color:var(--gold);background:rgba(184,134,11,.15);color:var(--gold-bright);font-weight:700;}
  .opt-row{display:flex;gap:8px;flex-wrap:wrap;}
  .optbtn{width:48px;height:48px;border-radius:12px;background:var(--card);border:1px solid var(--line);
    font-size:24px;cursor:pointer;transition:border-color .15s,transform .1s;}
  .optbtn.sel{border-color:var(--gold);box-shadow:0 0 10px rgba(184,134,11,.3);transform:scale(1.06);}
  .skill-alloc{display:flex;flex-direction:column;gap:11px;}
  .skillrow{}
  .skillrow .sk-name{font-size:12px;color:var(--parchment);}
  .sk-ctrl{display:flex;align-items:center;gap:12px;float:right;}
  .sk-btn{width:28px;height:28px;border-radius:8px;background:rgba(255,255,255,.06);
    border:1px solid var(--line);color:var(--gold-bright);font-size:16px;font-weight:700;cursor:pointer;
    display:flex;align-items:center;justify-content:center;}
  .sk-btn:active{transform:scale(.9);}
  .sk-val{font-size:14px;font-weight:700;min-width:26px;text-align:center;font-variant-numeric:tabular-nums;}

  /* ---------- CITY PICKER (kustomisasi) ---------- */
  .city-pick{display:flex;flex-direction:column;gap:9px;}
  .city-card{background:var(--card);border:1px solid var(--line);border-radius:13px;
    padding:12px;text-align:left;cursor:pointer;color:var(--parchment);font-family:inherit;
    transition:border-color .15s,transform .1s;}
  .city-card:active{transform:scale(.98);}
  .city-card.sel{border-color:var(--gold);box-shadow:0 0 12px rgba(184,134,11,.25);}
  .cc-top{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
  .cc-ico{font-size:22px;}
  .cc-name{font-size:14px;font-weight:700;}
  .cc-tag{font-size:9.5px;color:var(--ink-soft);filter:brightness(1.7);margin-left:auto;font-style:italic;}
  .cc-pros{font-size:10px;color:var(--good);line-height:1.4;}
  .cc-cons{font-size:10px;color:var(--bad);line-height:1.4;margin-top:2px;}

  /* ---------- CITY TILES (peta) ---------- */
  .city-tile.here{border-color:var(--gold);box-shadow:0 0 12px rgba(184,134,11,.2);}
  .tile.here{border-color:var(--gold);}
  .badge.dist{background:rgba(91,110,225,.2);color:var(--arcane-glow);}

  /* ---------- ANIMASI PENDEK ---------- */
  .anim-layer{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;
    pointer-events:none;}
  .anim-layer.show{display:flex;}
  .anim-box{background:rgba(8,5,2,.55);backdrop-filter:blur(2px);border-radius:24px;
    padding:34px 44px;animation:animPop .3s;}
  @keyframes animPop{from{transform:scale(.6);opacity:0;}to{transform:scale(1);opacity:1;}}
  .anim-clash{font-size:50px;display:flex;align-items:center;gap:4px;}
  .anim-clash .ac-l{display:inline-block;animation:clashL .5s ease-in-out infinite alternate;}
  .anim-clash .ac-r{display:inline-block;animation:clashR .5s ease-in-out infinite alternate;}
  .anim-clash .ac-spark{font-size:34px;animation:sparkPulse .4s infinite;}
  @keyframes clashL{from{transform:translateX(-6px) rotate(-12deg);}to{transform:translateX(6px) rotate(8deg);}}
  @keyframes clashR{from{transform:translateX(6px) rotate(12deg) scaleX(-1);}to{transform:translateX(-6px) rotate(-8deg) scaleX(-1);}}
  @keyframes sparkPulse{0%,100%{transform:scale(.7);opacity:.6;}50%{transform:scale(1.3);opacity:1;}}
  .anim-race{font-size:54px;display:flex;align-items:center;}
  .anim-race .ar-run{display:inline-block;animation:gallop .35s ease-in-out infinite;}
  .anim-race .ar-dust{font-size:32px;animation:dustTrail .5s infinite;}
  @keyframes gallop{0%,100%{transform:translateY(0) rotate(-3deg);}50%{transform:translateY(-8px) rotate(3deg);}}
  @keyframes dustTrail{0%{opacity:.2;transform:translateX(0) scale(.8);}100%{opacity:.7;transform:translateX(-14px) scale(1.2);}}
  .anim-dice{font-size:60px;animation:diceRoll .6s ease-out;}
  @keyframes diceRoll{0%{transform:rotate(0) scale(.5);}60%{transform:rotate(380deg) scale(1.2);}100%{transform:rotate(360deg) scale(1);}}
  .anim-cards{font-size:60px;animation:cardFlip .6s ease-out;}
  @keyframes cardFlip{0%{transform:rotateY(0) scale(.6);}100%{transform:rotateY(360deg) scale(1);}}
  .anim-burst{font-size:56px;text-align:center;animation:burstIn .4s;display:flex;flex-direction:column;align-items:center;gap:6px;}
  .anim-burst.sad{filter:grayscale(.3);}
  .anim-burst .ab-sub{font-size:15px;font-weight:700;color:var(--gold-bright);letter-spacing:.05em;}
  .anim-burst.sad .ab-sub{color:var(--bad);}
  @keyframes burstIn{0%{transform:scale(.3) translateY(10px);opacity:0;}60%{transform:scale(1.15);}100%{transform:scale(1);opacity:1;}}

  .school-strip{font-size:11px;color:var(--arcane-glow);background:rgba(91,110,225,.08);
    border:1px solid var(--line2);border-radius:10px;padding:7px 11px;margin-top:10px;
    text-align:center;letter-spacing:.02em;}

  /* ---------- BACK BUTTON (pojok kanan atas) ---------- */
  .topbar{position:relative;}
  .back-btn{position:absolute;right:14px;top:calc(var(--app-safe-top) + 10px);display:none;align-items:center;gap:5px;
    background:rgba(91,110,225,.16);border:1px solid var(--line2);border-radius:20px;
    padding:6px 12px 6px 10px;color:var(--arcane-glow);font-family:inherit;font-size:11px;
    cursor:pointer;max-width:140px;transition:transform .1s,background .15s;}
  .back-btn.show{display:flex;}
  .back-btn:active{transform:scale(.95);}
  .back-btn .bb-ico{font-size:13px;}
  .back-btn .bb-label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100px;font-weight:600;}

  /* ---------- RESULT POPUP ---------- */
  .res-title{font-size:16px;font-weight:700;margin-bottom:8px;color:var(--gold-bright);}
  .res-title.e-bad{color:var(--bad);} .res-title.e-death{color:var(--blood);filter:brightness(1.4);}
  .res-title.e-epic{color:var(--gold-bright);} .res-title.e-arcane{color:var(--arcane-glow);}
  .res-body{font-size:14px;line-height:1.55;color:var(--parchment);}
  .res-deltas{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px;justify-content:center;}
  .res-delta{font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;letter-spacing:.02em;}
  .res-delta.up{background:rgba(52,211,153,.14);color:var(--good);}
  .res-delta.down{background:rgba(208,90,90,.14);color:var(--bad);}
  .mc-ok{text-align:center;background:linear-gradient(135deg,var(--gold),#9a6f08)!important;
    color:#1a1208!important;font-weight:700;border:none!important;}

  /* ---------- PEWARISAN (game over) ---------- */
  .inherit-box{margin-top:18px;padding:16px;border-radius:14px;
    background:rgba(91,110,225,.1);border:1px solid var(--line2);text-align:left;}
  .inherit-box.noheir{background:rgba(120,40,40,.1);border-color:rgba(180,80,80,.3);}
  .inherit-title{font-size:14px;font-weight:700;color:var(--gold-bright);margin-bottom:6px;text-align:center;}
  .inherit-box.noheir .inherit-title{color:var(--blood);filter:brightness(1.4);}
  .inherit-desc{font-size:12px;line-height:1.55;color:var(--parchment);margin-bottom:12px;}
  .inherit-heirs{display:flex;flex-direction:column;gap:8px;}
  .heir-btn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;
    background:linear-gradient(135deg,rgba(184,134,11,.2),rgba(91,110,225,.12));
    border:1px solid var(--line2);border-radius:10px;padding:10px 14px;
    color:var(--parchment);font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;
    transition:transform .1s,border-color .15s;}
  .heir-btn:active{transform:scale(.97);}
  .heir-btn:hover{border-color:var(--gold);}
  .heir-sub{font-size:10.5px;font-weight:400;color:var(--arcane-glow);}

  /* ---------- PETA DUNIA SVG ---------- */
  .map-wrap{margin:4px 2px 14px;border-radius:14px;overflow:hidden;
    border:1px solid var(--line2);box-shadow:inset 0 2px 12px rgba(0,0,0,.4);
    background:#171019;}
  .world-map{display:block;width:100%;height:auto;}
  .map-city text{pointer-events:none;font-family:'Cormorant Garamond',serif;}
  .map-city:active{opacity:.8;}

  /* ---------- ANIMASI PERJALANAN ---------- */
  .travel-box{background:rgba(8,5,2,.75);backdrop-filter:blur(3px);border-radius:18px;
    padding:18px;border:1px solid var(--line2);max-width:340px;width:88vw;animation:animPop .3s;}
  .travel-cap{text-align:center;font-size:13px;color:var(--gold-bright);margin-bottom:10px;
    letter-spacing:.04em;font-family:'Cormorant Garamond',serif;}
  .travel-map{display:block;width:100%;height:auto;border-radius:12px;}

  /* ---------- OVERVIEW KARAKTER ---------- */
  .ov-name{font-size:17px;font-weight:700;color:var(--gold-bright);text-align:center;margin-bottom:12px;
    font-family:'Cormorant Garamond',serif;}
  .ov-table{display:flex;flex-direction:column;gap:1px;background:var(--line2);border-radius:10px;overflow:hidden;margin-bottom:10px;}
  .ov-row{display:flex;justify-content:space-between;gap:10px;padding:7px 11px;background:rgba(30,24,40,.92);font-size:12px;}
  .ov-k{color:var(--ink-soft);filter:brightness(1.5);flex-shrink:0;}
  .ov-v{color:var(--parchment);text-align:right;}
  .ov-progress{font-size:10.5px;color:var(--arcane-glow);text-align:center;margin-bottom:4px;line-height:1.4;}
  .rel-tap{font-size:10px;color:var(--arcane-glow);font-weight:400;opacity:.7;}
  .relclickable:active{opacity:.8;}

  /* ---------- ANIMASI HALUS & OPTIMASI ---------- */
  .fill{transition:width .5s cubic-bezier(.4,0,.2,1);}
  @keyframes panelIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  @keyframes yearFade{0%{opacity:.4;}100%{opacity:1;}}
  @keyframes coinFlash{0%{transform:scale(1);text-shadow:none;}40%{transform:scale(1.18);text-shadow:0 0 10px var(--gold-bright);}100%{transform:scale(1);text-shadow:none;}}
  /* kartu & tile masuk halus */
  .tile{animation:tileIn .3s ease-out backwards;}
  @keyframes tileIn{from{opacity:0;transform:scale(.97);}to{opacity:1;transform:scale(1);}}
  /* hormati pengguna yg ingin gerakan minimal (hemat baterai & aksesibilitas) */
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:.001s!important;transition-duration:.001s!important;}
  }

  /* ---------- SAVE SYSTEM ---------- */
  .continue-btn{background:linear-gradient(135deg,#2e7d52,#1a5e3a)!important;
    border:1px solid rgba(120,220,160,.4)!important;margin-bottom:14px;}
  .save-row{display:flex;gap:8px;margin:10px 2px 0;}
  /* QA v25: ambang sentuh minimum 44px (pedoman iOS/Android). */
  .save-btn{flex:1;min-height:44px;background:rgba(91,110,225,.12);border:1px solid var(--line2);
    border-radius:10px;padding:9px;color:var(--arcane-glow);font-family:inherit;font-size:12px;
    font-weight:600;cursor:pointer;transition:transform .1s;}
  .save-btn:active{transform:scale(.96);}
  .save-btn.danger{background:rgba(160,50,50,.12);color:#e08a8a;border-color:rgba(180,80,80,.3);}

  /* ---------- TOKO PREMIUM (IAP) ---------- */
  .prem-tile{border:1px solid rgba(184,134,11,.3);background:linear-gradient(155deg,rgba(184,134,11,.06),rgba(91,110,225,.04));}
  .prem-tile.owned{border-color:rgba(120,220,160,.4);background:linear-gradient(155deg,rgba(46,125,82,.1),rgba(91,110,225,.04));}
  .prem-tile .td{color:var(--gold-bright);font-weight:600;}
  .prem-tile.owned .td{color:#7fd9a0;}

  /* ---------- MULTI-SLOT SAVE ---------- */
  .slot-head{font-size:11px;color:var(--ink-soft);filter:brightness(1.5);letter-spacing:.08em;
    text-transform:uppercase;margin:14px 4px 8px;}
  .slot-card{display:flex;align-items:center;gap:8px;background:rgba(30,24,40,.6);
    border:1px solid var(--line2);border-radius:12px;padding:10px 12px;margin-bottom:8px;}
  .slot-info{flex:1;cursor:pointer;}
  .slot-name{font-size:15px;font-weight:600;color:var(--parchment);font-family:'Cormorant Garamond',serif;}
  .slot-dead{color:#a05858;}
  .slot-meta{font-size:11px;color:var(--ink-soft);filter:brightness(1.5);margin-top:2px;}
  .slot-del{background:rgba(160,50,50,.12);border:1px solid rgba(180,80,80,.25);border-radius:8px;
    padding:7px 9px;cursor:pointer;font-size:13px;}
  .slot-new{width:100%;background:rgba(91,110,225,.1);border:1px dashed rgba(139,156,255,.35);
    border-radius:12px;padding:11px;color:var(--arcane-glow);font-family:inherit;font-size:13px;
    font-weight:600;cursor:pointer;margin-top:2px;}
  .slot-new:active{transform:scale(.98);}
  .slot-full{text-align:center;font-size:11.5px;color:var(--ink-soft);filter:brightness(1.5);
    padding:10px;border:1px dashed var(--line2);border-radius:12px;}

  /* ---------- IKON GAMBAR KUSTOM ---------- */
  .origin .oico img{width:40px!important;height:40px!important;object-fit:contain;}
  .m-ico{object-fit:contain;vertical-align:middle;}

  /* ---------- PANEL SEKOLAH ---------- */
  .sch-name{font-family:'Cinzel',serif;font-size:17px;color:var(--gold);margin-bottom:2px;}
  .sch-spec{font-size:11px;color:var(--arcane-glow);letter-spacing:.04em;margin-bottom:8px;}
  .sch-blurb{font-size:12px;color:var(--ink-soft);filter:brightness(1.5);line-height:1.5;margin-bottom:8px;}
  .sch-status{font-size:11px;color:var(--gold);filter:brightness(1.1);margin-bottom:6px;}
  .sch-major{font-size:12px;color:var(--ink);background:rgba(184,134,11,.1);border:1px solid rgba(184,134,11,.3);border-radius:8px;padding:8px 10px;margin-top:6px;line-height:1.5;}
  .sch-careers{font-size:10.5px;color:var(--arcane-glow);}
  .sch-locked{font-size:12px;color:#d8a657;background:rgba(216,166,87,.1);border:1px solid rgba(216,166,87,.3);border-radius:8px;padding:9px 11px;margin-top:8px;line-height:1.5;text-align:center;}

  .hidden{display:none !important;}

  /* ---------- START SCREEN ---------- */
  .start{padding:8px 4px;}
  .start p{font-size:13px;line-height:1.6;color:var(--ink-soft);filter:brightness(1.6);
    margin-bottom:16px;text-align:center;}
  .origin{background:linear-gradient(155deg,var(--card),var(--bg1));border:1px solid var(--line);
    border-radius:14px;padding:13px;text-align:left;cursor:pointer;color:var(--parchment);
    font-family:inherit;transition:transform .1s,border-color .15s;display:flex;align-items:center;
    gap:13px;margin-bottom:10px;width:100%;}
  .origin:active{transform:scale(.98);}
  .origin.sel{border-color:var(--gold);box-shadow:0 0 14px rgba(184,134,11,.25);}
  .origin .oico{font-size:28px;}
  .origin .oname{font-size:14px;font-weight:700;}
  .origin .odesc{font-size:10.5px;color:var(--ink-soft);filter:brightness(1.7);margin-top:3px;line-height:1.4;}

  /* ---------- GAME OVER ---------- */
  .gameover{text-align:center;padding:30px 10px;}
  .gameover .crest{font-size:48px;}
  .gameover h2{color:var(--blood);filter:brightness(1.5);font-size:20px;letter-spacing:.1em;margin:8px 0;}
  .epitaph{font-size:13px;line-height:1.7;margin:14px 0 22px;font-style:italic;}
  /* Layar game-over = overlay penuh layar (menutup nav & tab di belakang) */
  #overScreen:not(.hidden){
    position:fixed; inset:0; z-index:100000;
    background:
      radial-gradient(ellipse 130% 60% at 50% -5%, #2e2440 0%, transparent 50%),
      radial-gradient(ellipse 100% 45% at 50% 105%, #1a1208 0%, transparent 50%),
      var(--bg0);
    overflow-y:auto; -webkit-overflow-scrolling:touch;
    display:flex; align-items:flex-start; justify-content:center;
    padding:calc(env(safe-area-inset-top,0px) + 24px) 16px calc(env(safe-area-inset-bottom,0px) + 48px);
    animation:panelIn .25s ease-out;
  }
  #overScreen:not(.hidden) .gameover{width:100%;max-width:430px;}

  /* ================================================================
     UI POLISH v1 — lebih eye-catching, tetap hemat & nyaman
     ================================================================ */
  .game-title{background:linear-gradient(180deg,#ffe9a8,#f0c040 45%,#b8860b);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
  .logo-mark{-webkit-text-fill-color:initial;}
  .view:not(.hidden){animation:panelIn .22s ease-out;}
  .charcard{box-shadow:0 8px 26px rgba(0,0,0,.35);}
  .bar{border:1px solid rgba(255,255,255,.05);}
  .tile:hover{box-shadow:0 0 14px rgba(240,192,64,.15);}
  .modalbox{box-shadow:0 14px 50px rgba(0,0,0,.6),0 0 24px rgba(91,110,225,.12);}
  .toast{border-color:rgba(240,192,64,.35);box-shadow:0 8px 26px rgba(0,0,0,.5);}
  .btn-age{position:relative;overflow:hidden;}
  .btn-age::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;
    background:linear-gradient(100deg,transparent,rgba(255,255,255,.3),transparent);
    transform:skewX(-20deg);animation:btnSheen 3.4s ease-in-out infinite;pointer-events:none;}
  @keyframes btnSheen{0%,55%{left:-60%;}85%,100%{left:130%;}}
  .tab3 .tabi{transition:transform .15s,filter .15s;}
  .tab3.active::before{content:"";position:absolute;top:0;left:22%;right:22%;height:2.5px;
    border-radius:0 0 4px 4px;background:linear-gradient(90deg,transparent,var(--gold-bright),transparent);
    box-shadow:0 2px 8px rgba(240,192,64,.5);}
  .tab3.active .tabi{filter:drop-shadow(0 0 6px rgba(240,192,64,.55));transform:scale(1.08);}
  .subpill.active{box-shadow:0 0 10px rgba(240,192,64,.18),inset 0 0 8px rgba(240,192,64,.08);}

  /* ================================================================
     PENUNJUK TAKDIR — tutorial spotlight + panduan tahap hidup
     ================================================================ */
  .tut-overlay{position:fixed;inset:0;z-index:90;display:none;}
  .tut-overlay.show{display:block;}
  .tut-hole{position:absolute;border-radius:14px;border:2px solid var(--gold-bright);
    box-shadow:0 0 0 200vmax rgba(6,3,10,.8);pointer-events:none;
    transition:all .35s cubic-bezier(.4,0,.2,1);animation:tutPulse 1.6s ease-in-out infinite;}
  @keyframes tutPulse{
    0%,100%{box-shadow:0 0 0 200vmax rgba(6,3,10,.8),0 0 0 0 rgba(240,192,64,.5);}
    50%{box-shadow:0 0 0 200vmax rgba(6,3,10,.8),0 0 14px 4px rgba(240,192,64,.35);}}
  .tut-hole.tut-center{border:none;animation:none;box-shadow:0 0 0 200vmax rgba(6,3,10,.86);}
  .tut-card{position:absolute;max-width:330px;background:linear-gradient(160deg,#332948,#1d1728 70%);
    border:1px solid rgba(240,192,64,.4);border-radius:16px;padding:15px 16px 13px;
    box-shadow:0 16px 50px rgba(0,0,0,.65),0 0 28px rgba(91,110,225,.15);
    transition:top .35s cubic-bezier(.4,0,.2,1),left .35s cubic-bezier(.4,0,.2,1);animation:rise .3s;}
  .tut-card.centered{left:50% !important;top:50% !important;transform:translate(-50%,-50%) !important;
    width:calc(100vw - 48px) !important;max-width:330px;}
  .tut-head{display:flex;align-items:center;gap:9px;margin-bottom:7px;}
  .tut-mascot{font-size:26px;filter:drop-shadow(0 0 8px rgba(139,156,255,.6));animation:tutBob 2.4s ease-in-out infinite;}
  @keyframes tutBob{0%,100%{transform:translateY(0);}50%{transform:translateY(-4px);}}
  .tut-title{font-size:14.5px;font-weight:700;color:var(--gold-bright);letter-spacing:.02em;}
  .tut-step{font-size:9.5px;color:var(--arcane-glow);letter-spacing:.06em;margin-top:1px;}
  .tut-body{font-size:12.5px;line-height:1.6;color:var(--parchment);}
  .tut-dots{display:flex;gap:5px;justify-content:center;margin:11px 0 10px;}
  .tut-dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.15);transition:background .2s,transform .2s;}
  .tut-dot.on{background:var(--gold-bright);transform:scale(1.25);box-shadow:0 0 6px rgba(240,192,64,.6);}
  .tut-btns{display:flex;gap:8px;}
  .tut-skip{flex:1;padding:10px;border-radius:10px;background:rgba(255,255,255,.05);border:1px solid var(--line);
    color:var(--ink-soft);filter:brightness(1.7);font-family:inherit;font-size:12px;cursor:pointer;}
  .tut-next{flex:1.6;padding:10px;border-radius:10px;border:none;background:linear-gradient(135deg,var(--gold),#9a6f08);
    color:#1a1208;font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer;
    box-shadow:0 4px 14px rgba(184,134,11,.3);}
  .tut-next:active,.tut-skip:active{transform:scale(.96);}
  .guide-pop{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(16px);
    width:calc(100% - 32px);max-width:398px;z-index:45;
    background:linear-gradient(160deg,#2f2744,#1c1626 75%);border:1px solid rgba(139,156,255,.4);
    border-radius:16px;padding:13px 14px;box-shadow:0 14px 44px rgba(0,0,0,.6);
    /* QA v25: dulu hanya opacity:0 — elemennya tetap ada di pohon
       aksesibilitas, jadi pembaca layar membacakan panduan yang tak terlihat.
       visibility:hidden menyembunyikannya sungguhan. */
    opacity:0;visibility:hidden;pointer-events:none;transition:opacity .35s,transform .35s,visibility .35s;}
  .guide-pop.show{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0);pointer-events:auto;}
  .gp-head{display:flex;align-items:center;gap:9px;margin-bottom:6px;}
  .gp-ico{font-size:24px;filter:drop-shadow(0 0 7px rgba(240,192,64,.5));}
  .gp-title{font-size:13.5px;font-weight:700;color:var(--gold-bright);}
  .gp-tag{font-size:9px;color:var(--arcane-glow);letter-spacing:.08em;text-transform:uppercase;}
  .gp-body{font-size:12px;line-height:1.55;color:var(--parchment);}
  .gp-btns{display:flex;gap:8px;margin-top:10px;}
  .gp-ok{flex:1.6;padding:9px;border-radius:9px;border:none;background:linear-gradient(135deg,var(--arcane),#3f4da8);
    color:#fff;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;}
  .gp-off{flex:1;min-height:44px;padding:9px;border-radius:9px;background:rgba(255,255,255,.05);border:1px solid var(--line);
    color:var(--ink-soft);filter:brightness(1.6);font-family:inherit;font-size:10.5px;cursor:pointer;}
  .tut-help{position:absolute;left:14px;top:calc(var(--app-safe-top) + 10px);width:44px;height:44px;border-radius:50%;
    background:rgba(184,134,11,.14);border:1px solid rgba(240,192,64,.35);color:var(--gold-bright);font-size:17px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;transition:transform .1s,box-shadow .15s;}
  .tut-help:active{transform:scale(.92);}
  .tut-help:hover{box-shadow:0 0 10px rgba(240,192,64,.3);}
  .tut-help.tut-exit{left:54px;font-size:14px;background:rgba(91,110,225,.12);
    border-color:rgba(139,156,255,.35);}
  .birth-tale{font-style:italic;line-height:1.75;text-align:left;font-size:13.5px;
    color:var(--parchment);}
  .birth-tale b{color:var(--gold-bright);font-style:normal;}

  /* ================================================================
     SPLASH SCREEN — pembuka animasi khas Mantara
     ================================================================ */
  .splash{position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;
    align-items:center;justify-content:center;overflow:hidden;cursor:pointer;background-color:#100c13;background:
    radial-gradient(circle at 50% 45%,rgba(77,57,99,.52) 0%,rgba(30,22,38,.88) 34%,#100c13 72%);
    transition:opacity .48s ease,filter .48s ease;isolation:isolate;}
  .splash::before{content:"";position:absolute;inset:-25%;z-index:-2;background:
    conic-gradient(from 28deg at 50% 50%,transparent 0 15%,rgba(232,184,61,.025) 17%,transparent 19% 40%,rgba(122,103,172,.035) 42%,transparent 44% 100%);
    animation:spSkyTurn 18s linear infinite;}
  .splash.out{opacity:0;filter:blur(3px);pointer-events:none;}
  .sp-aura{position:absolute;width:min(86vw,390px);aspect-ratio:1;border-radius:50%;opacity:0;
    background:radial-gradient(circle,rgba(232,184,61,.19),rgba(232,184,61,.05) 36%,transparent 68%);
    filter:blur(9px);transform:scale(.68);}
  .splash.play .sp-aura{animation:spAura 2.4s ease-in-out .18s forwards;}
  .sp-stars{position:absolute;inset:0;pointer-events:none;}
  .sp-stars i{position:absolute;width:3px;height:3px;border-radius:50%;background:#e8b83d;opacity:0;box-shadow:0 0 10px rgba(232,184,61,.7);}
  .sp-stars i:nth-child(1){left:18%;top:29%;animation-delay:.18s}.sp-stars i:nth-child(2){left:79%;top:25%;animation-delay:.42s}
  .sp-stars i:nth-child(3){left:27%;top:72%;animation-delay:.7s}.sp-stars i:nth-child(4){left:72%;top:75%;animation-delay:.92s}
  .sp-stars i:nth-child(5){left:12%;top:55%;animation-delay:1.12s}.sp-stars i:nth-child(6){left:88%;top:53%;animation-delay:1.3s}
  .splash.play .sp-stars i{animation-name:spStarWake;animation-duration:1.5s;animation-timing-function:ease-in-out;animation-fill-mode:forwards;}
  .sp-logo{position:relative;width:min(48vw,210px);aspect-ratio:96/112;opacity:0;transform:scale(.86) translateY(6px);
    filter:drop-shadow(0 0 18px rgba(232,184,61,.32));}
  .splash.play .sp-logo{animation:spLogoEnter .52s cubic-bezier(.2,.75,.2,1) .24s forwards;}
  .sp-sigil{display:block;width:100%;height:100%;overflow:visible;}
  .sp-shield,.sp-monogram,.sp-arc{fill:none;stroke:url(#spGold);stroke:#e8b83d;stroke-linecap:round;stroke-linejoin:round;}
  .sp-shield{stroke-width:3.7;stroke-dasharray:310;stroke-dashoffset:310;}
  .sp-monogram{stroke-width:5.6;stroke-dasharray:170;stroke-dashoffset:170;}
  .sp-arc{stroke-width:2.7;stroke-dasharray:48;stroke-dashoffset:48;}
  .splash.play .sp-shield{animation:spDraw .78s ease-out .28s forwards;}
  .splash.play .sp-monogram{animation:spDraw .72s ease-in-out .78s forwards;}
  .splash.play .sp-arc{animation:spDraw .38s ease-out 1.28s forwards;}
  .sp-cities{fill:#f5ca55;opacity:0;transform-origin:48px 56px;transform:scale(.2);}
  .splash.play .sp-cities{animation:spCities .48s cubic-bezier(.17,.88,.38,1.45) 1.38s forwards;}
  .sp-title{margin-top:18px;font-size:clamp(25px,7.8vw,34px);font-weight:700;letter-spacing:.32em;text-indent:.32em;
    background:linear-gradient(180deg,#ffe99b,#e8b83d 54%,#aa6815);-webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;opacity:0;transform:translateY(12px);}
  .splash.play .sp-title{animation:spWord .48s ease-out 1.58s forwards;}
  .sp-sub{margin-top:7px;font-size:10px;letter-spacing:.33em;text-indent:.33em;color:#ae9679;text-transform:uppercase;
    opacity:0;transform:translateY(8px);}
  .splash.play .sp-sub{animation:spWord .48s ease-out 1.84s forwards;}
  @keyframes spDraw{to{stroke-dashoffset:0}}
  @keyframes spLogoEnter{to{opacity:1;transform:scale(1) translateY(0)}}
  @keyframes spCities{to{opacity:1;transform:scale(1)}}
  @keyframes spWord{to{opacity:1;transform:translateY(0)}}
  @keyframes spAura{0%{opacity:0;transform:scale(.68)}55%{opacity:1;transform:scale(1.06)}100%{opacity:.7;transform:scale(.98)}}
  @keyframes spStarWake{0%{opacity:0;transform:scale(.2)}50%{opacity:.95;transform:scale(1.7)}100%{opacity:.35;transform:scale(1)}}
  @keyframes spSkyTurn{to{transform:rotate(360deg)}}
  @media(prefers-reduced-motion:reduce){.splash::before,.sp-stars i{animation:none!important}.splash.play .sp-logo,.splash.play .sp-title,.splash.play .sp-sub,.splash.play .sp-aura{animation-duration:.28s;animation-delay:.05s}.splash.play .sp-shield,.splash.play .sp-monogram,.splash.play .sp-arc{animation-duration:.01s;animation-delay:.05s}.splash.play .sp-cities{animation-duration:.01s;animation-delay:.05s}}

  /* ================================================================
     BIDIKAN TAKDIR — minigame timing (berburu, dll.)
     ================================================================ */
  .ss-ov{position:fixed;inset:0;z-index:95;display:none;align-items:center;justify-content:center;
    background:rgba(8,5,2,.85);backdrop-filter:blur(3px);padding:22px;}

  .ss-panel{background:linear-gradient(160deg,#332948,#1d1728 70%);border:1px solid rgba(240,192,64,.4);

  .ss-title{font-size:15px;font-weight:700;color:var(--gold-bright);margin-bottom:3px;}

  .ss-track{position:relative;height:30px;border-radius:15px;background:rgba(0,0,0,.45);
    border:1px solid var(--line);overflow:hidden;margin-bottom:14px;}
  .ss-zone{position:absolute;top:0;bottom:0;}
  .ss-zone.silver{background:rgba(139,156,255,.16);}
  .ss-zone.gold{background:linear-gradient(180deg,rgba(240,192,64,.5),rgba(184,134,11,.35));
    box-shadow:0 0 12px rgba(240,192,64,.4);}
  .ss-marker{position:absolute;top:-2px;bottom:-2px;width:4px;border-radius:2px;background:#fff;
    box-shadow:0 0 10px rgba(255,255,255,.9),0 0 20px rgba(240,192,64,.6);}
  .ss-btn{width:100%;padding:14px;border-radius:13px;border:none;cursor:pointer;

  .ss-res{font-size:24px;font-weight:700;margin:6px 0 2px;animation:burstIn .35s;}
  .ss-res.perfect{color:var(--gold-bright);text-shadow:0 0 14px rgba(240,192,64,.7);}
  .ss-res.good{color:var(--good);}
  .ss-res.miss{color:var(--bad);}

  /* ================================================================
     SISTEM SUB-HALAMAN (ala BitLife) — halaman penuh + tombol back
     ================================================================ */
  .mpage{position:absolute;inset:0;z-index:30;display:none;flex-direction:column;
    background:linear-gradient(180deg,#1d1510 0%,#16110c 100%);}
  .mpage.show{display:flex;animation:pageIn .22s ease-out;}
  @keyframes pageIn{from{transform:translateX(46px);opacity:.35;}to{transform:none;opacity:1;}}
  .mp-head{display:flex;align-items:center;gap:10px;flex-shrink:0;

  .mp-back{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);

  .mp-back:active{transform:scale(.9);}
  .mp-title{flex:1;font-size:14px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
    color:var(--gold-bright);text-align:center;margin-right:34px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  .pg-sec{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);

  .pg-row.dim{opacity:.45;}
  .pg-ico{font-size:25px;min-width:32px;text-align:center;flex-shrink:0;}
  .pg-main{flex:1;min-width:0;}
  .pg-title{font-size:14px;font-weight:600;color:var(--parchment);}
  .pg-sub{font-size:10.5px;color:var(--ink-soft);filter:brightness(1.7);margin-top:2px;line-height:1.4;}
  .pg-bar{height:6px;border-radius:4px;background:rgba(0,0,0,.4);overflow:hidden;margin-top:6px;max-width:180px;

<body>
<div class="ambient" id="ambient"></div>
<div class="phone">
  <div class="topbar">

  </div>

  <div class="view" id="startScreen">

  <div class="view hidden" id="customizeScreen"></div>

  <div id="globalSubbar" class="hidden"></div>
  <div class="view hidden" id="viewHidup"></div>
  <div class="view hidden" id="viewAktivitas"></div>
  <div class="view hidden" id="viewRelasi"></div>
  <div class="view hidden" id="viewPeta"></div>
  <div class="view hidden" id="viewAset"></div>
  <div class="view hidden" id="viewInventory"></div>
  <div class="view hidden" id="viewToko"></div>
  <div class="view hidden" id="viewKarir"></div>

  <!-- GAME OVER -->
  <div class="view hidden" id="overScreen">
    <div class="gameover">
      <div class="crest">⚰️</div><h2>RIWAYAT BERAKHIR</h2>
      <div class="epitaph" id="epitaph"></div>
      <button class="btn-age" onclick="restart()">Lahir Kembali</button>
    </div>
  </div>

  <div class="agewrap hidden" id="agewrap">
    <button class="btn-age" id="btnAge" onclick="advanceYear()">Lanjut Tahun ▸</button>
  </div>

  <!-- TABBAR -->
  <div class="tabbar hidden" id="tabbar">
    <button class="tab active" data-view="Hidup" onclick="switchTab('Hidup')">
      <span class="tabi">📜</span><span class="tabt">Hidup</span></button>
    <button class="tab" data-view="Aktivitas" onclick="switchTab('Aktivitas')">
      <span class="tabi">⚔️</span><span class="tabt">Aksi</span></button>
    <button class="tab" data-view="Relasi" onclick="switchTab('Relasi')">
